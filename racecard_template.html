      <td class="r num" title="${f.pos_gain != null ? `${Math.abs(f.pos_gain)} Plätze ${f.pos_gain >= 0 ? "gewonnen" : "verloren"} von 800 m bis ins Ziel${Math.abs(f.pos_gain) >= 3 ? " – auffällig (ab 3 Plätzen)" : ""}` : ""}"><span class="${f.pos_gain >= 3 ? "hl-up" : f.pos_gain <= -3 ? "hl-down" : ""}">${f.pos_gain != null ? sgn(f.pos_gain, 0) : "–"}</span></td>
      <td class="r num" title="${f.weg_med != null ? `${fx(Math.abs(f.weg_med),1)} m ${f.weg_med >= 0 ? "mehr" : "weniger"} gelaufen als der Median des Feldes (≈ ${fx(Math.abs(f.weg_med)/2.4,1)} Längen)${Math.abs(f.weg_med) >= 7.5 ? (f.weg_med > 0 ? " – auffällig viel Weg (Nachteil, meist weit außen)" : " – auffällig wenig Weg (Vorteil, innen)") : ""}` : ""}"><span class="${f.weg_med >= 7.5 ? "hl-down" : f.weg_med <= -7.5 ? "hl-up" : ""}">${f.weg_med != null ? sgn(f.weg_med, 1) : "–"}</span></td>
      ${trCell(f, wHeute)}${fsCell(f.fs, f.fs_opt, "Opt", "FS% des Pferdes: Tempo der letzten " + (f.dist > 1600 ? 600 : 400) + " m ÷ Durchschnittstempo × 100; klein: optimaler FS% für Kurs × Distanz und Boden")}
    </tr>${cmt ? `<tr class="cmt ${f.unreliable ? "unrel" : ""}"><td colspan="12">${cmt}</td></tr>` : ""}${offen ? `<tr class="rivrow"><td colspan="12">${rivalsHTML(f.rivals)}</td></tr>` : ""}`; }).join("");
  return `<div class="scroll"><table class="formtab"><thead><tr>
    <th>Datum · Bahn</th><th>Dist · Boden · Preis · Typ</th><th>Pos · Gew. · Jockey · Quote</th><th class="r" title="Valeur (handicapValeur) in diesem Rennen; klein: heutige Valeur − damalige (grün: heute niedriger eingestuft, rot: höher)">Val</th>
    <th class="r" title="ARR: Leistung im Rennen gemessen an den Pferden im vorderen Drittel des Einlaufs (kg), groß bereinigt auf das heutige Gewicht = ARR − Gewicht heute + ${DATA.params.weight_ref}, klein roh">ARR</th>
    <th title="Position ${DATA.params.pos_before_m} m vor dem Ziel als Fünftel des Feldes">Pos. vor Finish</th>
    <th title="Tempo frühe Phase / Tempo Schlussphase × 100">Pace-Ratio</th>
    <th class="r" title="Endspeed (letzte 400 m) ÷ Tempo davor × 100; klein: bereinigt in Indexpunkten">Finish-Idx</th><th class="r" title="Plätze gut gemacht von 800 m bis Ziel">±800</th><th class="r" title="Gelaufene Meter mehr (+) oder weniger (−) als der Median aller Starter im Rennen">Weg m</th>
    <th class="r" title="TR: Zeit-Rating nach Timeform-Art plus Upgrade aus dem Finishing Speed (lb); groß auf das heutige Gewicht umgerechnet, damit die Pferde des Rennens vergleichbar sind; klein: TR bei 55 kg, Zeit-Rating und Upgrade">TR</th><th class="r" title="Finishing Speed des Pferdes in %; klein: Optimum für Kurs × Distanz und Boden">FS%</th>
  </tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderLegend(){
  const p = DATA.params;
  $("#legend").innerHTML = `
    <div><b>A/E</b> = <b>A/E Platz</b>: Plätze ÷ Σ erwartete Platzwahrscheinlichkeit. Platz = 1.–2. bei bis zu 7 Startern, 1.–3. ab 8. Erwartet aus den Endquoten des Rennens: Marge herausgerechnet (p = (1/Q) ÷ Σ 1/Q), dann Harville mit Korrektur (für Platz 2 und 3 p^0,8 bzw. p^0,65, neu normiert). Über 1 platziert sich die Person öfter, als der Markt erwartet; ohne Marge liegt der Schnitt bei 1. Zweite und dritte Plätze zählen mit – empfindlicher für Form als A/E auf Sieg (im Tooltip zum Vergleich). Grün ≥ 1,10, rot ≤ 0,90; blass bei weniger als 10 Starts (Vorlieben: 5). In der Übersicht: 365 Tage; 🔥 / 🧊 wenn die letzten 30 Tage um mindestens ${String(p.trend_diff).replace(".", ",")} darüber bzw. darunter lagen (ab ${p.trend_min} Starts).</div>
    <div><b>TR</b> (Zeit-Rating nach Timeform-Art, in lb, bezogen auf 55 kg): eigene Zeit (Siegerzeit + Rückstand) minus Going Allowance des Renntags (Tag × Kurs × Going, nach Timeform aus den Zeiten der Pferde gegen ihre Ratings geschätzt) gegen die Standardzeit für Kurs × Distanz (Siegerzeiten guter Klasse, auf eine Referenzklasse umgerechnet); Sekunden → Längen (auf den eigenen Daten kalibriert) → lb (mehr lb je Länge im Sprint), dazu Gewicht und Wegverlust. Plus <b>Upgrade</b> aus dem <b>Finishing Speed</b> (FS% = Tempo der letzten 400 m bis 1600 m, darüber 600 m, ÷ Durchschnittstempo × 100): c × (d/D) × (Optimum − FS%)², ab ${p.tr_upg_knie} FS-Punkten Abweichung nur noch linear und höchstens ${p.tr_upg_max} lb (<b>*</b> = gedeckelt: Rennen falsch gelaufen, TR unsicher, zählt nicht für das beste TR der Übersicht), Optimum = Median der effizienten Läufe auf Kurs × Distanz, c auf den eigenen Daten kalibriert. Übersicht: gewichteter Ø der letzten ${p.avg_runs} Läufe mit TR – Gewicht = Distanzähnlichkeit (halbes Gewicht bei ${p.avg_dist_m} m Unterschied) × Going-Ähnlichkeit (halbes Gewicht bei ${p.going_stufen} Bodengruppe Abstand auf der Leiter Very fast – Fast – Slow – Very slow; PSF gegen Gras ${p.going_psf}); gedeckelte Läufe zählen nicht. Auf das <b>heutige Gewicht</b> umgerechnet (TR − (heutiges Gewicht − 55) × 2,2) – in der Übersicht und in den Formzeilen, damit die Pferde des Rennens vergleichbar sind; klein der Wert bei 55 kg. Ausgerittene haben kein TR.</div>
    <div><b>ΔL600 A / ΔB200 A</b> (km/h): Tempo der letzten 600 m bzw. schnellstes 200-m-Segment der letzten 800 m gegenüber der Erwartung. Verglichen wird nur mit den Startern desselben <b>Tages auf demselben Kurs bei gleicher Bodengruppe</b> (Very fast, Fast, Slow, Very slow, PSF), korrigiert um Kurs × Distanz und das Tempo des Rennens (Pace-Ratio, linear und quadratisch je Distanzgruppe). Weil der Mittelwert einer solchen Gruppe auch ihre Klasse enthält, kommt eine <b>Klassenkorrektur</b> dazu: β × (Ø Klasse der Gruppe − Ø Klasse aller Läufe), β aus Altersklasse und log. Preisgeld über die ganze Historie – ein Tag mit nur schwachen Rennen wird abgewertet, ein starker aufgewertet (Wert im Tooltip). + = schneller als erwartet. Rennen nur mit Pace-Ratio im 1.–99. Perzentil und mindestens 5 Rennen je Kurs × Distanz. Mehr als ${p.beaten_l} Längen Geschlagene gelten als ausgeritten und zählen nicht in den Schnitt. Übersicht: Ø der letzten ${p.avg_runs} Läufe mit Tracking, gewichtet nach Distanzähnlichkeit (halbes Gewicht bei ${p.avg_dist_m} m Unterschied) × Going-Ähnlichkeit (halbes Gewicht bei ${p.going_stufen} Bodengruppe Abstand; PSF gegen Gras ${p.going_psf}), zum Nullpunkt geschrumpft; ± = Streuung der Einzelläufe; darunter der Rang im heutigen Feld. <b>Finish-Index</b> = Tempo letzte 400 m ÷ Tempo davor × 100 (klein: bereinigt).</div>
    <div><b>Pos. vor Finish</b>: Platz ${p.pos_before_m} m vor dem Ziel, eingeteilt in Fünftel des Feldes (hervorgehoben). <b>Pace-Ratio</b>: Tempo der frühen Phase ÷ Tempo der letzten ≥ 600 m × 100; unter 100 Schlusssprint, über 100 schnell angegangen. <b>Weg m</b>: gelaufene Meter gegenüber dem Median aller Starter im Rennen (≈ 2,4 m je Länge); + = weiter gelaufen, meist außen.</div>
    <div><b>RTR</b> (Rating nach dem Rennen, in kg): Elo-artig, Rennen für Rennen in zeitlicher Reihenfolge. Start mit dem offiziellen Rating (sonst 30); in jedem Rennen tritt jedes Pferd gegen jedes andere an – erwartet wird ein Abstand aus Rating − 0,625 × Gewicht, verglichen mit dem tatsächlichen Abstand in Längen × kg je Länge (nach Boden und Distanz), beides auf einer log. Stufe von 1 bis 5. Das Rating wandert um 0,5 × Ø Überraschung (+ kleiner Preisgeldbonus). <b>ARR</b> (Leistung im Rennen, in kg): gemessen an den Pferden im vorderen Drittel des Einlaufs – deren Rating plus Längenabstand × kg je Länge (große Abstände logarithmisch gedämpft) plus Gewichtsunterschied, Ø über diese Referenzen; fehlende Ratings der Referenzen werden aus vergleichbaren Pferden ergänzt. <b>Bereinigt</b> = Wert − Gewicht + ${p.weight_ref} – immer mit dem <b>heutigen</b> Gewicht, auch beim ARR in den Formzeilen (ein früherer ARR von 36 wird bei heute 52 kg zu 39), klein daneben der Rohwert. RTR, ΔL600 A und ΔB200 A stehen nur in der Übersicht. Übersicht: RTR = aktuelles Rating, ARR = nach Distanz- und Going-Ähnlichkeit gewichteter Ø der letzten ${p.avg_runs} Läufe (wie ΔL600 A und TR, ohne Schrumpfung); darunter der Rang im heutigen Feld.</div>
    <div><b>Gegner</b>: für die letzten ${p.rivals_runs} Läufe die zwei Gegner direkt vor und die zwei direkt hinter dem Pferd, die seitdem wieder gelaufen sind – mit Platz im nächsten Start, Klasse dieses Rennens (€/L+, Val+) und ob der Platz besser oder schlechter war als der Rang ihrer Quote. Am Knopf (über das ganze Feld): besser / (besser + schlechter); grün, wenn mindestens die Hälfte der Gegner danach besser lief als ihre Quote (starkes Rennen). <b>⏸ Pause</b>: Zeile zwischen zwei früheren Läufen (bzw. über dem letzten Lauf bis heute), wenn dazwischen mindestens 8 Wochen (56 Tage) lagen. <b>Pos. vor Finish</b>: Fünftel des Pferdes 400 m vor dem Ziel, dazu als Punkte, wo der 1. (gold), 2. (silber) und 3. (bronze) lagen. <b>Heutige Gegner · frühere Duelle</b>: Rennen in der Datenbank, in denen das Pferd schon auf einen heutigen Gegner traf – Platz beider, Abstand, Gewichte damals und wie sich der Gewichtsunterschied bis heute verschoben hat (+ = trägt heute im Vergleich mehr). Je Duell „heute erwartet“ = Abstand damals − Verschiebung (1 kg = 1 Länge); am Knopf: vorne erwartet gegen x von y Gegnern (je Gegner das letzte Duell). <b>Indirekte Duelle</b>: Vergleich mit heutigen Gegnern über gemeinsame frühere Gegner – Vergleichsrennen der letzten ${p.ind_days} Tage, ±${p.ind_dist} m, Boden innerhalb einer Stufe (PSF nur mit PSF), alle drei Pferde in der vorderen Feldhälfte. Leistung gegen den gemeinsamen Gegner = Längen × kg je Länge (Boden × Distanz) + Mehrgewicht; daraus der Unterschied zum heutigen Gegner, abzüglich des heutigen Mehrgewichts = heute erwartet (kg, in Längen mit kg je Länge von heute); mehrere Vergleiche gemittelt.</div>
    <div><b>Farben</b>: Rating, Tage, RTR, ARR und TR in der Übersicht nach dem Rang im heutigen Feld – grün oberes Drittel, rot unteres Drittel (bei Tagen umgekehrt: grün = frisch, rot = lange Pause). In den früheren Läufen Klasse (Val, €/L) im Vergleich zu allen früheren Läufen der heutigen Starter – grün = hoher Wert für dieses Rennen, rot = niedriger. <b>TR und ARR</b> der früheren Läufe in 7 Stufen nach ihrer Lage unter allen früheren Läufen der heutigen Starter: oberste 10 % kräftig grün hinterlegt, bis 25 % hellgrün fett, bis 40 % hellgrün, Mitte neutral, entsprechend rot nach unten. <b>±800</b> grün ab 3 gewonnenen, rot ab 3 verlorenen Plätzen; <b>Weg m</b> rot ab 7,5 m mehr (≈ 3 Längen, meist weit außen), grün ab 7,5 m weniger. <b>Rating</b>: Valeur bereinigt nach dem heutigen Gewicht wie RTR/ARR (Valeur − Gewicht + ${p.weight_ref}), klein die Valeur selbst; Farbe nach dem bereinigten Wert. Darunter die letzte Siegmarke (S) im Handicap, ohne Handicap-Sieg die letzte Platzmarke (P, 1.–3.), in Klammern heute im Vergleich.</div>
    <div><b>PMU-Prognose</b> (vor dem Rennen): Kommentar der PMU-Redaktion zum Rennen, Auswahl mit <b>cote probable</b> (geschätzte Quote, z. B. 4/1 = 4,0) und Konsens der Tippgeber (Punkte je Liste nach Position, Borda). Am Pferd: <b>P1</b> … Rang in der PMU-Auswahl, <b>T5</b> = in 5 Tipp-Listen, ohne PMU-Auswahl; im Prognose-Kasten rechts die cote probable und <b>Tipp</b> = Platz im Konsens der Tippgeber (z. B. 2./9 = Zweiter von 9 getippten Pferden), ganz unten in der Starterzeile der Kurzkommentar der PMU (kursiv, farbig hinterlegt). Texte auf Deutsch, wo möglich.</div>
    <div><b>Kommentar</b> unter dem Lauf: Kommentar von PMU zum Pferd – auf Deutsch übersetzt (Original im Tooltip), sonst französisch mit <b>FR</b>.</div>
    <div><b>Startbox</b> (unter der Nummer): Box in Klammern, darunter die Abweichung der Ø relativen Platzierung (Starter − Platz) / (Starter − 1) aller früheren Läufe aus dieser Box auf derselben Konfiguration (Bahn | Distanz | Piste | Parcours | Corde) vom Durchschnitt 0,5; farbig nur, wenn auffällig: mindestens 0,05 entfernt und signifikant (≥ 2 Standardfehler, SE = 0,29 ÷ √Läufe). In den früheren Läufen „Box 3 ▲/▼“ für auffällig gute bzw. schlechte Boxen dieses Rennens. <b>gegen V.</b> beim Platz: Das Pferd lief gegen den Rennverlauf (von hinten in einem Rennen, das vorne gewonnen wurde, oder umgekehrt; Ø frühe Position der ersten drei gegen das Feld, verglichen mit der Norm der Bahn/Distanz, die extremsten 25 %) und landete trotzdem vorne (Platz 1–3 oder vordere 40 %); grau umrandet „gegen V.“ ohne vordere Platzierung und „mit V.“ (Position passte zum Verlauf) – beides im Backtest ohne Effekt, nur zur Einordnung. <b>Scheuklappen</b>: Auge mit geschlossener Klappe = klassisch, mit gestrichelter Fellklappe = australisch – in der Übersicht und je früherem Lauf. <b>Prognose</b> (Kasten rechts): cote probable der PMU-Prognose, darunter dezimal; Morgen- und Totokurs werden nicht angezeigt. <b>B</b> Besitzer mit A/E 365 Tage.</div>
    <div><b>Boden</b>: alle Berechnungen nutzen nur die Bodengruppe des offiziellen Begriffs – Lourd, Très lourd, Collant = Very slow · Souple, Très souple = Slow · Bon souple, Bon = Fast · Léger, Bon léger, Très léger = Very fast · PSF (Standard, Lente, Rapide) = PSF; der Penetrometer-Wert wird nur angezeigt. <b>Distanzgruppen</b> der Vorlieben (Pferd, Vater, Muttervater): 0-1000 m, dann je 200 m (1001-1200, 1201-1400 …), über 3600 m.</div>
    <div><b>€/Lauf</b> (Kachel) und <b>Karriere</b> (Detail, gesamt und ${p.class_days} Tage): Läufe-Siege-Plätze (1.–2. bis 7 Starter, sonst 1.–3.) und Gewinn je Lauf nur aus der PMU-Historie (französische Flachrennen seit Beginn der Sammlung), mit Rang im heutigen Feld; grün ab 1,25 × Median des Feldes, rot bis 0,8 ×. <b>€/L+</b> bei Trainer, Jockey, Besitzer, Züchter, Vater, Muttervater und Cross: Gewinn je Lauf als Index, 100 = Ø aller Personen bzw. Linien dieser Gruppe im selben Zeitraum (ab ${p.pop_min_runs} Läufen), über 100 überdurchschnittlich; grün ab 110, rot bis 90. <b>Ø max Val 3j</b>: Ø der höchsten Valeur der Nachkommen als 3-Jährige, <b>Val+</b> derselbe Index (Population ab ${p.pop_min_horses} 3-jährigen Nachkommen); Preisgeld je Platz laut PMU (montantOffert, sonst 50/19/14/9/4 % des Rennpreises). <b>Klasse</b>: <b>Val+</b> = Ø Valeur der Teilnehmer und <b>Rennstärke €/L+</b> = Ø Gewinn je Lauf der Teilnehmer in den ${p.class_days} Tagen vor dem Rennen, jeweils als Index, 100 = Ø aller früheren Rennen. Im Rennkopf für heute (grün ab 110, rot bis 90); in den Formzeilen (Kl.) für das damalige Rennen mit Farbverlauf nach der Lage unter allen früheren Läufen der heutigen Starter – rot = niedrigster, grün = höchster Wert für dieses Rennen; ebenso das Preisgeld. <b>Abstammung</b>: A/E über die ganze Historie für Vater, Muttervater und die Kombination Vater × Muttervater (Cross).</div>
    <div><b>Laufstil</b> F führend · V vorne dabei · M Mittelfeld · H hinten – aus der Ø frühen Position der letzten ${p.style_runs} Läufe mit Tracking. <b>Pace-Szenario</b>: Norm der Distanzgruppe plus Effekt der Tempomacher und der Feldgröße, geschätzt aus früheren Rennen. <b>Bahn-Bias</b> relativ zum Schnitt aller Bahnen (0 = wie überall): (IV vorne − IV hinten) dieser Bahn/Distanz minus derselbe Wert über alle Bahnen; positiv: Frontrenner hier stärker im Vorteil als sonst, negativ: abwartend Gerittene besser; farbig ab ±0,25. Den Rohwert nennt die Zeile darunter.</div>
    <div><b>C</b> Sieger auf der Bahn · <b>D</b> Sieger über die Distanz (±100 m) · <b>CD</b> beides im selben Rennen · <b>BF</b> letzter Start als Favorit geschlagen. Wechsel (Trainer, Besitzer, Scheuklappen, erstmals Wallach) gegenüber dem letzten Lauf in der Datenbank. <b>Tage</b> seit dem letzten Lauf in der Datenbank.</div>
    <div><b>Vorlieben ▲ / ▼</b> (Trainer, Jockey, Vater, Muttervater): A/E der Vorliebe weicht deutlich und signifikant vom Rest derselben Person bzw. Linie ab – mindestens ×1,2 bzw. ×0,8 des A/E aus ihren übrigen Läufen im selben Zeitraum (Trainer/Jockey 2 Jahre, Vater/Muttervater gesamte Historie) und mindestens 2 Standardfehler, bei mindestens 20 übrigen Läufen. Wie beim Box-Urteil; Werte im Tooltip.</div>
    <div><b>Letzte Läufe</b>: die letzten ${p.form_runs} Läufe; gelb markiert, was dem heutigen Rennen entspricht – <b>K</b> Kurs mit gleichem Belag (PSF gegen Gras), <b>D</b> Distanz ±100 m, <b>B</b> Bodengruppe. Fehlt darunter ein Lauf auf dem Kurs (gleicher Belag), über die Distanz (±100 m) oder in der Bodengruppe von heute, steht unten (gestrichelt abgetrennt) zusätzlich der letzte ältere Lauf mit diesem Merkmal – höchstens drei, also bis zu ${p.form_runs + 3} Zeilen.</div>`;
}
