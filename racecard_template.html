<title>PMU Race Card</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Farben des Designs als Tokens (--kRRGGBB = Farbe im hellen Modus); im Dunkelmodus umgestellt.
   Der Tipp-Kasten hat eigene Tokens und bleibt in beiden Modi dunkel. */
:root{
  --k161512:#161512; --k57534B:#57534B; --k8C877C:#8C877C; --kDCD8CE:#DCD8CE; --kF6F4EF:#F6F4EF; --kFFFDF9:#FFFDF9;
  --kEEEBE4:#EEEBE4; --kB9533D:#B9533D; --kCFCAC0:#CFCAC0; --k2F8A55:#2F8A55; --kD9A43A:#D9A43A; --kE2F1E6:#E2F1E6;
  --kF6E3DC:#F6E3DC; --kBFE0C9:#BFE0C9; --kEDC3B5:#EDC3B5; --kE3DFD6:#E3DFD6; --kF1EEE7:#F1EEE7; --kE9E5DC:#E9E5DC;
  --kE7E3DA:#E7E3DA; --kF3E9CF:#F3E9CF; --kFFFFFF:#FFFFFF; --k0B4D3C:#0B4D3C;
  --tip-bg:#0B4D3C; --tip-fg:#F4F8F5; --tip-mute:#BCD5CC; --tip-line:#26695A; --tip-line2:#5A9686; --tip-in:#083B2E;
  --tip-sel:#14604D; --tip-good:#B8F0CF; --tip-gold:#E9B949;
  --toast-bg:#161512; --toast-fg:#F6F4EF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --k161512:#ECE8DF; --k57534B:#B4AEA2; --k8C877C:#8E887C; --kDCD8CE:#38352F; --kF6F4EF:#141311; --kFFFDF9:#1D1C19;
    --kEEEBE4:#2B2925; --kB9533D:#E8866F; --kCFCAC0:#57534B; --k2F8A55:#62C38C; --kD9A43A:#E2B04C; --kE2F1E6:#1C3326;
    --kF6E3DC:#3D241D; --kBFE0C9:#2C5A3D; --kEDC3B5:#6B3B2E; --kE3DFD6:#36332D; --kF1EEE7:#232220; --kE9E5DC:#2A2824;
    --kE7E3DA:#0B0A09; --kF3E9CF:#3E331B; --kFFFFFF:#141311; --k0B4D3C:#1C6B55;
    --tip-bg:#0F4134; --tip-line:#22614F; --tip-in:#0A3127; --tip-sel:#185745;
    --toast-bg:#ECE8DF; --toast-fg:#141311;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --k161512:#ECE8DF; --k57534B:#B4AEA2; --k8C877C:#8E887C; --kDCD8CE:#38352F; --kF6F4EF:#141311; --kFFFDF9:#1D1C19;
  --kEEEBE4:#2B2925; --kB9533D:#E8866F; --kCFCAC0:#57534B; --k2F8A55:#62C38C; --kD9A43A:#E2B04C; --kE2F1E6:#1C3326;
  --kF6E3DC:#3D241D; --kBFE0C9:#2C5A3D; --kEDC3B5:#6B3B2E; --kE3DFD6:#36332D; --kF1EEE7:#232220; --kE9E5DC:#2A2824;
  --kE7E3DA:#0B0A09; --kF3E9CF:#3E331B; --kFFFFFF:#141311; --k0B4D3C:#1C6B55;
  --tip-bg:#0F4134; --tip-line:#22614F; --tip-in:#0A3127; --tip-sel:#185745;
  --toast-bg:#ECE8DF; --toast-fg:#141311;
}
html,body{margin:0;background:var(--kE7E3DA);color:var(--k161512);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--k161512);text-decoration:underline;text-underline-offset:2px}a:hover{color:var(--k2F8A55)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
input{color:inherit}
::-webkit-scrollbar{width:0;height:0}
#tip-toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:100;
  max-width:min(92vw,520px);background:var(--toast-bg);color:var(--toast-fg);border-radius:10px;padding:10px 14px;
  font-size:12.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.25);white-space:pre-line;display:none}
#tip-toast.an{display:block}
</style>
<div id="app"></div>
<template id="tpl">
<div style="min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:{{ deskPad }}">
<div style="width:{{ shellW }};min-height:100vh;border-radius:{{ shellR }};border:{{ shellBorder }};border-width:0 {{ sideBorder }};background:#F6F4EF;overflow-x:clip;position:relative">
<div ref="{{ scrollRef }}" style="position:relative">

<header ref="{{ headRef }}" style="position:sticky;top:0;z-index:20;background:#F6F4EF;border-bottom:1px solid #DCD8CE">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:{{ topPad }} 16px 8px">
    <span style="font-size:12px;font-weight:600;color:#57534B">{{ dateLabel }}</span><span style="flex:1"></span>
    <button onClick="{{ toggleLegend }}" style="border:1px solid #DCD8CE;background:#FFFDF9;border-radius:999px;height:32px;padding:0 12px;font-size:12px;font-weight:600;cursor:pointer">Erklärungen</button>
  </div>
  <div style="display:flex;gap:4px;padding:0 16px 8px">
    <sc-for list="{{ meetings }}" as="m" hint-placeholder-count="2">
      <button onClick="{{ m.pick }}" style="flex:1;height:36px;border-radius:8px;border:1px solid {{ m.border }};background:{{ m.bg }};color:{{ m.fg }};font-weight:700;font-stretch:75%;font-size:14px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer">R{{ m.reunion }} · {{ m.course }}</button>
    </sc-for>
  </div>
  <div ref="{{ stripRef }}" style="display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none">
    <sc-for list="{{ raceChips }}" as="c" hint-placeholder-count="9">
      <button onClick="{{ c.pick }}" data-on="{{ c.on }}" aria-label="C{{ c.no }} {{ c.time }}" style="flex:none;min-width:58px;height:40px;padding:0 8px;border-radius:8px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ c.op }}">
        <span style="font-weight:800;font-stretch:75%;font-size:16px;line-height:1;text-decoration:{{ c.strike }}">{{ c.time }}</span>
      </button>
    </sc-for>
  </div>
</header>

<sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
  <div style="padding:60px 16px;text-align:center;font-size:13px;color:#8C877C">{{ emptyTxt }}</div>
</sc-if>

<sc-if value="{{ ready }}" hint-placeholder-val="{{ true }}">
<section style="padding:18px 16px 8px">
  <div style="display:flex;align-items:baseline;gap:10px">
    <span style="font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:13px;color:#57534B">R{{ race.reunion }} · C{{ race.no }}</span>
    <sc-if value="{{ race.cancelled }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#B9533D;border:1px solid #B9533D;border-radius:4px;padding:2px 6px">Annulliert</span></sc-if>
  </div>
  <div style="display:flex;align-items:flex-end;gap:12px;margin-top:4px">
    <span style="font-weight:800;font-stretch:62%;font-size:58px;line-height:.82;letter-spacing:-.01em">{{ race.time }}</span>
    <h1 style="margin:0;font-weight:700;font-stretch:72%;font-size:17px;line-height:1.08;text-transform:uppercase;text-wrap:balance;padding-bottom:2px">{{ race.name }}</h1>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:16px;border-top:1px solid #161512">
    <sc-for list="{{ race.facts }}" as="f" hint-placeholder-count="8">
      <div style="padding:7px 0 8px;border-bottom:1px solid #DCD8CE;min-width:0">
        <div style="font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8C877C">{{ f.k }}</div>
        <div style="font-size:13.5px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.v }}</div>
      </div>
    </sc-for>
  </div>
  <div style="display:grid;gap:8px;margin-top:14px">
    <div style="background:var(--tip-bg);color:var(--tip-fg);border-radius:10px;overflow:hidden">
      <button onClick="{{ toggleTips }}" style="width:100%;border:0;background:none;color:inherit;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:48px;cursor:pointer;text-align:left">
        <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#D9A43A;width:68px;flex:none">Tipps R{{ race.reunion }}</span>
        <span style="flex:1;display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-width:0">
          <sc-for list="{{ tips.chips }}" as="tq" hint-placeholder-count="3">
            <span style="height:24px;padding:0 6px;border-radius:5px;background:{{ tq.bg }};color:{{ tq.fg }};font-family:'Spline Sans Mono',monospace;font-size:11px;font-weight:600;display:flex;align-items:center">C{{ tq.c }}·{{ tq.no }}</span>
          </sc-for>
          <sc-if value="{{ tips.none }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;color:var(--tip-mute)">{{ tips.noneTxt }}</span></sc-if>
        </span>
        <span style="font-size:14px;color:var(--tip-mute);transform:rotate({{ tipsRot }}deg);transition:transform .2s">›</span>
      </button>
      <sc-if value="{{ tipsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="padding:0 12px 12px">
          <sc-for list="{{ tips.rows }}" as="tw" hint-placeholder-count="3">
            <button onClick="{{ tw.pick }}" style="width:100%;border:0;border-top:1px solid var(--tip-line);background:{{ tw.bg }};color:inherit;display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 6px;cursor:pointer;text-align:left;border-radius:{{ tw.rad }}">
              <span style="grid-row:span 2;font-family:'Spline Sans Mono',monospace;font-size:13px;font-weight:600;color:#D9A43A">{{ tw.rang }}</span>
              <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px"><span style="font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--tip-mute);margin-right:6px">C{{ tw.c }} {{ tw.time }}</span><b style="margin-right:4px">{{ tw.no }}</b><span style="font-weight:700;font-stretch:80%;text-transform:uppercase">{{ tw.horse }}</span></span>
              <span style="grid-row:span 2;font-family:'Spline Sans Mono',monospace;font-size:15px;font-weight:600;text-align:right">{{ tw.einsatz }}</span>
              <span style="font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--tip-mute)">FK {{ tw.fk }} · Wert <b style="color:var(--tip-good)">{{ tw.wert }}</b> · Kelly {{ tw.kelly }}</span>
            </button>
          </sc-for>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;border-top:1px solid var(--tip-line);padding-top:10px;margin-top:2px">
            <span style="font-size:11px;color:var(--tip-mute);flex:1 1 100%;line-height:1.35">{{ tips.rule }}</span>
            <label title="Mindest-Kelly-Anteil Wert ÷ (FK − 1) für einen Tipp" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tip-mute)">Kelly ≥ <input value="{{ tipKStr }}" onChange="{{ onTipK }}" inputmode="decimal" style="width:44px;height:32px;border-radius:6px;border:1px solid var(--tip-line2);background:var(--tip-in);color:var(--tip-fg);font-family:'Spline Sans Mono',monospace;font-size:13px;text-align:right;padding:0 6px"> %</label>
            <label title="Höchstens so viele Tipps je Veranstaltung" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tip-mute)">max. <input value="{{ tipNStr }}" onChange="{{ onTipN }}" inputmode="numeric" style="width:36px;height:32px;border-radius:6px;border:1px solid var(--tip-line2);background:var(--tip-in);color:var(--tip-fg);font-family:'Spline Sans Mono',monospace;font-size:13px;text-align:right;padding:0 6px"></label>
            <label title="Startbank dieses Renntags (ganze Euro)" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--tip-mute);margin-left:auto">Bank <input value="{{ bankStr }}" onChange="{{ onBank }}" inputmode="numeric" style="width:64px;height:32px;border-radius:6px;border:1px solid var(--tip-line2);background:var(--tip-in);color:var(--tip-fg);font-family:'Spline Sans Mono',monospace;font-size:13px;text-align:right;padding:0 6px"> €</label>
          </div>
        </div>
      </sc-if>
    </div>
    <div style="background:#FFFDF9;border:1px solid #DCD8CE;border-radius:10px;overflow:hidden">
      <button onClick="{{ toggleProno }}" style="width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:48px;cursor:pointer;text-align:left">
        <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#57534B;width:68px;flex:none">PMU-Prognose</span>
        <span style="display:flex;gap:4px;flex:1;flex-wrap:wrap">
          <sc-for list="{{ race.sel }}" as="s" hint-placeholder-count="5">
            <span style="min-width:24px;height:24px;border-radius:5px;background:#0B4D3C;color:#FEFEFE;font-weight:800;font-stretch:70%;font-size:14px;display:grid;place-items:center;padding:0 4px">{{ s }}</span>
          </sc-for>
        </span>
        <span style="font-size:14px;color:#8C877C;transform:rotate({{ pronoRot }}deg);transition:transform .2s">›</span>
      </button>
      <sc-if value="{{ pronoOpen }}" hint-placeholder-val="{{ false }}">
        <div style="padding:0 12px 12px;font-size:13px;line-height:1.5;color:#57534B;text-wrap:pretty">
          <div>{{ race.pronoText }}</div>
          <sc-if value="{{ race.hasConsensus }}" hint-placeholder-val="{{ false }}">
            <div style="margin-top:8px;font-size:12px"><b style="color:#161512">Tipp-Konsens</b> <span style="font-family:'Spline Sans Mono',monospace">{{ race.consensus }}</span></div>
          </sc-if>
        </div>
      </sc-if>
    </div>
    <div style="background:#FFFDF9;border:1px solid #DCD8CE;border-radius:10px;overflow:hidden">
      <button onClick="{{ togglePace }}" style="width:100%;border:0;background:none;display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:48px;cursor:pointer;text-align:left">
        <span style="font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#57534B;width:68px;flex:none">Pace · Bias</span>
        <span style="flex:1;font-size:13px"><b>{{ race.paceLabel }}</b> <span style="color:#57534B">Tempo · Bahn-Bias {{ race.bias }}</span></span>
        <span style="font-size:14px;color:#8C877C;transform:rotate({{ paceRot }}deg);transition:transform .2s">›</span>
      </button>
      <sc-if value="{{ paceOpen }}" hint-placeholder-val="{{ false }}">
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 12px 12px">
          <sc-for list="{{ race.paceGroups }}" as="g" hint-placeholder-count="4">
            <div style="background:#F1EEE7;border-radius:8px;padding:8px 6px;min-height:72px">
              <div style="font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#57534B">{{ g.label }}</div>
              <div style="display:flex;flex-wrap:wrap;gap:3px;margin-top:6px">
                <sc-for list="{{ g.nos }}" as="n" hint-placeholder-count="2">
                  <span style="min-width:20px;height:20px;border-radius:4px;background:#0B4D3C;color:#FEFEFE;font-weight:800;font-stretch:70%;font-size:12px;display:grid;place-items:center;padding:0 3px">{{ n }}</span>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>
  </div>
</section>

<div data-sticky="race" style="position:sticky;top:{{ toolsTop }}px;z-index:16;height:{{ raceBarH }}px;margin-bottom:-{{ raceBarH }}px;visibility:hidden;background:#F6F4EF;border-bottom:1px solid #161512;padding:6px 16px 0;display:flex;flex-direction:column;justify-content:center;gap:2px">
  <div style="display:flex;align-items:baseline;gap:8px;min-width:0">
    <span style="font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:11.5px;color:#57534B;flex:none">R{{ race.reunion }}·C{{ race.no }}</span>
    <span style="font-weight:800;font-stretch:62%;font-size:22px;line-height:1;flex:none">{{ race.time }}</span>
    <span style="font-weight:700;font-stretch:72%;font-size:14px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ race.name }}</span>
  </div>
  <div style="font-size:11.5px;color:#57534B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ race.sub }}</div>
</div>

<div ref="{{ toolsRef }}" style="position:relative;background:#F6F4EF;padding:8px 16px 0;border-bottom:1px solid #161512">
  <div style="display:flex;gap:8px;align-items:center">
    <div style="display:flex;flex:1;background:#E9E5DC;border-radius:8px;padding:2px">
      <sc-for list="{{ sorts }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.pick }}" style="flex:1;height:32px;border:0;border-radius:6px;background:{{ s.bg }};box-shadow:{{ s.sh }};font-size:12px;font-weight:{{ s.fw }};cursor:pointer">{{ s.label }}</button>
      </sc-for>
    </div>
    
  </div>
  <div style="display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:10px;padding:8px 0 5px;align-items:end">
    <div style="position:relative;height:14px;margin:0 6px">
      <sc-for list="{{ ticks }}" as="t" hint-placeholder-count="5">
        <span style="position:absolute;left:{{ t.pos }}%;transform:translateX(-50%);font-family:'Spline Sans Mono',monospace;font-size:9.5px;color:#8C877C">{{ t.label }}</span>
      </sc-for>
    </div>
    <span style="font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8C877C;text-align:right">Fair</span>
  </div>
</div>

<sc-if value="{{ runnersLoading }}" hint-placeholder-val="{{ false }}">
  <div style="padding:40px 16px;text-align:center;font-size:13px;color:#8C877C">Lade Starter …</div>
</sc-if>

<div>
  <sc-for list="{{ runners }}" as="r" hint-placeholder-count="10">
    <article data-no="{{ r.no }}" style="border-bottom:1px solid #DCD8CE;background:{{ r.rowBg }};opacity:{{ r.op }}">
      <sc-if value="{{ r.isMid }}" hint-placeholder-val="{{ false }}">
        <div data-kopf="1" onClick="{{ r.zu }}" style="position:sticky;top:{{ kopfTop }}px;z-index:6;height:{{ kopfH }}px;margin-bottom:-{{ kopfH }}px;visibility:hidden;background:#FFFDF9;border-bottom:1px solid #DCD8CE;box-shadow:0 4px 10px -6px rgba(0,0,0,.25);display:grid;grid-template-columns:28px 26px minmax(0,1fr) auto;gap:8px;align-items:center;padding:0 16px;cursor:pointer">
          <span style="width:28px;height:30px;border-radius:5px;background:#0B4D3C;color:#FEFEFE;font-weight:800;font-stretch:62%;font-size:20px;display:grid;place-items:center">{{ r.no }}</span>
          <span style="width:26px;height:26px;background-image:{{ r.silkBg }};background-size:contain;background-repeat:no-repeat;background-position:center"></span>
          <span style="min-width:0">
            <span style="display:block;font-weight:800;font-stretch:72%;font-size:15px;line-height:1.1;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.horse }}</span>
            <span style="display:block;font-size:11.5px;color:#57534B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.jt }}</span>
          </span>
          <span style="text-align:right">
            <span style="display:block;font-family:'Spline Sans Mono',monospace;font-weight:600;font-size:17px;line-height:1.1;color:{{ r.fairFg }}">{{ r.fairTxt }}</span>
            <span style="display:block;font-size:10.5px;color:#8C877C;white-space:nowrap">{{ r.mktLab }} {{ r.mktTxt }}</span>
          </span>
        </div>
      </sc-if>
      <div onClick="{{ r.cycle }}" style="padding:12px 16px 10px;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) 52px;gap:6px 10px">
        <div style="display:flex;gap:10px;align-items:flex-start;min-width:0">
          <span style="flex:none;width:32px;height:36px;border-radius:5px;background:#0B4D3C;color:#FEFEFE;font-weight:800;font-stretch:62%;font-size:24px;display:grid;place-items:center">{{ r.no }}</span>
          <span style="flex:none;width:30px;height:30px;margin-top:3px;background-image:{{ r.silkBg }};background-size:contain;background-repeat:no-repeat;background-position:center"></span>
          <div style="min-width:0;flex:1">
            <div style="display:flex;align-items:baseline;gap:6px;flex-wrap:wrap">
              <span style="font-weight:800;font-stretch:72%;font-size:18px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-decoration:{{ r.strike }}">{{ r.horse }}</span>
              <span style="font-size:11.5px;color:#8C877C">{{ r.ageSex }}</span>
              <sc-if value="{{ r.isTip }}" hint-placeholder-val="{{ false }}"><span title="{{ r.tipTip }}" style="font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--tip-bg);color:var(--tip-gold);border-radius:3px;padding:2px 5px">Tipp {{ r.tipRang }} · {{ r.tipEinsatz }}</span></sc-if>
            </div>
            <div style="font-size:12px;color:#57534B;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.jt }}</div>

<script>
const DATA = /*__DATA__*/null;
// ---------------------------------------------------------------------------------------------------------------
// Laufzeit für das Claude-Design-Markup in <template id="tpl">: <sc-for list= as=>, <sc-if value=>, {{ a.b }} in Text
// und Attributen, onClick/onChange="{{ f }}", ref="{{ r }}". Die Klasse Component unten ist die Logik des Designs
// (state, setState, renderVals); gerendert wird bei jeder Änderung neu und mit dem bestehenden DOM abgeglichen, damit
// Eingabefelder den Fokus und Leisten ihre Scroll-Position behalten.
const store = {
  get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch (e) {} },
};
const React = { createRef: () => ({ current: null }) };
const VOID = new Set(["input", "img", "br", "hr"]);
const BIND = /\{\{\s*([^}]+?)\s*\}\}/g, NUR = /^\s*\{\{\s*(.+?)\s*\}\}\s*$/;
const escH = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// Farben im Stil als Tokens (Dunkelmodus im CSS)
const TOKEN = new Set(["161512", "57534B", "8C877C", "DCD8CE", "F6F4EF", "FFFDF9", "EEEBE4", "B9533D", "CFCAC0", "2F8A55",
  "D9A43A", "E2F1E6", "F6E3DC", "BFE0C9", "EDC3B5", "E3DFD6", "F1EEE7", "E9E5DC", "E7E3DA", "F3E9CF", "FFFFFF", "0B4D3C"]);
const farben = s => s.replace(/#([0-9A-Fa-f]{6})\b/g, (m, h) => TOKEN.has(h.toUpperCase()) ? `var(--k${h.toUpperCase()})` : m);

function wert(expr, scope){
  if (expr === "true") return true;
  if (expr === "false") return false;
  if (/^-?\d+(\.\d+)?$/.test(expr)) return +expr;
  let v = scope;
  for (const k of expr.split(".")) { if (v == null) return undefined; v = v[k]; }
  return v;
}
const textWert = (s, scope) => s.replace(BIND, (_, e) => { const v = wert(e, scope); return v == null ? "" : String(v); });

function kinderHTML(n, scope, H){ let s = ""; for (const k of n.childNodes) s += knotenHTML(k, scope, H); return s; }
function knotenHTML(n, scope, H){
  if (n.nodeType === 3) return escH(textWert(n.nodeValue, scope));
  if (n.nodeType !== 1) return "";
  const tag = n.localName;
  if (tag === "sc-for") {
    const liste = wert((NUR.exec(n.getAttribute("list")) || [])[1] || "", scope) || [], as = n.getAttribute("as");
    let s = "";
    for (const it of liste) { const s2 = Object.create(scope); s2[as] = it; s += kinderHTML(n, s2, H); }
    return s;
  }
  if (tag === "sc-if") return wert((NUR.exec(n.getAttribute("value")) || [])[1] || "", scope) ? kinderHTML(n, scope, H) : "";
  let a = "", roh = null;                                   // html="{{ x }}": fertiges HTML (z. B. SVG) als Inhalt
  for (const at of n.attributes) {
    const name = at.name;
    if (name.startsWith("hint-")) continue;
    if (name === "html") { roh = wert((NUR.exec(at.value) || [])[1] || "", scope) || ""; continue; }
    if (name.startsWith("on")) {
      const f = wert((NUR.exec(at.value) || [])[1] || "", scope);
      if (typeof f === "function") { H.push(f); a += ` data-h-${name === "onclick" ? "click" : "input"}="${H.length - 1}"`; }
      continue;
    }
    if (name === "ref") { a += ` data-ref="${escH((NUR.exec(at.value) || [])[1] || "")}"`; continue; }
    let v = textWert(at.value, scope);
    if (name === "style") v = farben(v);
    if (name === "title" && !v) continue;
    a += ` ${name}="${escH(v)}"`;
  }
  return `<${tag}${a}>` + (VOID.has(tag) ? "" : (roh ?? kinderHTML(n, scope, H)) + `</${tag}>`);
}

function abgleichen(alt, neu){
  if (alt.nodeType !== neu.nodeType || alt.nodeName !== neu.nodeName) { alt.replaceWith(neu); return; }
  if (alt.nodeType === 3) { if (alt.nodeValue !== neu.nodeValue) alt.nodeValue = neu.nodeValue; return; }
  if (alt.nodeType !== 1) return;
  for (const at of [...alt.attributes]) if (!neu.hasAttribute(at.name)) alt.removeAttribute(at.name);
  for (const at of neu.attributes) if (alt.getAttribute(at.name) !== at.value) alt.setAttribute(at.name, at.value);
  if (alt.tagName === "INPUT") { const v = neu.getAttribute("value") ?? ""; if (document.activeElement !== alt && alt.value !== v) alt.value = v; }
  kinderAbgleichen(alt, neu);
}
function kinderAbgleichen(alt, neu){
  const A = [...alt.childNodes], B = [...neu.childNodes];
  B.forEach((b, i) => i < A.length ? abgleichen(A[i], b) : alt.appendChild(b));
  for (let i = B.length; i < A.length; i++) A[i].remove();
}

let toastZeit = null;
function toast(t){
  const el = document.getElementById("tip-toast");
  el.textContent = t; el.classList.add("an");
  clearTimeout(toastZeit); toastZeit = setTimeout(() => el.classList.remove("an"), Math.min(9000, 2500 + t.length * 45));
}

class DCLogic {
  constructor(){ this.state = {}; this._H = []; this._plan = false; }
  setState(u){
    const neu = typeof u === "function" ? u(this.state) : u;
    if (neu) this.state = { ...this.state, ...neu };
    if (!this._plan) { this._plan = true; queueMicrotask(() => { this._plan = false; this._zeichnen(); }); }
  }
  _zeichnen(){
    const H = [], html = kinderHTML(TPL, this.renderVals(), H), box = document.createElement("div");
    box.innerHTML = html;
    this._H = H;
    kinderAbgleichen(ROOT, box);
    for (const el of ROOT.querySelectorAll("[data-ref]")) { const r = this[el.dataset.ref]; if (r) r.current = el; }
    if (this.componentDidUpdate) this.componentDidUpdate();
  }
  _ereignis(e, typ){
    const attr = "data-h-" + typ;
    if (typ === "click") {         // Erklärung (title) antippen: einblenden, statt die Zeile auf- oder zuzuklappen
      const t = e.target.closest('[title]:not([title=""])'), h = e.target.closest("[" + attr + "]");
      if (t && ROOT.contains(t) && (!h || (h !== t && h.contains(t)))) { toast(t.getAttribute("title")); return; }
    }
    let stop = false;
    const ev = { native: e, stopPropagation(){ stop = true; }, preventDefault(){ e.preventDefault(); } };
    for (let el = e.target; el && el !== ROOT; el = el.parentElement) {
      const i = el.getAttribute && el.getAttribute(attr);
      if (i != null && this._H[+i]) { ev.target = ev.currentTarget = el; this._H[+i](ev); if (stop) break; }
    }
  }
}
let TPL, ROOT;
function starten(K){
  TPL = document.getElementById("tpl").content;
  ROOT = document.getElementById("app");
  const t = document.createElement("div"); t.id = "tip-toast"; t.addEventListener("click", () => t.classList.remove("an"));
  document.body.appendChild(t);
  const k = new K();
  ROOT.addEventListener("click", e => k._ereignis(e, "click"));
  ROOT.addEventListener("input", e => k._ereignis(e, "input"));
  k._zeichnen();
  if (k.componentDidMount) k.componentDidMount();
}

// ---------------------------------------------------------------------------------------------------------------
// Daten der Karte (DATA aus racecard.baue_daten) in die Form, die die Logik des Designs liest
const SORTS = ["fair", "value", "kelly", "prono", "no"];
function tippN(TR){ const n = parseInt(store.get("rc-tipp-n") || "", 10); return n > 0 ? n : (TR && TR.je_veranstaltung) || 7; }
function tippK(TR){ const k = parseFloat(store.get("rc-tipp-k") || ""); return k >= 0 ? k : 100 * ((TR && TR.min_kelly) ?? 0.05); }
function karteIndex(D){
  const races = {}, rennen = {};
  for (const [id, r] of Object.entries(D.races)) {
    const P = r.prono || null;
    rennen[id] = { id, reunion: r.reunion, no: r.race_no, time: r.time, name: r.name, status: r.status, dist: r.distance,
      going: r.going, goingAssumed: r.going_assumed, prize: r.prize, declared: r.declared, type: r.type, age: r.age,
      corde: r.corde, cls: r.class, pace: r.pace, bias: r.bias ? r.bias.bias : null,
      prono: P ? { sel: (P.selection || []).map(s => s.no), text: P.text_de || P.text, consensus: P.consensus || [] } : null,
      tips: r.runners.filter(x => !x.nr && x.power && x.power.tipp).map(x => ({ ...x.power.tipp, no: x.no, horse: x.horse })),
      hasFK: r.runners.some(x => x.fk && x.fk.sieg != null) };
    races[id] = { runners: r.runners.map(x => ({ ...x, silk: x.silks || "" })), course: r.course, type: r.type };
  }
  return { idx: { ...D, races: rennen }, races };
}

const C = { ink:'#161512', ink2:'#57534B', ink3:'#8C877C', line:'#DCD8CE', paper:'#F6F4EF', card:'#FFFDF9',
  green:'#0B4D3C', onGreen:'#FEFEFE', good:'#2F8A55', goodBg:'#E2F1E6', bad:'#B9533D', badBg:'#F6E3DC', gold:'#D9A43A', goldBg:'#F3E9CF', mid:'#CFCAC0', soft:'#EEEBE4' };
const LO = Math.log(1.5), HI = Math.log(100);
const pos = o => Math.max(0, Math.min(100, (Math.log(Math.max(1.5, Math.min(100, o))) - LO) / (HI - LO) * 100));
const tc = s => (s || '').toLowerCase().replace(/(^|[\s\-'.(])([a-zà-ÿ])/g, (m, a, b) => a + b.toUpperCase());
const de = s => String(s).replace('.', ',');
const fx = (v, d = 1) => v == null || isNaN(v) ? '–' : de(Number(v).toFixed(d));
const sgn = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : v < 0 ? '−' : '±') + fx(Math.abs(v), d);
const kurz = v => v == null ? '–' : fx(v, 1).replace(/,0$/, '');
const fOdds = o => o == null ? '–' : o >= 100 ? '100+' : o < 10 ? fx(o, 1) : String(Math.round(o));
const eur = v => v == null ? '–' : '€' + Math.round(v).toLocaleString('de-DE');
const kEur = v => v == null ? '–' : '€' + (v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v));
const dt = s => { if (!s) return '–'; const d = s.split('-'); return d[2] + '.' + d[1] + '.' + d[0].slice(2); };
const daysBetween = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const lengths = m => { if (m == null) return ''; if (m < 0.1) return 'Nase'; if (m < 0.2) return 'kKopf'; if (m < 0.3) return 'Kopf'; if (m < 0.45 && m < 0.5) return 'Hals';
  const w = Math.floor(m), r = m - w, fr = r >= 0.625 ? '¾' : r >= 0.375 ? '½' : r >= 0.125 ? '¼' : ''; return (w || '') + fr + ' L'; };
const SEX = { HONGRES: 'W', MALES: 'H', FEMELLES: 'S' };
const AGE = { DEUX_ANS: '2-jährige', TROIS_ANS: '3-jährige', QUATRE_ANS: '4-jährige', TROIS_ANS_ET_PLUS: '3j+', QUATRE_ANS_ET_PLUS: '4j+', CINQ_ANS_ET_PLUS: '5j+' };
const INC = { DISQUALIFIE: 'DSQ', ARRETE: 'PU', TOMBE: 'F', NON_PLACE: '', RESTE_AU_POTEAU: 'RR', DEROBE: 'RO', ARRETE_AVANT: 'PU' };
const BADGE = { C: 'Sieger auf dieser Bahn', D: 'Sieger über diese Distanz (±100 m)', CD: 'Sieger auf Bahn und Distanz', BF: 'Beim letzten Start Favorit und nicht gewonnen' };
const SAME = { K: 'Kurs', D: 'Distanz', B: 'Boden' };
const ABST_DIM = [['dist', 'Distanz', { Sprinter: 'bis 1400 m', Mitteldistanz: '1401–2400 m', Steher: 'über 2400 m' }], ['boden', 'Boden', { Slow: 'Slow/Very slow', Fast: 'Fast/Very fast' }], ['belag', 'Belag', { Gras: 'alle Grasböden', PSF: 'Kunstbahn' }], ['reife', 'Alter', { '2yo': '2-Jährige', '3yo': '3-Jährige', '4yo+': '4 J. +' }]];
const blinkTxt = b => !b || b === 'SANS_OEILLERES' ? null : /AUSTRAL/.test(b) ? 'Austral. Scheuklappen' : 'Scheuklappen';
const arrow = P => P == null ? '–' : Math.abs(P) >= 40 ? (P > 0 ? '▲▲' : '▼▼') : Math.abs(P) >= 15 ? (P > 0 ? '▲' : '▼') : '·';
const pTone = P => P == null || Math.abs(P) < 15 ? C.ink3 : P > 0 ? C.good : C.bad;
const idxTone = v => v == null ? C.ink3 : v >= 110 ? C.good : v <= 90 ? C.bad : C.ink;
const aeTone = (v, n) => v == null || (n ?? 0) < 5 ? { fg: C.ink3, bg: 'transparent' } : v >= 1.15 ? { fg: C.good, bg: C.goodBg } : v <= 0.85 ? { fg: C.bad, bg: C.badBg } : { fg: C.ink, bg: 'transparent' };
const rkTone = (rk, n) => rk == null ? C.ink3 : rk <= Math.max(1, n / 3) ? C.good : rk > n * 2 / 3 ? C.bad : C.ink;
const rec = o => o && o.runs ? o.wins + '-' + o.places + '/' + o.runs : '–';
const LEGEND = [
  ['Power', 'Stärke-Einschätzung des Modells ohne Marktdaten (100 = Feldschnitt, ±10 je Standardabweichung). Steht aufgeklappt bei „Warum Power“ mit den stärksten Treibern und im Reiter Info; in der Übersicht zählt die faire Quote mit der Siegchance („Sieg 12 %“).'],
  ['Quoten-Leiter', 'Logarithmische Achse 1,5 – 100. Hohler Ring = faire Quote des Modells, gefüllter Punkt = Marktkurs: Wettstar-Festkurs, wenn vorhanden, sonst Toto, sonst PMU-Prognose (Marge herausgerechnet). Punkt rechts vom Ring = Markt zahlt mehr als fair (grün).'],
  ['Value-Lücke', 'Festkurs × Modell-Siegchance − 1, also der Erwartungswert je 1 € Einsatz. Ab der Schwelle (Standard +20 %) grün, spiegelbildlich rot; nur bis Kurs 30.'],
  ['Tipps', 'Je Veranstaltung die Starter mit dem höchsten Kelly-Anteil Wert ÷ (FK − 1): nur Sieg, Wert ≥ 20 %, Kelly-Anteil ≥ 5 %, höchstens 7 je Veranstaltung und einer je Rennen. Einsatz = Bank × ⅛ Kelly × Kelly-Anteil, auf ganze Euro. Kelly-Schwelle, Anzahl und Bank im Tipp-Kasten änderbar (Bank je Renntag gespeichert). Antippen springt ins Rennen.'],
  ['Valeur', 'Handicap-Rating. Groß: bereinigt aufs heutige Gewicht (Valeur − Gewicht + 55), klein: roh. S/P = letzte Sieg- bzw. Platzmarke im Handicap, in Klammern die Differenz zu heute.'],
  ['RTR / ARR / TR', 'RTR: Rating-Leistung, aufs heutige Gewicht bereinigt (klein: roh). ARR: Leistung gemessen am vorderen Drittel des Einlaufs (kg), Ø der letzten Läufe, gewichtsbereinigt. TR: Zeit-Rating (lb) plus Upgrade aus dem Finishing Speed, aufs heutige Gewicht umgerechnet. #x/n = Rang im Feld. In „Letzte Läufe“ ARR/TR antippen öffnet den Feldvergleich.'],
  ['ΔL600 / ΔB200', 'Tracking: Tempo der letzten 600 m bzw. schnellstes 200-m-Segment der letzten 800 m gegen die Erwartung (km/h), gleiche Bahn/Tag/Boden, korrigiert um Distanz, Tempo, Klasse. + = schneller.'],
  ['Duell', 'Direkte und indirekte Vergleiche mit heutigen Gegnern (180 Tage, ±200 m, Boden max. eine Stufe). Erwartung in Längen: Abstand damals ± Gewichtsverschiebung (1 kg ≈ 1 Länge).'],

// Beste Kategorie: höchstes A/E Platz, zum Gesamt-A/E hin geschrumpft ((Plätze + 5 × A/E) / (erwartet + 5)), ab 5 Läufen
function bestKat(zeilen) {
  const ok = (zeilen || []).filter(z => z[1] >= 5 && z[5] > 0);
  const pl = ok.reduce((s, z) => s + z[3], 0), ex = ok.reduce((s, z) => s + z[5], 0);
  if (ok.length < 2 || !ex) return null;
  let best = null, bw = -1;
  for (const z of ok) { const w = (z[3] + 5 * pl / ex) / (z[5] + 5); if (w > bw) { bw = w; best = z[0]; } }
  return best;
}

          bg: isSel ? C.gold : me ? C.ink : C.ink3, bd: isSel ? '2px solid ' + C.ink : '0', op: isSel ? 1 : Math.max(0.25, 1 - age / 400),

  }

  // Vorlieben – alle Gruppen: alle Kategorien dieser Person/Linie (DATA.pref_alle[Tabelle][Person], nach Läufen,

  // A/E-Matrix: alle Personen einer Rolle im heutigen Feld; x = A/E+ (100 × A/E Platz), y = Pos+, Fläche = €/L+,

    const ber = (v, lo0, hi0) => { const lo = Math.max(lo0, Math.min(...v)), hi = Math.min(hi0, Math.max(...v)), p = Math.max(10, (hi - lo) * 0.12); return [Math.floor((lo - p) / 10) * 10, Math.ceil((hi + p) / 10) * 10]; };

    const rad = g => g.s.epr_idx == null ? 8 : Math.max(6, Math.min(26, 10 * Math.sqrt(Math.max(g.s.epr_idx, 1) / 100)));
    const wandel = s => s.prev?.ae != null && s.prev?.pos_idx != null ? 100 * (s.ae - s.prev.ae) + (s.pos_idx - s.prev.pos_idx) : null;
    const fuell = s => { const d = wandel(s); if (d == null || Math.abs(d) < 5) return ['var(--k8C877C)', 0.35]; return [d > 0 ? 'var(--k2F8A55)' : 'var(--kB9533D)', 0.3 + 0.6 * Math.min(1, (Math.abs(d) - 5) / 40)]; };
    const T = 'font-family:Spline Sans Mono,monospace;font-size:9.5px;fill:var(--k8C877C)';

      roles: Object.entries(ROLLEN).map(([k, [label]]) => ({ label, bg: k === A.rolle ? C.card : 'transparent', pick: () => this.setState({ aem: { ...A, rolle: k } }) })),

      rows: alle.map(g => { const s = g.s || {}, ok = mit.includes(g), d = ok ? wandel(s) : null;
        return { nos: g.nos, name: g.name, fw: g.ist ? 700 : 400, bg: g.ist ? C.goldBg : 'transparent', op: ok ? 1 : 0.5,
          ae: ok ? Math.round(100 * s.ae) : '–', aeFg: ok ? aeTone(s.ae, s.runs).fg : C.ink3, pos: s.pos_idx ?? '–', posFg: idxTone(s.pos_idx), epr: s.epr_idx ?? '–', eprFg: idxTone(s.epr_idx),

            + (d == null ? ' · Vorperiode: keine Läufe' : ' · Vorperiode A/E+ ' + Math.round(100 * s.prev.ae) + ', Pos+ ' + s.prev.pos_idx + ' → zusammen ' + sgn(d, 0)) : 'Keine Läufe mit Quote in ' + A.t + ' Tagen' }; }) };

  renderVals() {

    const base = {
      deskPad: '0', shellW: narrow ? '100%' : 'min(100%, 640px)', sideBorder: narrow ? '0' : '1px',

      toolsTop: s.toolsTop ?? 150, raceBarH: RACE_H, kopfH: KOPF_H, kopfTop: (s.toolsTop ?? 150) + RACE_H, tabsTop: (s.toolsTop ?? 150) + RACE_H + KOPF_H, scrollRef: this.scrollRef, stripRef: this.stripRef,
      headRef: this.headRef, toolsRef: this.toolsRef, emptyTxt: s.leer ? 'Keine Rennen in den Daten.' : 'Lade Rennkarte …',
      toggleLegend: () => this.setState(x => ({ legendOpen: !x.legendOpen })), legendOpen: s.legendOpen, legendQ: s.legendQ,
      onLegendQ: e => this.setState({ legendQ: e.target.value }), legend, legendEmpty: !legend.length,
      ticks: tickVals.map(v => ({ pos: pos(v), label: v })), tickPos: tickVals.map(pos), kpiOpen: false, closeKpi: () => this.setState({ kpi: null }),

    const aeCards = [['Trainer', x.trainer, x.ae?.trainer, 'trainer'], ['Jockey', x.jockey, x.ae?.jockey, 'jockey'], ['Besitzer', x.owner, x.ae?.owner, 'owner'], ['Züchter', x.breeder, x.ae?.breeder, 'breeder']].filter(r => r[2]).map(([role, name, a, rolle]) => {
      const tr = trendOf(a);
      return { role, name: tc(name) || '–', trend: tr.t ? (tr.t === '▲' ? '▲ heiß' : '▼ kalt') : '', trendFg: tr.fg, pick: aemPick(rolle),
        rows: w.map(t => { const o = a['d' + t] || {}, tn = aeTone(o.ae, o.runs), dlt = o.prev?.ae != null && o.ae != null ? o.ae - o.prev.ae : null;
          return { w: t + ' T', rec: rec(o), ae: o.ae == null ? '–' : fx(o.ae, 2) + (dlt != null && Math.abs(dlt) >= (prm.trend_diff || 0.25) ? (dlt > 0 ? '↑' : '↓') : ''), aeFg: tn.fg, aeBg: tn.bg,
            aew: o.ae_win == null ? '–' : fx(o.ae_win, 2), aswFg: aeTone(o.ae_win, o.runs).fg, pos: o.pos_idx ?? '–', posFg: idxTone(o.pos_idx), epr: o.epr_idx ?? '–', eprFg: idxTone(o.epr_idx) }; }) };
    });

    // ---- Vorlieben
    const PF = x.pref || {}, yrs = prm.pref_jt_years || 2;
    const PR = x.pref_ref || {};
    const pvPick = ref => ref && DATA.pref_alle?.[ref[0]]?.[ref[1]] ? () => this.setState({ pv: { ref, no } }) : undefined;
    const prow = (l, o, today, ref) => { if (!o) return null; const v = Math.max(0, Math.min(2, o.ae ?? 1)), bw = Math.abs(v - 1) * 50, tn = aeTone(o.ae, o.runs), d = o.dev;
      return { l: l + (d?.sig ? ' ✱' : ''), rec: rec(o), ae: o.ae == null ? '–' : fx(o.ae, 2), aeFg: tn.fg, bl: v >= 1 ? 50 : 50 - bw, bw, c: v >= 1 ? C.good : C.bad, bop: (o.runs ?? 0) < 5 ? .35 : 1,
        bg: today ? C.goldBg : 'transparent', fw: today ? 700 : 400, pick: pvPick(ref), cur: pvPick(ref) ? 'pointer' : 'default',
        tip: (pvPick(ref) ? 'Antippen: alle Gruppen · ' : '') + (o.exp != null ? 'erwartet ' + fx(o.exp, 1) + ' Plätze' : '') + (d ? ' · eigener Schnitt ' + fx(d.base, 2) + ', Verhältnis ' + fx(d.ratio, 2) + ', z ' + fx(d.z, 1) : '') + (o.epr != null ? ' · ' + eur(o.epr) + '/L' : '') }; };
    const arr = (list, emptyTxt, title) => { const rr = (list || []).map(o => prow(o.label, o, o.today)).filter(Boolean); return { title, note: '', rows: rr, empty: !rr.length, emptyTxt }; };
    const T = PF.trainer || {}, J = PF.jockey || {};
    const prefGroups = [
      { title: 'Trainer · ' + (tc(x.trainer) || '–'), note: yrs + ' Jahre', rows: [prow('mit ' + tc(x.jockey), T.jockey, true, PR.trainer?.jockey), prow('in ' + tc(rd.course), T.course, true, PR.trainer?.course), prow('Typ ' + (rd.type || '–'), T.racetype, true, PR.trainer?.racetype), prow('Alter ' + (T.age_label || '–'), T.age, true, PR.trainer?.age)].filter(Boolean) },
      { title: 'Jockey · ' + (tc(x.jockey) || '–'), note: yrs + ' Jahre', rows: [prow('in ' + tc(rd.course), J.course, true, PR.jockey?.course), prow('für ' + tc(x.trainer), J.trainer, true, PR.jockey?.trainer), prow('auf ' + tc(x.horse), J.horse, true, PR.jockey?.horse)].filter(Boolean) },
      arr(PF.horse?.going, 'Keine Daten.', 'Pferd nach Boden'),
      arr(PF.horse?.distance, 'Keine Daten.', 'Pferd nach Distanz'),
      arr(PF.horse?.course, 'Noch nicht auf ' + tc(rd.course) + ' gelaufen.', 'Pferd auf dieser Bahn'),
      arr(PF.horse?.blinkers, 'Keine Daten.', 'Pferd nach Scheuklappen'),
      arr(PF.horse?.trainer, 'Keine Daten.', 'Pferd nach Trainer'),
    ].map(g => ({ note: '', ...g, empty: !g.rows.length, emptyTxt: g.emptyTxt || 'Keine Daten.' }));

    // ---- Abstammung
    const PD = x.ae?.pedigree || {}, pop = prm.pop || {};
    const ped = [['Vater', tc(x.sire), PD.sire, 'sire'], ['Muttervater', tc(x.dam_sire), PD.dam_sire, 'dam_sire'], ['Cross', x.sire && x.dam_sire ? tc(x.sire) + ' × ' + tc(x.dam_sire) : '–', PD.cross, 'cross']].map(([role, name, o, k]) => {
      o = o || {}; const tn = aeTone(o.ae, o.runs);
      return { role, name, stats: [
        { k: 'Pferde', v: o.horses || '–', sub: (o.horses3 ?? 0) + ' 3j', fg: C.ink, tip: 'Verschiedene Pferde in der Historie' },
        { k: 'A/E', v: o.ae == null ? '–' : fx(o.ae, 2), sub: rec(o), fg: tn.fg, tip: 'A/E Platz der Nachkommen' },
        { k: 'Pos+', v: o.pos_idx ?? '–', sub: '', fg: idxTone(o.pos_idx), tip: 'Ø Platzierung als Index' },
        { k: '€/L+', v: o.epr_idx ?? '–', sub: o.epr != null ? kEur(o.epr) : '', fg: idxTone(o.epr_idx), tip: 'Gewinn je Lauf als Index (Ø ' + kEur(pop[k + '_all']) + ')' },
        { k: 'maxVal+', v: o.max_val3_idx ?? '–', sub: o.max_val3 != null ? kurz(o.max_val3) : '', fg: idxTone(o.max_val3_idx), tip: 'Ø höchste Valeur der 3-jährigen Nachkommen als Index' },
      ] };
    });
    const A = x.abst || {}, AP = x.abst_pass || {};
    const abst = [['sire', 'Vater', x.sire], ['dam_sire', 'Muttervater', x.dam_sire]].map(([r, role, name]) => {
      const L = A[r], V = AP[r] || {}, ok = s.abstX[no + '|' + r];
      const dims = ABST_DIM.map(([d, lab]) => { const D = L?.[d], on = ok === d;
        return { lab, arrow: arrow(V[d]), val: V[d] != null ? sgn(V[d], 0) : '–', fg: pTone(V[d]), op: D && D.sicher === false ? .5 : 1,
          bg: on ? C.goldBg : C.card, bd: on ? C.ink : C.line, pick: () => D && this.toggleKey('abstX', no + '|' + r, d) }; });
      let rows = [], openInfo = '';
      if (ok && L?.[ok]) { const D = L[ok], erkl = ABST_DIM.find(a => a[0] === ok)[2];
        openInfo = ABST_DIM.find(a => a[0] === ok)[1] + ': Perzentil ' + (D.perzentil ?? '–') + ' unter ' + D.vergleich + ' Linien · heute ' + (D.heute || '–') + (D.lage != null ? ' (Lage P' + Math.round(D.lage) + ')' : '') + (D.sicher ? '' : ' · wenig Läufe, zählt nicht');
        rows = D.zeilen.map(([k, rn, wi, pl, wv, ae, ps, ep]) => ({ k: k + (erkl[k] ? ' ' : ''), runs: rn, w: wi, p: pl, wert: wv ?? '–', wFg: idxTone(wv), ae: ae ?? '–', aeFg: idxTone(ae), epr: ep ?? '–', eFg: idxTone(ep),
          bg: k === D.heute ? C.goldBg : 'transparent', fw: k === D.heute ? 700 : 400 })); }
      const pvRef = ok && (PR[r] || {})[{ dist: 'distance', boden: 'going', reife: 'age' }[ok]];
      return { role, name: tc(name) + (L ? ' · ' + L.runs + ' L' : ''), wert: V.wert != null ? sgn(V.wert, 0) : '–', fg: pTone(V.wert), dims, hasOpen: rows.length > 0, rows, openInfo,
        hasPv: !!pvPick(pvRef), pv: pvPick(pvRef) };
    });

    // ---- Duelle
    const DR = x.duel_rank, DS = x.duels_sum, IN = x.indirect || {};
    const duelHead = [
      { k: 'Rang', v: DR ? DR.rank + '/' + DR.of : '–', fg: DR ? rkTone(DR.rank, DR.of) : C.ink3 },
      { k: 'Score', v: DR ? sgn(DR.score_l) + ' L' : '–', fg: DR ? (DR.score_l > 0 ? C.good : DR.score_l < 0 ? C.bad : C.ink) : C.ink3 },
      { k: 'Direkt', v: DS ? DS.ahead + '↑ ' + DS.behind + '↓' : '–', fg: DS && DS.ahead + DS.behind ? (DS.ahead / (DS.ahead + DS.behind) >= .5 ? C.good : C.bad) : C.ink3 },
      { k: 'Indirekt', v: IN.n ? (IN.ahead ?? 0) + '↑ ' + (IN.behind ?? 0) + '↓' : '–', fg: IN.n && IN.ahead + IN.behind ? (IN.ahead / (IN.ahead + IN.behind) >= .5 ? C.good : C.bad) : C.ink3 },
    ];
    const duelRows = (DS?.rivals || []).map(rv => { const k = no + '|d|' + rv.rival_no, op = !!s.duelX[k];
      const items = (x.duels || []).filter(d => d.rival_no === rv.rival_no).map(d => ({ a: dt(d.date) + ' ' + tc(d.course) + ' · ' + d.dist + ' m · ' + tc(d.going),
        b: 'selbst ' + (d.pos || '–') + '. / Gegner ' + (d.rival_pos || '–') + '. von ' + d.ran + ' · Abstand ' + (d.diff_l != null ? sgn(d.diff_l, 2) : '–') + ' L · ' + kurz(d.weight) + ' vs ' + kurz(d.rival_weight) + ' kg' }));
      return { no: rv.rival_no, name: rv.rival + (byNo[rv.rival_no]?.nr ? ' (NP)' : ''), info: rv.n + ' Duell' + (rv.n > 1 ? 'e' : '') + ' · zuletzt ' + dt(rv.date) + ' · damals ' + (rv.diff_l != null ? sgn(rv.diff_l, 1) : '–') + ' L, Gew. ' + sgn(rv.shift, 1),
        exp: rv.exp_l != null ? sgn(rv.exp_l, 1) : '–', expLab: 'L heute', fg: rv.exp_l > 0 ? C.good : rv.exp_l < 0 ? C.bad : C.ink3, open: op, items, pick: () => this.toggleKey('duelX', k) }; });
    const indRows = (IN.rivals || []).map(e => { const k = no + '|i|' + e.rival_no, op = !!s.duelX[k];
      return { no: e.rival_no, name: e.rival, info: 'über ' + e.common.map(tc).join(', ') + ' · vor ' + e.days + ' T',
        exp: e.exp_l != null ? sgn(e.exp_l, 1) : '–', expLab: sgn(e.exp_kg, 1) + ' kg', fg: e.exp_kg > 0 ? C.good : e.exp_kg < 0 ? C.bad : C.ink3, open: op,
        items: (e.via || []).map(v => ({ a: 'via ' + tc(v[1]), b: 'Lauf ' + v[0].slice(8) + ' / ' + dt(v[3]) + ' ' + v[4].slice(8) + ' · ' + sgn(v[2], 1) + ' kg' })), pick: () => this.toggleKey('duelX', k) }; });

    // ---- Info
    const K1 = x.career?.d365 || {};
    const kTxt = k => k.runs ? k.runs + '-' + k.wins + '-' + k.places + ' · ' + kEur(k.earn) : 'keine Läufe';
    const info = [
      { k: 'Karriere', v: kTxt(K), sub: K.epr != null ? eur(K.epr) + '/L' + (K.rank ? ' #' + K.rank + '/' + K.n : '') : '', subFg: relFg(K.rel) },
      { k: (prm.class_days || 365) + ' Tage', v: kTxt(K1), sub: K1.epr != null ? eur(K1.epr) + '/L' + (K1.rank ? ' #' + K1.rank + '/' + K1.n : '') : '', subFg: relFg(K1.rel) },
      { k: 'PMU gesamt', v: (x.starts ?? '–') + ' Starts · ' + (x.wins ?? '–') + ' S · ' + (x.places ?? '–') + ' P', sub: x.earnings != null ? eur(x.earnings) : '', subFg: C.ink3 },
      { k: 'Laufstil', v: x.style_label || '–', sub: x.early != null ? 'früh Ø ' + Math.round(x.early * 100) + ' % · ' + x.early_runs + ' L' : '', subFg: C.ink3 },
      { k: 'Besitzer', v: tc(x.owner) || '–', sub: '', subFg: C.ink3 },
      { k: 'Züchter', v: tc(x.breeder) || '–', sub: '', subFg: C.ink3 },
      { k: 'Abstammung', v: tc(x.sire) + ' – ' + tc(x.dam), sub: x.dam_sire ? '(v. ' + tc(x.dam_sire) + ')' : '', subFg: C.ink3 },
      { k: 'Scheuklappen', v: blinkTxt(x.blinkers) || 'ohne', sub: '', subFg: C.ink3 },
      { k: 'Power-Modell', v: pw ? 'Power ' + pw.p + ' · Sieg ' + Math.round(pw.sieg * 100) + ' % · Wert ' + fx(pw.wert, 2) : '–', sub: pw ? 'Sieg o. Markt ' + Math.round((pw.sieg_blind ?? pw.sieg) * 100) + ' %' : '', subFg: C.ink3 },
    ];
    if (x.fehlende_laeufe) info.push({ k: 'Hinweis', v: x.fehlende_laeufe + ' Läufe fehlen in der Historie', sub: '', subFg: C.ink3 });

    return Object.assign(out, { runs, noRuns: !runs.length, aeCards, prefGroups, ped, abst,
      passArrow: arrow(AP.gesamt), passTxt: AP.gesamt != null ? sgn(AP.gesamt, 0) : '–', passFg: pTone(AP.gesamt),
      duelHead, duelRows, indRows, noDuels: !duelRows.length, noInd: !indRows.length,
      duelTitle: 'Direkte Duelle · ' + (prm.duel_days || 180) + ' Tage, ±' + (prm.duel_dist || 200) + ' m',
      indTitle: 'Indirekte Duelle · ' + (prm.ind_days || 180) + ' Tage',
      noDuelsTxt: 'Kein passendes Duell mit einem heutigen Gegner (letzte ' + (prm.duel_days || 180) + ' Tage, ±' + (prm.duel_dist || 200) + ' m, Boden innerhalb einer Stufe).', info });
  }
}

starten(Component);
</script>
