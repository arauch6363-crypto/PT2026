<title>PMU Race Card</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE7; --ink:#15201A; --ink-2:#4B5A51; --ink-3:#7D8A82;
  --line:#D5DDD3; --accent:#1D5C3A; --accent-ink:#FFFFFF; --hi:#E3A21A; --hi-soft:#F8E6B8;
  --good:#23794A; --bad:#B3392F; --good-soft:#DCEFE2; --bad-soft:#F6DEDB; --cloth:#15201A; --cloth-ink:#F3F5F1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
    --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
    --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
  --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
  --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-block:20px 12px;border-bottom:3px solid var(--ink)}
.top h1{margin:0;font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.top h1 span{color:var(--accent)}
.top .meta{font-size:12px;color:var(--ink-2)}
.pmu-link{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.pmu-link:hover{text-decoration:underline}
.race-kurz{font-size:12px;line-height:1.35;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.race-kurz[hidden]{display:none}
.race-kurz b{color:var(--ink);font-weight:600}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Rennkopf */
.race-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;padding-block:18px 12px}
.race-time{font:700 44px/0.9 var(--f-display);color:var(--accent)}
.race-title{font:700 26px/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance;margin:0}
.race-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px;font-size:12.5px}
.tag i{font-style:normal;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.result{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:6px 10px}
.tools label{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 10px;cursor:pointer;font-size:12.5px}

/* Starter */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.runner{border-top:1px solid var(--line)}
.runner:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 36px minmax(0,1fr) auto;gap:12px;padding:12px 14px;cursor:pointer;align-items:start}
.row:hover{background:var(--surface-2)}
.cloth{width:40px;text-align:center}
.cloth b{display:block;background:var(--cloth);color:var(--cloth-ink);font:700 22px/34px var(--f-display);border-radius:3px}
.cloth small{display:block;font:500 11px/1.6 var(--f-mono);color:var(--ink-3)}
.who{min-width:0;display:grid;gap:2px}
.name{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.name strong{font:700 20px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.form{font:500 12.5px var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.badge{font:600 10.5px/1 var(--f-body);padding:3px 5px;border-radius:2px;background:var(--hi-soft);color:var(--ink);letter-spacing:.04em}
.badge.bf{background:var(--bad-soft)}
.line2{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.line2 em{font-style:normal;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(38px,auto)) repeat(5,minmax(46px,auto)) auto;gap:2px 12px;text-align:right;align-items:start}
.fact i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fact span{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.fact .odds{font-weight:500;color:var(--accent)}
.nr .row{opacity:.45}
.nr .name strong{text-decoration:line-through}

/* Detail */
.detail{padding:4px 14px 18px 106px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.detail>*,.panel{min-width:0}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.panel h4{margin:0 0 6px;font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 6px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);font-size:12.5px}
th{font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td.r,th.r{text-align:right}
.ae{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:2px}
.ae.up{background:var(--good-soft);color:var(--good)}
.ae.down{background:var(--bad-soft);color:var(--bad)}
.ae.thin{opacity:.55}
.pref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.pref .grp b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.pref .it{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--line)}
.pref .it span:first-child{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pref .it span:last-child{font-family:var(--f-mono);white-space:nowrap}
.scroll{overflow-x:auto}
.formtab{min-width:900px}
.formtab td{padding:6px}
.fl-date{font-weight:600;white-space:nowrap}
.fl-cond{white-space:nowrap}
.fl-pos b{font:700 16px var(--f-display)}
.adj{font-size:11px;margin-left:4px}
.adj.up{color:var(--good)} .adj.down{color:var(--bad)}
.formtab td span.up{color:var(--good)} .formtab td span.down{color:var(--bad)}
svg text{fill:var(--ink-3);font:10px var(--f-mono)}
.legend{font-size:12px;color:var(--ink-2);display:grid;gap:4px;padding:14px;background:var(--surface-2);border-radius:4px;margin-top:18px}
.legend b{color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--ink-2)}


.silk img{display:block;width:34px;height:34px;object-fit:contain}
.nosilk{display:block;width:34px;height:34px;border:1px dashed var(--line);border-radius:50% 50% 4px 4px}
.changes{display:flex;flex-wrap:wrap;gap:4px}
.badge.chg{background:var(--surface-2);border:1px solid var(--hi);font-weight:500}
.form{display:flex;flex-wrap:wrap;gap:2px 0}
.trend{margin-left:3px;font-size:13px;line-height:1}
.metric{display:grid;justify-items:end}
.metric i{font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.metric span{font:500 14px var(--f-mono)}
.metric span.up{color:var(--good)} .metric span.down{color:var(--bad)}
.metric small{font:10.5px var(--f-mono);color:var(--ink-3)}
.metric em.sd, .fact em.sd{font:9.5px var(--f-mono);color:var(--ink-3);margin-left:2px;font-style:normal}
.metric.rt span{font-weight:600;color:var(--accent)}
.rt-cell b{font:600 14px var(--f-mono)}
.rt-cell small{display:block;font:10.5px var(--f-mono);color:var(--ink-3)}
.rt-cell small.up{color:var(--good)} .rt-cell small.down{color:var(--bad)}
.rt-cell.cap b{color:var(--ink-3);font-style:italic}
.oddsbox{display:grid;justify-items:center;align-content:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:4px 10px;min-width:58px}
.oddsbox i{font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.oddsbox b{font:700 22px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.panels.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panels.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.panels.one{grid-template-columns:minmax(0,1fr)}
.panels.ae{grid-template-columns:minmax(0,1fr)}
.panels.ae table{width:auto;min-width:60%}
.panels.one .pref{grid-template-columns:repeat(4,minmax(0,1fr))}
.riv-btn.up{border-color:var(--good);color:var(--good)} .riv-btn.down{border-color:var(--bad);color:var(--bad)}
.duels td .up{color:var(--good)} .duels td .down{color:var(--bad)}
.cls{font-size:11px}
.fact small{display:block;font:10.5px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.fact span.lvl,.metric.rt span.lvl{padding:0 4px}
.metric.rt span.lvl.up{color:var(--good)} .metric.rt span.lvl.down{color:var(--bad)}
.rt-cell b.lvl{padding:0 3px}
td .hl-up{color:var(--good);font-weight:600} td .hl-down{color:var(--bad);font-weight:600}
.panels.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.formtab tr.hascmt td{border-bottom:0}
.formtab tr.cmt td{padding:0 6px 8px;font-size:12px;color:var(--ink-2)}
.cmt-t{display:flex;gap:6px;align-items:baseline}
.cmt-t b{font:600 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.cmt-t .fr{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:0 3px}
.cmt-t .race{color:var(--ink-3)}
.prono{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:4px;padding:10px 14px;margin-bottom:12px;display:grid;gap:6px}
details.fold{margin-bottom:12px}
details.fold>summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style:none;padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";font-size:12px;color:var(--ink-3);width:10px}
details.fold[open]>summary::before{content:"▾"}
details.fold>summary h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fold-kurz{font-size:12.5px;color:var(--ink-2)}
details.insight-fold{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px}
details.insight-fold[open]{padding-bottom:12px}
details.insight-fold .insight{margin:8px 0 0}
details.prono:not([open]){gap:0}
.prono h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.prono p{margin:0;font-size:13.5px;line-height:1.5}
.prono .fr,.crible .fr{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:0 3px;margin-left:4px}
.prono .sel b{font-family:var(--f-mono)}
.badge.pr{background:var(--surface-2);border:1px solid var(--hi);font-family:var(--f-mono)}
/* PMU-Kurzkommentar: ganz unten in der Starterzeile, über die volle Breite */
.crible{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;font-size:13px;font-style:italic;line-height:1.45;
  color:var(--ink);background:var(--hi-soft);border-left:3px solid var(--hi);border-radius:3px;padding:6px 10px;margin-top:2px}
.crible b{font:600 10px var(--f-body);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);flex:none}
.oddsbox small.pr{opacity:.9}
.boxdev{display:block;font:500 10px/1.3 var(--f-mono);color:var(--ink-3)}
.boxdev.up{color:var(--good)} .boxdev.down{color:var(--bad)}
.blk{display:inline-flex;align-items:center;vertical-align:middle;color:var(--hi);margin-left:2px}
.blk.aus{color:var(--accent)}
.oddsbox small{font:500 11px var(--f-mono);white-space:nowrap}
.oddsbox small.kons{opacity:.9} .oddsbox small.kons b{font:700 13px var(--f-mono);opacity:1}
.oddsbox small.up{color:var(--bad-soft)} .oddsbox small.down{color:var(--good-soft)}
.career{margin-left:12px;font:500 12px var(--f-mono);color:var(--ink)}
.career .lvl{font-size:12px}
.lvl{font-family:var(--f-mono);padding:0 3px;border-radius:2px}
.lvl.up{background:var(--good-soft);color:var(--good)} .lvl.down{background:var(--bad-soft);color:var(--bad)}
.metric span.lvl{font:500 14px var(--f-mono);padding:0 4px}
.preftab tr.today td{background:var(--hi-soft);font-weight:600}
.heute{font:600 9.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-left:4px}
.riv-btn{margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:1px 6px;font:500 11px var(--f-body);color:var(--ink-2);cursor:pointer}
.rivrow td{background:var(--surface-2)}
.rivals{padding:4px 2px}
.rivals table td,.rivals table th{border-bottom-color:var(--line);background:transparent}
.verdict-chip{font-size:11.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line)}
.verdict-chip.up{background:var(--good-soft);color:var(--good);border-color:transparent}
.verdict-chip.down{background:var(--bad-soft);color:var(--bad);border-color:transparent}
tr.unrel td{opacity:.6}
mark.same{background:var(--hi-soft);color:inherit;padding:0 3px;border-radius:2px;box-shadow:inset 0 -2px 0 var(--hi)}
.same-tags{display:inline-flex;gap:2px;margin-left:4px;vertical-align:1px}
.same-tags b{font:600 10px/1 var(--f-body);padding:2px 3px;border-radius:2px;background:var(--hi);color:var(--cloth)}
.formtab tr.pause-sep td{padding:3px 6px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border-bottom:0;text-align:center;letter-spacing:.02em}
.formtab tr.extra-sep td{padding:8px 6px 4px;font-size:12px;color:var(--ink-2);border-top:2px dashed var(--line);border-bottom:0;font-weight:600}
.formtab tr.extra td:first-child{box-shadow:inset 3px 0 0 var(--hi)}
td.num,.adj,.ae{white-space:nowrap}
/* Pace-Szenario & Bahn-Bias */
.insight{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.insight>section{background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.insight h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.verdict{font:700 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.verdict.schnell{color:var(--bad)} .verdict.langsam{color:var(--accent)} .verdict.normal{color:var(--ink)}
.verdict small{font:500 13px var(--f-mono);color:var(--ink-2);text-transform:none;letter-spacing:0;margin-left:6px}
.note{font-size:12px;color:var(--ink-2)}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles div{border:1px solid var(--line);border-radius:3px;padding:5px 6px;min-width:0}
.styles b{display:flex;justify-content:space-between;gap:4px;font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.styles b span{font-family:var(--f-mono);color:var(--ink)}
.styles i{display:block;font:500 12px var(--f-mono);font-style:normal;color:var(--ink);word-break:break-word;min-height:1.2em}
.styles .F{border-color:var(--bad)} .styles .H{border-color:var(--accent)}
.stil{font:700 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:2px;border:1px solid var(--line);color:var(--ink-2)}
.stil.F{border-color:var(--bad);color:var(--bad)} .stil.V{border-color:var(--hi);color:var(--ink)}
.stil.H{border-color:var(--accent);color:var(--accent)}
.bias-num{font:700 30px/1 var(--f-display)}
.bias-num.up{color:var(--bad)} .bias-num.down{color:var(--accent)}
.early{display:block;font:10px var(--f-mono);color:var(--ink-3)}
@media (max-width:760px){ .insight{grid-template-columns:minmax(0,1fr)} .styles{grid-template-columns:repeat(2,minmax(0,1fr))} }

@media (max-width:760px){
  .row{grid-template-columns:40px 34px minmax(0,1fr)}
  .facts{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));text-align:left}
  .metric{justify-items:start}
  .oddsbox{grid-column:1/-1;grid-auto-flow:column;justify-content:space-between}
  .panels.two,.panels.three,.panels.four{grid-template-columns:minmax(0,1fr)}
  .detail{padding-left:14px}
  .panels,.pref,.panels.one .pref{grid-template-columns:minmax(0,1fr)}
  .race-time{font-size:34px}.race-title{font-size:21px}
}
@media (max-width:1050px) and (min-width:761px){ .panels.one .pref{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (prefers-reduced-motion:no-preference){ .row{transition:background .12s} }
</style>

<div class="wrap">
  <header class="top">
    <h1>Race Card <span id="hd-date"></span></h1>
    <div class="meta" id="hd-meta"></div>
  </header>
  <nav class="nav" aria-label="Rennen">
    <div class="tabs" id="meetings" role="tablist"></div>
    <div class="chips" id="races" role="tablist"></div>
    <div class="race-kurz" id="race-kurz" hidden></div>
  </nav>
  <main id="race"></main>
  <section class="legend" id="legend"></section>
</div>

<script>
const DATA = /*__DATA__*/null;

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fx = (v, d=1) => v == null ? "–" : Number(v).toFixed(d);
const sgn = (v, d=2) => v == null ? "" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
// Großbuchstabe am Wortanfang – auch nach Punkt (M.GRANDIN -> M.Grandin), Apostroph, Klammer, Schrägstrich
const title = s => s ? String(s).toLowerCase().replace(/(^|[\s\-'’.(/])(\p{L})/gu, (m,a,b) => a + b.toUpperCase()) : "";
// Link zur Rennseite bei PMU (mit Video/Replay): race_id JJJJMMTTRxCy -> pmu.fr/turf/TTMMJJJJ/rx/cy/
const pmuUrl = rid => { const m = /^(\d{4})(\d{2})(\d{2})R(\d+)C(\d+)$/.exec(rid || ""); return m ? `https://www.pmu.fr/turf/${m[3]}${m[2]}${m[1]}/r${m[4]}/c${m[5]}/` : null; };
const pmuLink = (rid, text = "▶ Video") => { const u = pmuUrl(rid); return u ? `<a class="pmu-link" href="${u}" target="_blank" rel="noopener" title="Rennseite bei PMU mit Video (neuer Tab)" onclick="event.stopPropagation()">${text}</a>` : ""; };
const dt = s => { if (!s) return "–"; const [y,m,d] = s.split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const prize = v => v == null ? "–" : v >= 1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,"") + "m" : Math.round(v/1000) + "k";
const pct = (w, r) => r ? Math.round(100*w/r) + "%" : "–";
function lengths(v){
  if (v == null) return "";
  if (v >= 30) return "dist";
  if (v <= 0) return "dh";
  if (v < 0.08) return "nse";
  if (v < 0.15) return "shd";
  if (v < 0.23) return "hd";
  if (v < 0.4) return "nk";
  const w = Math.floor(v + 1e-9), f = v - w;
  const fr = f < 0.125 ? "" : f < 0.375 ? "¼" : f < 0.625 ? "½" : f < 0.875 ? "¾" : "";
  const whole = f >= 0.875 ? w + 1 : w;
  return (whole ? whole : "") + fr + "l";
}
const INC = {DISQUALIFIE:"DSQ", ARRETE:"PU", TOMBE:"F", NON_PLACE:"", RESTE_AU_POTEAU:"RR", DEROBE:"RO", ARRETE_AVANT:"PU"};

  odds:  ["Prognose (cote probable)", r => (r.prono && r.prono.sel && r.prono.sel.cote_dec) ?? 999, 1],

  rating:["Rating", r => r.rating ?? -1, -1],

// Einordnung im heutigen Feld bzw. unter allen früheren Läufen der heutigen Starter:
// oberes Drittel -> up, unteres Drittel -> down (bei "niedrig ist gut" umgekehrt)
let FELD = {}, POOL = {};
function drittel(werte, v, hochGut = true){
  if (v == null) return "";
  const w = werte.filter(x => x != null);
  if (w.length < 3) return "";
  const unter = w.filter(x => x < v).length, gleich = w.filter(x => x === v).length - 1;
  const p = (unter + gleich / 2) / (w.length - 1);
  const c = p >= 2/3 ? "up" : p <= 1/3 ? "down" : "";
  return hochGut ? c : (c === "up" ? "down" : c === "down" ? "up" : "");
}
const feldCls = (k, v, hochGut = true) => drittel(FELD[k] || [], v, hochGut);
const poolCls = (k, v) => drittel(POOL[k] || [], v);
function pools(r){
  const P = r.runners.filter(x => !x.nr);
  FELD = {rating: P.map(x => x.rating_adj ?? x.rating),days: P.map(x => x.days), rtr: P.map(x => x.rtr.adj ?? x.rtr.raw),
          arr: P.map(x => x.arr.adj ?? x.arr.avg), tr: P.map(x => x.tr.heute ?? x.tr.avg)};
  const L = P.flatMap(x => x.form_lines);
  POOL = {arr: L.map(f => f.arr_adj ?? f.arr), tr: L.map(f => f.tr_heute ?? f.tr), val: L.map(f => f.cls_val_idx),
          epr: L.map(f => f.cls_epr_idx), prize: L.map(f => f.prize)};
}

    ["Alter", r.age ? title(r.age.replace(/_/g," ")) : "–"],
    ["Starter", r.runners.filter(x => !x.nr).length + (r.declared ? "/" + r.declared : "")],
    ["Bahn", r.corde ? title(r.corde.replace(/_/g," ")) : "–"],
    ["Klasse", {html: klasseHTML(r.class)}, r.class ? `Ø Valeur der Starter ${fx(r.class.val,1)} (${r.class.val_n} von ${r.class.n} mit Valeur) · Ø Gewinn je Lauf der letzten ${DATA.params.class_days} Tage €${r.class.epr != null ? fmtEur(r.class.epr) : "–"} (${r.class.epr_n} von ${r.class.n} mit Läufen in der Datenbank)` : ""],

      <div class="race-sub">${tags.map(([k,v,t]) => `<span class="tag"${t ? ` title="${esc(t)}"` : ""}><i>${k}</i>${v && v.html != null ? v.html : esc(v)}</span>`).join("")}</div>
      ${r.result ? `<div class="result">Einlauf: <span class="num">${esc(r.result)}</span></div>` : ""}
    </div>
    ${pronoHTML(r)}
    ${insightHTML(r)}
    <div class="tools">
      <label for="sort">Sortieren <select id="sort">${Object.entries(SORTS).map(([k,[l]]) => `<option value="${k}" ${k===state.sort?"selected":""}>${l}</option>`).join("")}</select></label>
      <button class="btn" id="toggle-all" type="button">${state.open.size ? "Alle zuklappen" : "Alle aufklappen"}</button>
    </div>
    <div class="card">${runners.map(x => runnerHTML(x, r)).join("") || `<p class="empty">Keine Starter.</p>`}</div>`;
  // Kurzbeschreibung des Rennens oben fixiert, sobald der Rennkopf aus dem Bild gescrollt ist
  const P_ = r.pace, B_ = r.bias, A_ = DATA.bias_all;
  const kurzTeile = [`<b>R${r.reunion} C${r.race_no} · ${esc(r.time || "")}</b>`,
    r.distance ? r.distance + " m" : null, r.going_label ? r.going_label + (r.going_assumed ? " (angen.)" : "") : null,
    r.type || null, `${r.runners.filter(x => !x.nr).length} Starter`,
    P_ && P_.label ? `Tempo ${P_.label}` : null,
    B_ ? `Bias ${sgn(A_ ? B_.bias - A_.bias : B_.bias, 2)}` : null,
    r.class && r.class.val_idx != null ? `Val+ ${r.class.val_idx}` : null, esc(title(r.name))].filter(Boolean);
  const kz = $("#race-kurz");
  kz.innerHTML = kurzTeile.join(" · ");

  document.querySelectorAll(".riv-btn").forEach(b => b.onclick = e => {

function insightHTML(r){
  const P = r.pace, B = r.bias, A = DATA.bias_all;
  const styles = DATA.params.styles;
  const grid = styles.map(st => { const nos = (P && P.groups[st.key]) || [];
    return `<div class="${st.key}"><b>${st.label}<span>${nos.length}</span></b><i>${nos.join(" · ") || "–"}</i></div>`; }).join("");
  let verdict = `<div class="verdict normal">Keine Einschätzung</div><div class="note">Zu wenige Starter mit Laufstil-Daten (mindestens 3 nötig).</div>`;
  if (P && P.expected != null){
    const txt = {schnell:"Schnelles Tempo erwartet", langsam:"Langsames Tempo – Sprintfinish", normal:"Normales Tempo erwartet"}[P.label];
    verdict = `<div class="verdict ${P.label}">${txt}<small>Pace ≈ ${fx(P.expected,1)}</small></div>
      ${paceSVG(P.expected)}
      <div class="note">Norm dieser Distanzgruppe ${fx(P.norm,1)} · ${P.n_front} Tempomacher (früh im vorderen ${Math.round(DATA.params.pacemaker*100)} %): ${sgn(P.part_front,1)} · ${P.runners} Starter: ${sgn(P.part_field,1)} (gegenüber ${DATA.params.field_ref} Startern) · Modell aus ${P.basis.toLocaleString("de-DE")} Rennen: ${sgn(P.coef.front,2)} je Tempomacher, ${sgn(P.coef.field,2)} je Starter.</div>`;
  }
  const unk = P && P.unknown.length ? `<div class="note">Ohne Laufstil-Daten: ${P.unknown.join(" · ")}</div>` : "";
  let bias = `<div class="note">Zu wenige Rennen mit Tracking auf dieser Bahn/Distanz (mindestens 15).</div>`;
  if (B){
    const d = A ? B.bias - A.bias : B.bias;            // 0 = wie im Schnitt aller Bahnen
    const rel = Math.abs(d) < 0.25 ? "etwa wie im Schnitt aller Bahnen" :
      d > 0 ? "vorne stärker im Vorteil als im Schnitt aller Bahnen" : "abwartend Gerittene hier besser als im Schnitt aller Bahnen";
    bias = `<div><span class="bias-num ${d >= 0.25 ? "up" : d <= -0.25 ? "down" : ""}" title="Bahn-Bias relativ zum Schnitt aller Bahnen (0 = wie überall)">${sgn(d,2)}</span>
      <span class="note">${rel}</span></div>
      <div class="note">roh ${sgn(B.bias,2)} (IV vorne ${fx(B.iv_front,2)} − IV hinten ${fx(B.iv_back,2)})${A ? ` · Schnitt aller Bahnen ${sgn(A.bias,2)}` : ""} · ${B.races} Rennen (${B.basis === "exakt" ? `${esc(title(r.course))} ${r.distance} m` : `${esc(title(r.course))}, ${esc(r.dist_label || "")}`})</div>`;
  }
  const kurz = [P && P.expected != null ? {schnell:"schnelles Tempo", langsam:"langsames Tempo", normal:"normales Tempo"}[P.label] : null,
                B ? `Bahn-Bias ${sgn(A ? B.bias - A.bias : B.bias,2)}` : null].filter(Boolean).join(" · ");
  return `<details class="fold insight-fold" data-fold="pace" ${state.fold.pace ? "open" : ""}><summary><h3>Pace-Szenario · Bahn-Bias</h3>${kurz ? `<span class="fold-kurz">${kurz}</span>` : ""}</summary>
    <div class="insight">
    <section><h3>Pace-Szenario</h3>${verdict}<div class="styles">${grid}</div>${unk}</section>
    <section><h3>Bahn-Bias · vorne vs. hinten</h3>${bias}</section>
  </div></details>`;
}

function aeChip(s, minRuns=10){
  if (!s || !s.runs) return `<span class="muted">–</span>`;
  const cls = s.ae == null ? "" : s.ae >= 1.1 ? "up" : s.ae <= 0.9 ? "down" : "";
  const tip = `A/E Platz: ${s.places} Plätze aus ${s.runs} Starts, erwartet ${fx(s.exp,1)} (Harville mit Korrektur, ohne Marge)` + (s.ae_win != null ? ` · A/E Sieg ${fx(s.ae_win,2)} (${s.wins} Siege)` : "");
  return `<span class="ae ${cls} ${s.runs < minRuns ? "thin" : ""}" title="${esc(tip)}">${s.ae == null ? "–" : s.ae.toFixed(2)}</span>`;
}
// Vorliebe weicht deutlich und signifikant vom Rest derselben Person/Linie ab (wie das Box-Urteil): ▲ / ▼
function aeDev(s, wer){
  const D = s && s.dev;
  if (!D || !D.sig) return "";
  const t = `A/E ${fx(s.ae,2)} gegenüber ${fx(D.base,2)} sonst ${wer || ""} (×${fx(D.ratio,2)}, ${fx(Math.abs(D.z),1)} Standardfehler, Vergleich mit ${D.rest} übrigen Läufen) – deutlich und signifikant ${D.dir > 0 ? "besser" : "schlechter"}`;
  return ` <span class="lvl ${D.dir > 0 ? "up" : "down"} aedev" title="${esc(t)}" aria-label="${esc(t)}">${D.dir > 0 ? "▲" : "▼"}</span>`;
}
function trendIcon(a){
  if (!a.trend) return "";
  const k = a.d30, l = a.d365;
  const t = `Letzte 30 Tage: ${k.places} Plätze aus ${k.runs} Starts, A/E Platz ${fx(k.ae,2)} gegenüber ${fx(l.ae,2)} (365 Tage)`;
  return a.trend === "hot" ? `<span class="trend" title="${t}" aria-label="${t}">🔥</span>` : `<span class="trend" title="${t}" aria-label="${t}">🧊</span>`;
}
// Einordnung: Perzentil gegenüber allen früheren Rennen (Klasse), Verhältnis zum Vergleichswert (€/Lauf)
const relCls = r => r == null ? "" : r >= 1.25 ? "up" : r <= 0.8 ? "down" : "";
// Farbverlauf rot -> neutral -> grün nach der Lage eines Werts unter allen früheren Läufen der heutigen Starter
function poolLage(k, v){
  const w = (POOL[k] || []).filter(x => x != null);
  if (v == null || w.length < 3) return null;
  const unter = w.filter(x => x < v).length, gleich = w.filter(x => x === v).length - 1;
  return (unter + gleich / 2) / (w.length - 1);               // 0 = niedrigster, 1 = höchster Wert im Rennen
}
function verlauf(p){
  if (p == null) return "";
  const t = Math.round(Math.abs(p - 0.5) * 200);            // 0 … 100 % Stärke der Farbe
  const farbe = p >= 0.5 ? "var(--good)" : "var(--bad)", grund = p >= 0.5 ? "var(--good-soft)" : "var(--bad-soft)";
  return `background:color-mix(in srgb, ${grund} ${t}%, transparent);color:color-mix(in srgb, ${farbe} ${Math.max(t, 35)}%, var(--ink))`;
}
// TR/ARR der Formzeilen: 7 Stufen nach der Lage unter allen früheren Läufen der heutigen Starter
// (oberste 10 % kräftig grün … unterste 10 % kräftig rot, Mitte neutral)
function stufeStil(p){
  if (p == null) return "";
  if (p >= 0.9) return "background:var(--good);color:var(--surface);font-weight:700";
  if (p >= 0.75) return "background:var(--good-soft);color:var(--good);font-weight:700";
  if (p >= 0.6) return "background:color-mix(in srgb, var(--good-soft) 55%, transparent);color:var(--good)";
  if (p > 0.4) return "";
  if (p > 0.25) return "background:color-mix(in srgb, var(--bad-soft) 55%, transparent);color:var(--bad)";
  if (p > 0.1) return "background:var(--bad-soft);color:var(--bad);font-weight:700";
  return "background:var(--bad);color:var(--surface);font-weight:700";
}
const lageText = p => p == null ? "" : ` · besser als ${Math.round(p * 100)} % aller früheren Läufe der heutigen Starter`;
function klasseHTML(k, imRennen = false){
  if (!k || (k.val == null && k.epr == null)) return "–";
  const P = DATA.params.pop || {};
  const lage = (key, i) => imRennen ? poolLage(key, i) : null;
  const zusatz = key => imRennen ? ` – Farbe: Lage unter allen früheren Läufen der heutigen Starter (rot = niedrigster, grün = höchster Wert für dieses Rennen)` : "";
  // Val+: Ø Valeur der Teilnehmer, 100 = Ø aller früheren Rennen
  const a = k.val_idx != null
    ? `<span class="ae ${imRennen ? "" : idxCls(k.val_idx)}" style="${verlauf(lage("val", k.val_idx))}" title="${esc(`Val+ ${k.val_idx}: Ø Valeur der Teilnehmer ${fx(k.val,1)} – 100 = Ø aller früheren Rennen (${fx(P.rennen_val,1)})` + zusatz("val"))}">Val+ ${k.val_idx}</span>`
    : k.val != null ? `<span class="lvl" title="Ø Valeur der Teilnehmer">Val ${fx(k.val,1)}</span>` : "";
  // €/L+: Rennstärke, Ø Gewinn je Lauf der Teilnehmer, 100 = Ø aller früheren Rennen
  const b = k.epr_idx != null
    ? `<span class="ae ${imRennen ? "" : idxCls(k.epr_idx)}" style="${verlauf(lage("epr", k.epr_idx))}" title="${esc(`Rennstärke €/L+ ${k.epr_idx}: Ø Gewinn je Lauf der Teilnehmer in den ${DATA.params.class_days} Tagen davor €${fmtEur(k.epr)} – 100 = Ø aller früheren Rennen (€${fmtEur(P.rennen_epr)})` + zusatz("epr"))}">€/L+ ${k.epr_idx}</span>`
    : k.epr != null ? `<span class="lvl" title="Ø Gewinn je Lauf der Teilnehmer €${fmtEur(k.epr)}">€${fmtEur(k.epr)}/L</span>` : "";
  return [a, b].filter(Boolean).join(" ");
}
// Index gegenüber dem Ø der Population (100 = Durchschnitt) – Chip wie A/E: grün ab 110, rot bis 90,
// blass bei wenig Daten (n < minN)
const idxCls = i => i == null ? "" : i >= 110 ? "up" : i <= 90 ? "down" : "";
function idxHTML(i, basis, was, n = null, minN = 10, einheit = "Läufen"){
  if (i == null) return `<span class="muted" title="${esc(basis == null ? "Keine Vergleichsbasis (zu kleine Population)" : "Kein Wert")}">–</span>`;
  return `<span class="ae ${idxCls(i)} ${n != null && n < minN ? "thin" : ""}" title="${esc(`${was}: ${i} – 100 = Ø der Population (${basis}); über 100 überdurchschnittlich` + (n != null ? ` · aus ${n} ${einheit}` : ""))}">${i}</span>`;
}
const rec = s => s && s.runs ? `${s.wins}-${s.runs} (${pct(s.wins, s.runs)})` : "0-0";
const lenTxt = v => v == null ? "–" : sgn(v, 1) + " L";

function metric(label, v, rank, n, tip, sd){
  const spread = sd != null ? `<em class="sd" title="Streuung (Standardabweichung) der einzelnen Läufe">±${fx(sd,1)}</em>` : "";
  return `<div class="metric" title="${esc(tip)}"><i>${label}</i><span class="${v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : ""}">${v == null ? "–" : sgn(v, 1)}${spread}</span><small>${rank ? `#${rank}/${n}` : "&nbsp;"}</small></div>`;
}

  const badges = x.badges.map(b => `<span class="badge ${b==="BF"?"bf":""}" title="${{C:"Sieger auf dieser Bahn",D:"Sieger über diese Distanz (±100 m)",CD:"Sieger auf Bahn und Distanz",BF:"Beim letzten Start Favorit und nicht gewonnen"}[b]}">${b}</span>`).join("");

  return `<article class="runner ${x.nr ? "nr" : ""}">
    <div class="row" data-no="${x.no}" tabindex="0" role="button" aria-expanded="${open}">
      <div class="cloth"><b>${x.no ?? ""}</b>${boxHTML(x)}</div>

      <div class="who">
        <div class="name"><strong>${esc(x.horse)}</strong><span class="muted">${age}</span>${x.style ? `<span class="stil ${x.style}" title="Laufstil: ${esc(x.style_label)} – Ø frühe Position ${fx(x.early*100,0)} % des Feldes aus ${x.early_runs} Läufen">${x.style}</span>` : ""}${badges}${blink}${pronoBadge(x)}${x.nr ? `<span class="badge bf">NP</span>` : ""}</div>
        ${changes ? `<div class="changes">${changes}</div>` : ""}
        <div class="form"><span title="Musique (PMU)">${esc(x.form || "")}</span>${career ? `<span class="career" title="Läufe-Siege-Plätze (1.–2. bis 7 Starter, sonst 1.–3.) und Gewinn je Lauf aus der PMU-Historie (französische Flachrennen seit Beginn der Sammlung), Rang im Feld">${career}</span>` : ""}</div>
        <div class="line2">
          <span><em>J</em> ${esc(title(x.jockey) || "–")} ${aeChip(x.ae.jockey.d365)}${trendIcon(x.ae.jockey)}</span>
          <span><em>T</em> ${esc(title(x.trainer) || "–")} ${aeChip(x.ae.trainer.d365)}${trendIcon(x.ae.trainer)}</span>
          <span title="Besitzer, A/E Platz 365 Tage"><em>B</em> ${esc(title(x.owner) || "–")} ${aeChip(x.ae.owner.d365)}</span>
          <span><em>v.</em> ${esc(title(x.sire) || "–")} – ${esc(title(x.dam) || "–")}${x.dam_sire ? ` <span class="muted">(v. ${esc(title(x.dam_sire))})</span>` : ""}</span>

        ${metric("ΔL600 A", S.dl600_a, S.dl600_a_rank, S.dl600_a_n, tip("L600", "Tempo letzte 600 m"), S.dl600_a_sd)}${metric("ΔB200 A", S.db200_a, S.db200_a_rank, S.db200_a_n, tip("B200", "schnellstes 200-m-Segment der letzten 800 m"), S.db200_a_sd)}
        ${oddsBox(x)}

// Scheuklappen: klassisch = geschlossene Klappe, australisch = Fellklappe (gestrichelt)
function blinkIcon(v){
  const t = String(v || "").toUpperCase();
  if (!t || /^SANS/.test(t) || t === "NAN") return "";
  const aus = /AUSTRAL/.test(t);
  const lab = aus ? "Australische Scheuklappen (œillères australiennes)" : "Scheuklappen (œillères classiques)";
  const cup = aus ? `<path d="M15 1.5 Q19.5 6 15 10.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 2.4"/>`
                  : `<path d="M15 1.5 Q19.5 6 15 10.5" fill="none" stroke="currentColor" stroke-width="2.4"/>`;
  return `<span class="blk ${aus ? "aus" : ""}" title="${lab}" aria-label="${lab}"><svg width="21" height="12" viewBox="0 0 21 12" aria-hidden="true"><path d="M1.5 6 Q7.5 0.5 13 6 Q7.5 11.5 1.5 6Z" fill="none" stroke="currentColor" stroke-width="1.3"/><circle cx="7.3" cy="6" r="1.9" fill="currentColor"/>${cup}</svg></span>`;
}
// Startbox: Ø relative Platzierung aus dieser Box auf dieser Konfiguration; auffällig (farbig) nur, wenn deutlich
// (≥ 0,05) und signifikant (≥ 2 Standardfehler) von 0,5 entfernt
const boxTip = (draw, D) => `Startbox ${draw}: Ø relative Platzierung (Starter − Platz) / (Starter − 1) = ${fx(D.mean,2)} aus ${D.n} Läufen aus dieser Box auf dieser Konfiguration (Bahn | Distanz | Piste | Parcours | Corde); Abweichung zu 0,5: ${sgn(D.dev,2)}, ${fx(Math.abs(D.z),1)} Standardfehler` + (D.sig ? (D.dev > 0 ? " – auffällig gute Box" : " – auffällig schlechte Box") : " – nicht auffällig");
// Rennverlauf: nur zeigen, wenn das Pferd gegen den Verlauf lief und trotzdem im vorderen Feld landete
function verlaufForm(f){
  const vp = f.verlauf_pferd;
  if (vp !== "gegen" && vp !== "mit") return "";
  const rennen = `Rennverlauf: ${f.verlauf === "vorne" ? "vorne gewonnen, von hinten kam wenig" : "von hinten gewonnen"} (Wert ${sgn(f.verlauf_wert,2)} gegen die Norm von Bahn/Distanz, negativ = vorne). `;
  const von = f.verlauf === "vorne" ? "von hinten" : "von vorne", mit = f.verlauf === "vorne" ? "von vorne" : "von hinten";
  if (f.verlauf_plus)                                    // gegen den Verlauf und trotzdem vorne: grün
    return ` <span class="lvl up" style="white-space:nowrap" title="${esc(rennen + `Das Pferd lief gegen den Verlauf (${von}) und landete trotzdem im vorderen Feld – unterschätztes Plus (Backtest).`)}">gegen V.</span>`;
  const tip = vp === "gegen"
    ? `Das Pferd lief gegen den Verlauf (${von}), landete aber nicht im vorderen Feld – entschuldigt allein nichts (Backtest).`
    : `Das Pferd lief mit dem Verlauf (${mit}) – die Position passte zum Rennen; im Backtest weder Plus noch Minus.`;
  return ` <span class="muted" style="white-space:nowrap;border:1px solid var(--line);border-radius:2px;padding:0 3px" title="${esc(rennen + tip)}">${vp === "gegen" ? "gegen V." : "mit V."}</span>`;
}
function boxForm(f){
  if (f.draw == null) return "";
  const D = f.draw_stat;
  if (!D || !D.sig) return ` <span class="muted num" title="${D ? esc(boxTip(f.draw, D)) : `Startbox ${f.draw}`}">Box ${f.draw}</span>`;
  return ` <span class="lvl ${D.dev > 0 ? "up" : "down"} num" title="${esc(boxTip(f.draw, D))}">Box ${f.draw} ${D.dev > 0 ? "▲" : "▼"}</span>`;
}
function boxHTML(x){
  const D = x.draw_stat;
  if (x.draw == null) return "";
  if (!D) return `<small title="Startbox ${x.draw} – keine früheren Läufe aus dieser Box auf dieser Konfiguration">(${x.draw})</small>`;
  const cls = !D.sig ? "" : D.dev > 0 ? "up" : "down";
  const tip = boxTip(x.draw, D);
  return `<small title="${esc(tip)}">(${x.draw})</small><span class="boxdev ${cls}" title="${esc(tip)}">${sgn(D.dev,2)}</span>`;
}
// PMU-Prognose: Rennkommentar (übersetzt, wo möglich), Auswahl mit cote probable, Konsens der Tippgeber
const deFr = (de, fr) => de ? `<span title="${esc("Original: " + fr)}">${esc(de)}</span>` : `${esc(fr)}<span class="fr" title="Keine Übersetzung verfügbar">FR</span>`;
function pronoHTML(r){
  const P = r.prono;
  if (!P) return "";
  const name = no => { const x = r.runners.find(y => y.no === no); return x ? title(x.horse) : ""; };
  const sel = P.selection.length ? `<div class="note sel">Auswahl PMU: ${P.selection.map(z => `<b>${z.no}</b> ${esc(name(z.no))} <span class="muted">${esc(z.cote || "")}</span>`).join(" · ")}</div>` : "";
  const kon = P.consensus.length ? `<div class="note" title="${esc(P.tips.map(t => `${t.source || "?"}: ${t.nos.join("-")}`).join(" | "))}">Konsens aus ${P.tips.length} Tipps: ${P.consensus.map(no => `<b class="num">${no}</b> ${esc(name(no))}`).join(" · ")}</div>` : "";
  const ohne = P.cribles_ohne.length ? `<div class="note">${P.cribles_ohne.map(c => `${c.name ? `<b>${esc(title(c.name))}</b>: ` : ""}${deFr(c.text_de, c.text)}`).join("<br>")}</div>` : "";
  const kurz = P.selection.length ? `Auswahl ${P.selection.slice(0, 5).map(z => z.no).join(" · ")}`
             : P.consensus.length ? `Konsens ${P.consensus.slice(0, 5).join(" · ")}` : "";
  return `<details class="prono fold" data-fold="prono" ${state.fold.prono ? "open" : ""}><summary><h3>PMU-Prognose</h3>${kurz ? `<span class="fold-kurz">${kurz}</span>` : ""}</summary>${P.text ? `<p>${deFr(P.text_de, P.text)}</p>` : ""}${sel}${kon}${ohne}</details>`;
}
function pronoBadge(x){
  const P = x.prono;
  if (!P) return "";
  const t = P.tips ? ` · in ${P.tips.n} von ${P.tips.of} Tipps (${P.tips.top3}× unter den ersten 3, Ø Platz ${fx(P.tips.avg,1)})` : "";
  if (P.sel) return `<span class="badge pr" title="${esc(`PMU-Auswahl Rang ${P.sel.rank}, cote probable ${P.sel.cote}` + t)}">P${P.sel.rank}</span>`;
  return P.tips ? `<span class="badge pr" title="${esc("Nicht in der PMU-Auswahl" + t)}">T${P.tips.n}</span>` : "";
}
function oddsBox(x){
  // nur die cote probable der PMU-Prognose (kein Morgen- oder Totokurs)
  const S = x.prono && x.prono.sel;
  const tip = S && S.cote ? `Cote probable der PMU-Prognose ${S.cote} (= ${fx(S.cote_dec,1)} dezimal), Rang ${S.rank} der PMU-Auswahl`
                          : "Keine cote probable – Pferd nicht in der PMU-Auswahl oder Prognose nicht verfügbar";
  const K = x.prono && x.prono.konsens;
  const kTip = K ? ` · Konsens der Tippgeber: Platz ${K.pos} von ${K.of} getippten Pferden (${K.pts} Punkte, Borda)` : " · in keiner Tipp-Liste";
  const kon = x.prono && (x.prono.tips || K || S) ? `<small class="kons">Tipp ${K ? `<b>${K.pos}.</b>/${K.of}` : "–"}</small>` : "";
  return `<div class="oddsbox" title="${esc(tip + (x.prono ? kTip : ""))}"><i>Prognose</i><b>${S && S.cote ? esc(S.cote) : "–"}</b>${S && S.cote_dec ? `<small>${fx(S.cote_dec,1)}</small>` : ""}${kon}</div>`;
}
function ratingFact(x){
  const M = x.hcp_mark;
  const mk = M ? `<small title="${esc(`Letzte ${M.kind === "sieg" ? "Siegmarke" : `Platzmarke (${M.pos}.)`} im Handicap: Valeur ${fx(M.val,1)} am ${dt(M.date)} in ${title(M.course)}` + (M.diff != null ? ` – heute ${sgn(M.diff,1)} dazu` : ""))}">${M.kind === "sieg" ? "S" : "P"} ${fx(M.val,1).replace(/\.0$/, "")}${M.diff != null ? ` (${sgn(M.diff,1).replace(/\.0$/, "")})` : ""}</small>` : "";
  // groß: Valeur bereinigt nach dem heutigen Gewicht (wie RTR/ARR), klein: Valeur roh
  const A = x.rating_adj, v = A ?? x.rating, kurz = n => fx(n, 1).replace(/\.0$/, "");
  const tip = x.rating == null ? "Keine Valeur (Handicap-Rating)"
    : A != null ? `Valeur ${kurz(x.rating)} bei ${kurz(x.weight)} kg → bereinigt ${kurz(A)} (Valeur − Gewicht + ${DATA.params.weight_ref}, wie RTR/ARR)${x.rating_rank ? `, Rang ${x.rating_rank}/${x.rating_n} im Feld` : ""}`
    : `Valeur ${kurz(x.rating)} – heutiges Gewicht unbekannt, nicht bereinigt`;
  return `<div class="fact" title="${esc(tip + " – grün: oberes Drittel des Feldes, rot: unteres; darunter letzte Sieg- (S) bzw. Platzmarke (P) im Handicap (offizielle Valeur)")}"><i>Rating</i><span class="lvl ${feldCls("rating", v)}">${v != null ? kurz(v) : "–"}${A != null ? `<em class="sd">${kurz(x.rating)}</em>` : ""}</span>${mk}</div>`;
}
function rtFact(label, adj, raw, R, tip){
  const v = adj ?? raw;
  return `<div class="metric rt" title="${esc(tip)}"><i>${label}</i><span class="lvl ${feldCls(label.toLowerCase(), v)}">${v != null ? fx(v, 1) : "–"}${adj != null && raw != null ? `<em class="sd">${fx(raw, 1)}</em>` : ""}</span><small>${R.rank ? `#${R.rank}/${R.n}` : "&nbsp;"}</small></div>`;
}
const gewTxt = x => x.weight != null ? `heutiges Gewicht ${fx(x.weight,1)} kg` : "heutiges Gewicht unbekannt";
function trFact(x){
  const T = x.tr;
  const tip = T.avg == null ? "TR: kein Lauf mit Zeit-Rating" :
    `TR (Zeit-Rating nach Timeform-Art mit Finishing-Speed-Upgrade, lb): gewichteter Ø der letzten ${T.runs} Läufe mit TR = ${T.avg} bei 55 kg – Gewicht nach Distanz- und Going-Ähnlichkeit zu heute (gedeckelte Läufe zählen nicht)` +
    (T.sd != null ? `, Streuung ±${fx(T.sd,1)}` : "") + ` · bestes ${T.best ?? "–"}, zuletzt ${T.last ?? "–"} · groß: auf das heutige Gewicht umgerechnet (TR − (Gewicht − 55 kg) × 2,2), klein: Ø bei 55 kg; darunter Rang im heutigen Feld`;
  const v = T.heute ?? T.avg;
  return `<div class="metric rt" title="${esc(tip)}"><i>TR</i><span class="lvl ${feldCls("tr", v)}">${v ?? "–"}${T.heute != null && T.avg != null && T.heute !== T.avg ? `<em class="sd">${T.avg}</em>` : ""}</span><small>${T.rank ? `#${T.rank}/${T.n}` : "&nbsp;"}</small></div>`;
}
function rtrTip(x){
  const R = x.rtr, ref = DATA.params.weight_ref;
  if (R.raw == null) return "RTR: noch kein bewerteter Lauf";
  return `RTR (Rating nach dem letzten Rennen, Elo-artig, kg): ${fx(R.raw,1)}${R.prev != null ? ` (davor ${fx(R.prev,1)})` : ""} · bereinigt = RTR − Gewicht + ${ref} mit ${gewTxt(x)}; klein daneben der Rohwert, darunter Rang im heutigen Feld`;
}
function arrTip(x){
  const A = x.arr, ref = DATA.params.weight_ref;
  if (A.avg == null) return "ARR: kein bewerteter Lauf";
  return `ARR (Leistung im Rennen, kg): gewichteter Ø der letzten ${A.runs} Läufe mit ARR = ${fx(A.avg,1)} – Gewicht nach Distanz- und Going-Ähnlichkeit zu heute` + (A.sd != null ? `, Streuung ±${fx(A.sd,1)}` : "") + ` · bestes ${fx(A.best,1)}, zuletzt ${A.last != null ? fx(A.last,1) : "–"} · bereinigt = Ø − Gewicht + ${ref} mit ${gewTxt(x)}; klein daneben der Ø roh, darunter Rang im heutigen Feld`;
}
const fmtEur = v => v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,"") + "k" : String(Math.round(v));

function trainerTable(rows){
  if (!rows || !rows.length) return `<p class="muted">Keine Läufe in der Historie.</p>`;
  const mj = d => { const [y, m] = d.split("-"); return `${MON[+m-1]} ${y.slice(2)}`; };   // "May 24"
  const zr = z => mj(z.from) === mj(z.to) ? mj(z.from) : `${mj(z.from)} – ${mj(z.to)}`;
  return `<div class="scroll"><table class="preftab"><thead><tr><th>Trainer</th><th>Zeitraum</th><th class="r">S-L</th><th class="r">Plätze</th><th class="r">A/E</th></tr></thead><tbody>${
    rows.map(z => `<tr class="${z.today ? "today" : ""}"><td>${esc(z.label)}${z.today ? ` <span class="heute">heute</span>` : ""}</td><td class="num" title="${esc(`${dt(z.from)} – ${dt(z.to)}`)}">${zr(z)}</td><td class="r num">${z.wins}-${z.runs} (${pct(z.wins,z.runs)})</td><td class="r num">${z.places}</td><td class="r">${aeChip(z, 5)}</td></tr>`).join("")}</tbody></table></div>`;
}
function prefTable(rows, head){
  if (!rows || !rows.length) return `<p class="muted">Keine Läufe in der Historie.</p>`;
  return `<table class="preftab"><thead><tr><th>${head}</th><th class="r">S-L</th><th class="r">Plätze</th><th class="r">A/E</th></tr></thead><tbody>${
    rows.map(z => `<tr class="${z.today ? "today" : ""}"><td>${esc(z.label)}${z.today ? ` <span class="heute">heute</span>` : ""}</td><td class="r num">${z.wins}-${z.runs} (${pct(z.wins,z.runs)})</td><td class="r num">${z.places}</td><td class="r">${aeChip(z, 5)}</td></tr>`).join("")}</tbody></table>`;
}

  const dk = `${x.no}|duels`, dOffen = state.duels.has(dk);

    <div class="line2"><span title="Läufe-Siege-Plätze (1.–2. bis 7 Starter, sonst 1.–3.) · Preisgeld · Gewinn je Lauf aus der PMU-Historie, Rang im heutigen Feld"><em>Karriere</em> ${kTxt(K)}</span><span><em>${DATA.params.class_days} Tage</em> ${kTxt(K1)}</span><span><em>Besitzer</em> ${esc(title(x.owner) || "–")}</span>${x.breeder ? `<span><em>Züchter</em> ${esc(title(x.breeder))}</span>` : ""}${x.style ? `<span><em>Laufstil</em> ${esc(x.style_label)} · früh Ø ${fx(x.early*100,0)} % des Feldes (${x.early_runs} Läufe)</span>` : ""}</div>
    <div class="panels ae">
      <div class="panel"><h4>A/E · Siege/Starts</h4>
        <div class="scroll"><table><thead><tr><th></th>${w.map(t => `<th class="r">${t} Tage</th><th class="r">A/E</th><th class="r" title="€/L+: Gewinn je Lauf als Index – 100 = Ø aller Personen dieser Gruppe im selben Zeitraum (ab ${DATA.params.pop_min_runs} Läufen); grün ab 110, rot bis 90">€/L+</th>`).join("")}</tr></thead><tbody>${aeRows}</tbody></table></div>
      </div>
      <div class="panel"><h4>Abstammung · gesamte Historie</h4>
        <div class="scroll"><table><thead><tr><th></th><th class="r">S-L</th><th class="r">Plätze</th><th class="r">A/E</th><th class="r" title="Gewinn je Lauf der Nachkommen">€/L</th><th class="r" title="€/L+: Index – 100 = Ø aller Linien (ab ${DATA.params.pop_min_runs} Läufen); grün ab 110, rot bis 90">€/L+</th><th class="r" title="Verschiedene Pferde mit dieser Abstammung in der Historie">Pferde</th><th class="r" title="Ø der höchsten Valeur, die die Nachkommen als 3-Jährige erreichten">Ø max Val 3j</th><th class="r" title="max Val+: Index – 100 = Ø aller Linien (ab ${DATA.params.pop_min_horses} 3-jährigen Nachkommen); grün ab 110, rot bis 90">Val+</th></tr></thead><tbody>${pedRows}</tbody></table></div>
      </div>
    </div>
    <div class="panels one">
      <div class="panel"><h4>Vorlieben · Trainer, Jockey (${jahre} Jahre) · Jockey auf dem Pferd, Vater, Muttervater (gesamt)</h4><div class="pref">
        <div class="grp"><b>Trainer</b>${it("mit " + (title(x.jockey) || "–"), P.trainer.jockey, "beim Trainer")}${it("in " + title(race.course), P.trainer.course, "beim Trainer")}${it("Typ: " + (race.type || "–"), P.trainer.racetype, "beim Trainer")}${it("Alter: " + (P.trainer.age_label || "unbekannt"), P.trainer.age, "beim Trainer")}</div>
        <div class="grp"><b>Jockey</b>${it("in " + title(race.course), P.jockey.course, "beim Jockey")}${it("für " + (title(x.trainer) || "–"), P.jockey.trainer, "beim Jockey")}${it("auf " + (title(x.horse) || "–"), P.jockey.horse, "beim Jockey (Läufe auf dem Pferd aus der ganzen Historie, Jockey sonst: 2 Jahre)")}</div>
        <div class="grp"><b>Vater</b>${it("Distanz: " + (race.dist_group ? race.dist_group + " m" : "–"), P.sire.distance, "beim Vater")}${it("Boden: " + (race.going_label || "unbekannt"), P.sire.going, "beim Vater")}${it("Alter: " + (P.trainer.age_label || "unbekannt"), P.sire.age, "beim Vater")}</div>
        <div class="grp"><b>Muttervater${x.dam_sire ? ` · ${esc(title(x.dam_sire))}` : ""}</b>${it("Distanz: " + (race.dist_group ? race.dist_group + " m" : "–"), P.dam_sire.distance, "beim Muttervater")}${it("Boden: " + (race.going_label || "unbekannt"), P.dam_sire.going, "beim Muttervater")}${it("Alter: " + (P.trainer.age_label || "unbekannt"), P.dam_sire.age, "beim Muttervater")}</div>
      </div></div>
    </div>
    <div class="panels four">
      <div class="panel"><h4>Pferd nach Boden (gesamt)</h4>${prefTable(P.horse.going, "Boden")}</div>
      <div class="panel"><h4>Pferd nach Distanz (gesamt)</h4>${prefTable(P.horse.distance, "Distanz")}</div>
      <div class="panel"><h4>Pferd auf dieser Bahn (gesamt)</h4>${P.horse.course.length ? prefTable(P.horse.course, "Kurs") : `<p class="muted">Noch nicht auf ${esc(title(race.course))} gelaufen.</p>`}</div>
      <div class="panel"><h4>Pferd nach Scheuklappen (gesamt)</h4>${prefTable(P.horse.blinkers, "Scheuklappen")}</div>
      <div class="panel"><h4>Pferd nach Trainer (gesamt)</h4>${trainerTable(P.horse.trainer)}</div>
    </div>

      ? `<button class="riv-btn ${vorneCls(x.duels_sum)}" type="button" data-duel="1" data-k="${dk}" aria-expanded="${dOffen}" title="Grün: gegen mindestens die Hälfte der heutigen Gegner vorne erwartet, rot: gegen weniger">${dOffen ? "▾" : "▸"} ${duelKnopf(x.duels_sum, x.duels.length)}</button>${dOffen ? duelsHTML(x.duels, race) : ""}`
      : `<p class="muted">Kein passendes Duell mit einem heutigen Gegner (letzte ${DATA.params.duel_days} Tage, ±${DATA.params.duel_dist} m zu heute, Boden innerhalb einer Stufe).</p>`}</div>
    <div class="panel"><h4>Heutige Gegner · indirekte Duelle (letzte ${DATA.params.ind_days} Tage)</h4>${indirektHTML(x, race)}</div>
    <div class="panel"><h4>Letzte Läufe</h4>${formTable(x.form_lines, x.no, x.weight, x.rating, x.days)}</div>

}

// Duelle: je heutigem Gegner das letzte Duell, Abstand damals ± Gewichtsverschiebung (1 kg = 1 Länge)
// Farbe der Duell-Knöpfe wie beim Gegner-Knopf der letzten Läufe: grün ab der Hälfte vorne erwartet
const vorneCls = S => !S || !(S.ahead + S.behind) ? "" : S.ahead / (S.ahead + S.behind) >= 0.5 ? "up" : "down";
function duelKnopf(S, n){
  const t = `${n} ${n === 1 ? "Duell" : "Duelle"} mit ${S.n} heutigen ${S.n === 1 ? "Gegner" : "Gegnern"}`;
  return S.ahead + S.behind ? `${t} · vorne erwartet gegen ${S.ahead}/${S.ahead + S.behind}` : t;
}
// Indirekte Duelle: Vergleich über gemeinsame frühere Gegner, je heutigem Gegner zusammengefasst
// Heutiger Gegner: Nummer, Name und Rang in der PMU-Prognose von allen Startern, z. B. "9 Hey Man 1/10"
function gegnerHeute(no, name, race){
  const feld = race.runners.filter(r => !r.nr), g = race.runners.find(r => r.no === no);
  const S = g && g.prono && g.prono.sel;
  const rang = `${S ? S.rank : "–"}/${feld.length}`;
  const tip = S ? `PMU-Prognose: Rang ${S.rank} von ${feld.length} Startern, cote probable ${S.cote}` : `nicht in der PMU-Auswahl (${feld.length} Starter)`;
  return `${no ? `<b class="num">${no}</b> ` : ""}${esc(title(name))} <span class="muted num" title="${esc(tip)}">${rang}</span>`;
}
function indirektHTML(x, race){
  const I = x.indirect;
  if (!I) return `<p class="muted">Kein gemeinsamer früherer Gegner mit einem heutigen Gegner (Vergleichsrennen der letzten ${DATA.params.ind_days} Tage, ±${DATA.params.ind_dist} m, Boden innerhalb einer Stufe, alle drei in der vorderen Feldhälfte).</p>`;
  const k = `${x.no}|ind`, offen = state.duels.has(k);
  const knopf = `Vergleich mit ${I.n} heutigen ${I.n === 1 ? "Gegner" : "Gegnern"} über gemeinsame Gegner` + (I.ahead + I.behind ? ` · vorne erwartet gegen ${I.ahead}/${I.ahead + I.behind}` : "");
  const kg = v => v == null ? "–" : sgn(v, 1) + " kg";
  const tab = `<div class="rivals duels scroll"><table><thead><tr><th>Gegner heute</th><th>gemeinsame Gegner</th><th class="r" title="Ø Leistungsunterschied in den Vergleichsrennen: Längen × kg je Länge (Boden × Distanz) + Mehrgewicht, jeweils gegen den gemeinsamen Gegner; + = dieses Pferd besser">damals</th><th class="r" title="eigenes Gewicht heute − Gewicht des Gegners heute">Mehrgewicht heute</th><th class="r" title="damals − Mehrgewicht heute; in Längen mit kg je Länge von heute (${fx(I.kpl,2)} kg)">heute erwartet</th></tr></thead><tbody>${
    I.rivals.map(e => {
      const c = e.exp_kg == null ? "" : e.exp_kg > 0 ? "up" : e.exp_kg < 0 ? "down" : "";
      const erw = e.exp_kg == null ? "–" : e.exp_kg === 0 ? "gleichauf" : `${fx(Math.abs(e.exp_kg),1)} kg / ${fx(Math.abs(e.exp_l ?? 0),1)} L ${e.exp_kg > 0 ? "vor ihm" : "hinter ihm"}`;
      return `<tr><td>${gegnerHeute(e.rival_no, e.rival, race)}</td>
        <td title="${esc(e.common.map(title).join(", "))}">${e.common.length} ${e.common.length === 1 ? "Pferd" : "Pferde"} <span class="muted">(${e.n} ${e.n === 1 ? "Vergleich" : "Vergleiche"})</span></td>
        <td class="r num"><span class="${(e.then_kg ?? 0) > 0 ? "up" : (e.then_kg ?? 0) < 0 ? "down" : ""}">${kg(e.then_kg)}</span></td>
        <td class="r num">${kg(e.w_today)}</td>
        <td class="r num"><span class="verdict-chip ${c}">${erw}</span></td></tr>`; }).join("")}</tbody></table>
    <p class="muted" style="margin:4px 0 0;font-size:11.5px">Vergleichsrennen: letzte ${DATA.params.ind_days} Tage, ±${DATA.params.ind_dist} m, Boden innerhalb einer Stufe (PSF nur mit PSF), dieses Pferd, der gemeinsame Gegner und der heutige Gegner jeweils in der vorderen Hälfte des Feldes. Mehrere gemeinsame Gegner bzw. Vergleiche: Durchschnitt.</p></div>`;
  return `<button class="riv-btn ${vorneCls(I)}" type="button" data-duel="1" data-k="${k}" aria-expanded="${offen}" title="Grün: gegen mindestens die Hälfte der heutigen Gegner vorne erwartet, rot: gegen weniger">${offen ? "▾" : "▸"} ${knopf}</button>${offen ? tab : ""}`;
}
function duelsHTML(list, race){
  const kg = v => v == null ? "–" : sgn(v, 1) + " kg";
  return `<div class="rivals duels scroll"><table><thead><tr><th>Gegner heute</th><th>Rennen</th><th class="r">Platz</th><th class="r">Abstand</th><th class="r">Gewicht damals</th><th class="r">Diff. damals</th><th class="r">Diff. heute</th><th class="r">Verschiebung</th><th class="r" title="Abstand damals − Verschiebung des Gewichtsunterschieds, 1 kg = 1 Länge">heute erwartet</th></tr></thead><tbody>${
    list.map(d => {
      const ab = d.diff_l == null ? "–" : d.diff_l > 0 ? `${fx(d.diff_l,1)} L vor ihm` : d.diff_l < 0 ? `${fx(-d.diff_l,1)} L hinter ihm` : "gleichauf";
      const cls = d.diff_l == null ? "" : d.diff_l > 0 ? "up" : d.diff_l < 0 ? "down" : "";
      const sh = d.shift == null ? "–" : d.shift === 0 ? "unverändert" : `<span class="${d.shift > 0 ? "down" : "up"}">${kg(d.shift)} ${d.shift > 0 ? "ungünstiger" : "günstiger"}</span>`;
      return `<tr><td>${gegnerHeute(d.rival_no, d.rival, race)}</td>
        <td>${dt(d.date)} · ${esc(title(d.course))} ${d.dist ?? ""} m <span class="muted">${esc(d.going || "")}${d.type ? " · " + esc(d.type) : ""}</span></td>
        <td class="r num"><b>${d.pos ?? "–"}</b> / ${d.rival_pos ?? "–"} <span class="muted">(${d.ran ?? "–"})</span></td>
        <td class="r num"><span class="${cls}">${ab}</span></td>
        <td class="r num">${d.weight != null ? fx(d.weight,1) : "–"} / ${d.rival_weight != null ? fx(d.rival_weight,1) : "–"}</td>
        <td class="r num">${kg(d.w_then)}</td><td class="r num">${kg(d.w_today)}</td><td class="r num">${sh}</td>
        <td class="r num">${d.exp_l == null ? "–" : `<span class="verdict-chip ${d.exp_l > 0 ? "up" : d.exp_l < 0 ? "down" : ""}">${d.exp_l > 0 ? `${fx(d.exp_l,1)} L vor ihm` : d.exp_l < 0 ? `${fx(-d.exp_l,1)} L hinter ihm` : "gleichauf"}</span>`}</td></tr>`; }).join("")}</tbody></table>
    <p class="muted" style="margin:4px 0 0;font-size:11.5px">Platz: dieses Pferd / Gegner (Starter). Diff. = eigenes Gewicht − Gewicht des Gegners; Verschiebung = Diff. heute − Diff. damals (+ = trägt heute im Vergleich mehr, also ungünstiger). Heute erwartet = Abstand damals − Verschiebung (1 kg = 1 Länge); am Knopf zählt je Gegner das letzte Duell.</p></div>`;
}

// Fünftel 400 m vor dem Ziel: eigenes Pferd hervorgehoben, dazu Punkte für den 1. (gold), 2. (silber), 3. (bronze)
const PODEST = ["#d4a017", "#a8b0b8", "#b87333"];
function fifthSVG(f, pos, ran, m, top3){
  const mit = (top3 || []).some(q => q != null);
  const W = 104, H = mit ? 36 : 26, cw = 18, ty = mit ? 35 : 25;
  const cells = [1,2,3,4,5].map(i => `<rect x="${2+(i-1)*(cw+2)}" y="2" width="${cw}" height="14" rx="2" fill="${i===f ? "var(--hi)" : "var(--surface-2)"}" stroke="var(--line)"/>`).join("");
  const proZelle = {};
  const dots = (top3 || []).map((q, k) => {
    if (q == null) return "";
    const j = proZelle[q] = (proZelle[q] ?? -1) + 1;
    return `<circle cx="${2+(q-1)*(cw+2) + 4.5 + j*4.5}" cy="21.5" r="3.2" fill="${PODEST[k]}" stroke="rgba(0,0,0,.45)" stroke-width=".6"/>`;
  }).join("");
  const wo = (top3 || []).map((q, k) => q != null ? `${k+1}. im Fünftel ${q}` : null).filter(Boolean).join(", ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fünftel ${f} (Platz ${pos} von ${ran} bei ${m} m)"><title>Platz ${pos} von ${ran}, ${m} m vor dem Ziel → Fünftel ${f}${wo ? ` · ${wo} (gold/silber/bronze)` : ""}</title>${cells}${dots}<text x="2" y="${ty}">vorn</text><text x="${W-2}" y="${ty}" text-anchor="end">hinten</text></svg>`;
}
function paceSVG(v){
  const W = 112, H = 26, lo = 85, hi = 115, x = t => 4 + (Math.max(lo, Math.min(hi, t)) - lo) / (hi - lo) * (W - 8);
  const col = v > 102 ? "var(--bad)" : v < 98 ? "var(--accent)" : "var(--ink-2)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace-Ratio ${v}"><title>Pace-Ratio ${v}: ${v > 100 ? "schnell angegangen (früh schneller als am Schluss)" : "Schlusssprint (am Schluss schneller)"}</title>
    <rect x="4" y="7" width="${W-8}" height="4" rx="2" fill="var(--surface-2)" stroke="var(--line)"/>
    <line x1="${x(100)}" x2="${x(100)}" y1="3" y2="15" stroke="var(--ink-3)"/>
    <circle cx="${x(v)}" cy="9" r="5" fill="${col}"/>
    <text x="4" y="25">Sprint</text><text x="${x(100)}" y="25" text-anchor="middle">100</text><text x="${W-4}" y="25" text-anchor="end">Tempo</text></svg>`;
}
const adjSpan = (v, d=1, unit=" L") => v == null ? "" : `<span class="adj ${v > 0 ? "up" : v < 0 ? "down" : ""}">${sgn(v, d)}${unit}</span>`;

function rivalsHTML(list){
  if (!list || !list.length) return `<div class="rivals muted">Kein Gegner direkt davor oder dahinter ist seitdem wieder gelaufen.</div>`;
  const V = {besser:["up","besser als erwartet"], schlechter:["down","schlechter als erwartet"], "wie erwartet":["","wie erwartet"]};
  return `<div class="rivals"><table><thead><tr><th>Gegner</th><th>damals</th><th>nächster Start</th><th title="Klasse des nächsten Rennens: €/L+ (Ø Gewinn je Lauf der Teilnehmer) und Val+ (Ø Valeur), 100 = Ø aller früheren Rennen">Klasse</th><th>Ergebnis</th><th>vs. Quote</th></tr></thead><tbody>${
    list.map(g => { const n = g.next;
      const damals = `${g.pos ?? "–"}. · ${g.diff_l == null ? "" : g.diff_l < 0 ? `${fx(-g.diff_l,1)} L vor ihm` : g.diff_l > 0 ? `${fx(g.diff_l,1)} L hinter ihm` : "gleichauf"}${g.odds != null ? ` <span class="muted">· ${fx(g.odds,1)}</span>` : ""}`;
      if (!n) return `<tr><td>${esc(title(g.horse))}</td><td class="num">${damals}</td><td colspan="4" class="muted">seitdem nicht wieder gelaufen</td></tr>`;
      const kl = [n.epr_idx != null ? `<span class="ae ${idxCls(n.epr_idx)}" title="€/L+ des nächsten Rennens">€/L+ ${n.epr_idx}</span>` : "",
                  n.val_idx != null ? `<span class="ae ${idxCls(n.val_idx)}" title="Val+ des nächsten Rennens">Val+ ${n.val_idx}</span>` : ""].filter(Boolean).join(" ") || `<span class="muted">–</span>`;
      const v = V[n.verdict] || ["", "–"];
      return `<tr><td>${esc(title(g.horse))}</td><td class="num">${damals}</td>
        <td>${dt(n.date)} · ${esc(title(n.course))} ${n.dist ?? ""} m${g.more ? ` <span class="muted">(+${g.more} weitere)</span>` : ""}</td>
        <td class="num">${kl}</td>
        <td class="num"><b>${n.pos ?? "–"}</b>/${n.ran ?? "–"}</td>
        <td><span class="verdict-chip ${v[0]}" title="Platz ${n.pos ?? "–"} bei Quotenrang ${n.odds_rank ?? "–"} (Kurs ${fx(n.odds,1)})">${v[1]}</span> <span class="muted num">Q-Rang ${n.odds_rank ?? "–"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
}
function rivBtn(f, k, offen){
  const S = f.rivals_stat;
  if (!S) return "";
  const bw = S.better + S.worse, q = bw ? S.better / bw : null;
  const cls = q == null ? "" : q >= 0.5 ? "up" : "down";
  const tip = `${S.n} Gegner, ${S.ran} davon seitdem wieder gelaufen: im nächsten Start ${S.better} besser, ${S.worse} schlechter, ${S.same} wie ihr Quotenrang – angezeigt besser / (besser + schlechter)`;
  return `<button class="riv-btn ${cls}" type="button" data-k="${k}" aria-expanded="${offen}" title="${esc(tip)}">${offen ? "▾" : "▸"} Gegner (${S.n})${bw ? ` · ${S.better}/${bw} besser` : ""}</button>`;
}

const adjTip = (was, w, damals) => (w != null
  ? `groß: bereinigt auf das heutige Gewicht = ${was} − ${fx(w,1)} kg + ${DATA.params.weight_ref}; klein: roh`
  : `heutiges Gewicht unbekannt – nur der Rohwert`) + (damals != null ? ` (damals ${fx(damals,1)} kg getragen)` : "");
function dCell(v, roh, ziel, k, f){
  if (v == null) return `<td class="r num"><span class="muted">–</span></td>`;
  const was = ziel === "L600" ? "Tempo letzte 600 m" : "schnellstes 200-m-Segment der letzten 800 m" + (f.b200_seg ? ` (${f.b200_seg})` : "");
  const t = `Δ${ziel} A: ${sgn(v,2)} km/h gegenüber der Erwartung (Tag × Kurs × Going)` + (k != null ? ` · darin Klassenkorrektur der Gruppe ${sgn(k,2)} km/h` : "") + ` · ${was}: ${fx(roh,1)} km/h`;
  return `<td class="r num" title="${esc(t)}"><span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${sgn(v,1)}</span></td>`;
}
function trCell(f, wHeute){
  if (f.tr == null) return `<td class="r rt-cell"><span class="muted">–</span></td>`;
  const big = f.tr_heute ?? f.tr;
  const umg = wHeute != null ? `groß: auf das heutige Gewicht ${fx(wHeute,1)} kg umgerechnet = TR − (${fx(wHeute,1)} − 55) × 2,2 = ${big}` : "heutiges Gewicht unbekannt – TR bezogen auf 55 kg";
  const t = `TR ${f.tr} lb (bezogen auf 55 kg) = Zeit-Rating ${f.tr_zeit} + Upgrade ${sgn(f.tr_upg ?? 0,1)} (Finishing Speed ${fx(f.fs,1)} % gegen optimal ${fx(f.fs_opt,1)} %)` + (f.tr_ga != null ? ` · Going Allowance ${sgn(f.tr_ga,2)} s/km` : "") + (f.weight != null ? ` · damals ${fx(f.weight,1)} kg getragen` : "") + ` · ${umg}; klein: TR bei 55 kg, darunter Zeit-Rating und Upgrade`;
  const cap = f.tr_cap ? ` · Upgrade auf ${DATA.params.tr_upg_max} lb gedeckelt: Rennen falsch gelaufen, TR unsicher – zählt nicht für das beste TR der Übersicht` : "";
  const p = f.tr_cap ? null : poolLage("tr", big);
  return `<td class="r rt-cell ${f.tr_cap ? "cap" : ""}" title="${esc(t + cap + lageText(p) + " · Farbe in 7 Stufen: oberste/unterste 10 % kräftig, 25 %, 40 %")}"><b class="lvl" style="${stufeStil(p)}">${big}${f.tr_cap ? "*" : ""}</b><small>${f.tr}</small><small>${f.tr_zeit}${f.tr_upg ? " " + sgn(f.tr_upg,0) : ""}</small></td>`;
}
function fsCell(v, ref, label, tip){
  if (v == null) return `<td class="r num"><span class="muted">–</span></td>`;
  const diff = ref != null ? v - ref : null;
  return `<td class="r rt-cell" title="${esc(tip + (diff != null ? ` · ${sgn(diff,1)} gegenüber ${label}` : ""))}"><b>${fx(v,1)}</b>${ref != null ? `<small>${label} ${fx(ref,1)}</small>` : ""}</td>`;
}
function rtCell(raw, adj, tip, cls = "", stil = ""){
  if (raw == null) return `<td class="r rt-cell"><span class="muted">–</span></td>`;
  return `<td class="r rt-cell" title="${esc(tip)}"><b class="lvl ${cls}" style="${stil}">${fx(adj ?? raw, 1)}</b>${adj != null ? `<small>${fx(raw, 1)}</small>` : ""}</td>`;
}
// Kommentar zum Lauf (PMU, französisch); falls übersetzt, Deutsch mit dem Original im Tooltip
function kommentarHTML(f){
  const teil = (de, fr, label, cls) => {
    if (!fr) return "";
    const txt = de || fr;
    return `<span class="${cls}" title="${esc(de ? "Original: " + fr : "Keine Übersetzung verfügbar")}"><b>${label}</b> ${esc(txt)}${de ? "" : ` <span class="fr">FR</span>`}</span>`;
  };

  return a ? `<div class="cmt-t">${a}</div>` : "";
}
// Valeur damals und heute im Vergleich: heute − damals; negativ = heute niedriger eingestuft (günstiger)
function valCell(v, rHeute){
  if (v == null) return `<td class="r num"><span class="muted">–</span></td>`;
  const d = rHeute != null ? Math.round((rHeute - v) * 10) / 10 : null;
  const tip = `Valeur in diesem Rennen ${fx(v,1)}` + (d == null ? " – heutige Valeur unbekannt"
    : d === 0 ? " – heute gleich eingestuft" : ` – heute ${fx(Math.abs(d),1)} ${d > 0 ? "höher (ungünstiger)" : "niedriger (günstiger)"} eingestuft (heute ${fx(rHeute,1)})`);
  return `<td class="r rt-cell" title="${esc(tip)}"><b>${fx(v,1).replace(/\.0$/,"")}</b>${d != null ? `<small class="${d < 0 ? "up" : d > 0 ? "down" : ""}">${d === 0 ? "±0" : sgn(d,1).replace(/\.0$/,"")}</small>` : ""}</td>`;
}
const SAME_NAME = {K: "Kurs (gleicher Belag)", D: "Distanz ±100 m", B: "Bodengruppe"};
const sameHas = (f, k) => (f.same || []).includes(k);
const markIf = (ok, html, k) => ok ? `<mark class="same" title="${SAME_NAME[k]} wie heute">${html}</mark>` : html;
function sameTags(f){
  const s = f.same || [];
  return s.length ? `<span class="same-tags" title="Wie heute: ${s.map(k => SAME_NAME[k]).join(", ")}">${s.map(k => `<b>${k}</b>`).join("")}</span>` : "";
}
// Pause zwischen zwei Läufen (oder bis heute) ab so vielen Tagen als eigene Zeile
const PAUSE_TAGE = 56;
const tageZwischen = (a, b) => Math.round((new Date(a) - new Date(b)) / 864e5);
const pauseZeile = (tage, bisHeute) => tage != null && tage >= PAUSE_TAGE
  ? `<tr class="pause-sep"><td colspan="12">⏸ ${bisHeute ? "seit dem letzten Lauf" : "Pause"} ${tage} Tage (≈ ${Math.round(tage / 7)} Wochen)</td></tr>` : "";

      <td class="fl-cond num">${markIf(sameHas(f, "D"), `${f.dist ?? "–"}m`, "D")} ${markIf(sameHas(f, "B"), esc(f.going || "–"), "B")} ${f.prize != null ? `<span class="ae" style="${verlauf(poolLage("prize", f.prize))}" title="${esc(`Preisgeld €${(f.prize).toLocaleString("de-DE")} – Farbe: Lage unter allen früheren Läufen der heutigen Starter (rot = niedrigstes, grün = höchstes Preisgeld für dieses Rennen)`)}">${prize(f.prize)}</span>` : "–"}${boxForm(f)}<br><span class="muted">${esc(f.type || "")}</span>${kl}</td>
      <td class="fl-pos">${pos} ${mg ? `(${mg})` : ""}${verlaufForm(f)}${blinkIcon(f.blinkers)} <span class="num">${f.weight != null ? fx(f.weight,1).replace(/\.0$/,"") + "kg" : ""}</span><br><span class="muted">${esc(title(f.jockey) || "")} · <span class="num" title="Endquote (odds_final)${f.odds_rank ? `, Quotenrang ${f.odds_rank}` : ""}">Q ${f.odds != null ? fx(f.odds,1) : "–"}${f.fav ? " F" : ""}</span></span>${f.unreliable ? `<br><span class="muted" title="Mehr als ${DATA.params.beaten_l} Längen geschlagen – vermutlich ausgeritten, zählt nicht in den Schnitt">ausgeritten?</span>` : ""}</td>
      ${valCell(f.valeur, rHeute)}
      ${rtCell(f.arr, f.arr_adj, `ARR in diesem Rennen ${fx(f.arr,1)} kg; ${adjTip("ARR", wHeute, f.weight)}${f.rating_filled ? " · Rating für die Referenz ergänzt" : ""} ${lageText(poolLage("arr", f.arr_adj ?? f.arr))} · Farbe in 7 Stufen: oberste/unterste 10 % kräftig, 25 %, 40 %`, "", stufeStil(poolLage("arr", f.arr_adj ?? f.arr)))}
      <td>${f.fifth ? fifthSVG(f.fifth, f.pos_before, f.ran, f.pos_before_m, f.top3_fifth) : `<span class="muted">${f.tracking ? "–" : "kein Tracking"}</span>`}${f.early_pos ? `<span class="early">früh ${f.early_pos}. → ${f.pos_before_m ?? ""} m ${f.pos_before ?? "–"}.</span>` : ""}</td>
      <td>${f.pace_ratio != null ? paceSVG(f.pace_ratio) + `<span class="num"> ${fx(f.pace_ratio,1)}</span>` : `<span class="muted">–</span>`}</td>
