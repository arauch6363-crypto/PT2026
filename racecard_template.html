<title>PMU Race Card</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE7; --ink:#15201A; --ink-2:#4B5A51; --ink-3:#7D8A82;
  --line:#D5DDD3; --accent:#1D5C3A; --accent-ink:#FFFFFF; --hi:#E3A21A; --hi-soft:#F8E6B8;
  --good:#23794A; --bad:#B3392F; --good-soft:#DCEFE2; --bad-soft:#F6DEDB; --cloth:#15201A; --cloth-ink:#F3F5F1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
    --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
    --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
  --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
  --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-block:20px 12px;border-bottom:3px solid var(--ink)}
.top h1{margin:0;font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.top h1 span{color:var(--accent)}
.top .meta{font-size:12px;color:var(--ink-2)}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Rennkopf */
.race-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;padding-block:18px 12px}
.race-time{font:700 44px/0.9 var(--f-display);color:var(--accent)}
.race-title{font:700 26px/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance;margin:0}
.race-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px;font-size:12.5px}
.tag i{font-style:normal;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.result{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:6px 10px}
.tools label{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 10px;cursor:pointer;font-size:12.5px}

/* Starter */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.runner{border-top:1px solid var(--line)}
.runner:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 36px minmax(0,1fr) auto;gap:12px;padding:12px 14px;cursor:pointer;align-items:start}
.row:hover{background:var(--surface-2)}
.cloth{width:40px;text-align:center}
.cloth b{display:block;background:var(--cloth);color:var(--cloth-ink);font:700 22px/34px var(--f-display);border-radius:3px}
.cloth small{display:block;font:500 11px/1.6 var(--f-mono);color:var(--ink-3)}
.who{min-width:0;display:grid;gap:2px}
.name{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.name strong{font:700 20px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.form{font:500 12.5px var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.badge{font:600 10.5px/1 var(--f-body);padding:3px 5px;border-radius:2px;background:var(--hi-soft);color:var(--ink);letter-spacing:.04em}
.badge.bf{background:var(--bad-soft)}
.line2{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.line2 em{font-style:normal;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(38px,auto)) repeat(5,minmax(46px,auto)) auto;gap:2px 12px;text-align:right;align-items:start}
.fact i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fact span{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.fact .odds{font-weight:500;color:var(--accent)}
.nr .row{opacity:.45}
.nr .name strong{text-decoration:line-through}

/* Detail */
.detail{padding:4px 14px 18px 106px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.detail>*,.panel{min-width:0}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.panel h4{margin:0 0 6px;font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 6px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);font-size:12.5px}
th{font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td.r,th.r{text-align:right}
.ae{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:2px}
.ae.up{background:var(--good-soft);color:var(--good)}
.ae.down{background:var(--bad-soft);color:var(--bad)}
.ae.thin{opacity:.55}
.pref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.pref .grp b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.pref .it{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--line)}
.pref .it span:first-child{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pref .it span:last-child{font-family:var(--f-mono);white-space:nowrap}
.scroll{overflow-x:auto}
.formtab{min-width:1010px}
.formtab td{padding:6px}
.fl-date{font-weight:600;white-space:nowrap}
.fl-cond{white-space:nowrap}
.fl-pos b{font:700 16px var(--f-display)}
.adj{font-size:11px;margin-left:4px}
.adj.up{color:var(--good)} .adj.down{color:var(--bad)}
svg text{fill:var(--ink-3);font:10px var(--f-mono)}
.legend{font-size:12px;color:var(--ink-2);display:grid;gap:4px;padding:14px;background:var(--surface-2);border-radius:4px;margin-top:18px}
.legend b{color:var(--ink)}
.empty{padding:24px;text-align:center;color:var(--ink-2)}


.silk img{display:block;width:34px;height:34px;object-fit:contain}
.nosilk{display:block;width:34px;height:34px;border:1px dashed var(--line);border-radius:50% 50% 4px 4px}
.changes{display:flex;flex-wrap:wrap;gap:4px}
.badge.chg{background:var(--surface-2);border:1px solid var(--hi);font-weight:500}
.career{margin-left:12px;font:500 12px var(--f-mono);color:var(--ink)}
.form{display:flex;flex-wrap:wrap;gap:2px 0}
.trend{margin-left:3px;font-size:13px;line-height:1}
.metric{display:grid;justify-items:end}
.metric i{font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.metric span{font:500 14px var(--f-mono)}
.metric span.up{color:var(--good)} .metric span.down{color:var(--bad)}
.metric small{font:10.5px var(--f-mono);color:var(--ink-3)}
.metric em.sd{font:9.5px var(--f-mono);color:var(--ink-3);margin-left:2px}
.metric.rt span{font-weight:600;color:var(--accent)}
.rt-cell b{font:600 14px var(--f-mono)}
.rt-cell small{display:block;font:10.5px var(--f-mono);color:var(--ink-3)}
.oddsbox{display:grid;justify-items:center;align-content:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:4px 10px;min-width:58px}
.oddsbox i{font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.oddsbox b{font:700 22px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.panels.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.preftab tr.today td{background:var(--hi-soft);font-weight:600}
.heute{font:600 9.5px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin-left:4px}
.replay{display:inline-block;margin:4px 4px 0 0;border:1px solid var(--accent);border-radius:3px;padding:1px 6px;font:500 11px var(--f-body);color:var(--accent);text-decoration:none;white-space:nowrap}
.replay:hover{background:var(--accent);color:var(--accent-ink)} .replay.page{border-color:var(--line);color:var(--ink-2)}
.riv-btn{margin-top:4px;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:1px 6px;font:500 11px var(--f-body);color:var(--ink-2);cursor:pointer}
.rivrow td{background:var(--surface-2)}
.rivals{padding:4px 2px}
.rivals table td,.rivals table th{border-bottom-color:var(--line);background:transparent}
.verdict-chip{font-size:11.5px;padding:1px 6px;border-radius:2px;border:1px solid var(--line)}
.verdict-chip.up{background:var(--good-soft);color:var(--good);border-color:transparent}
.verdict-chip.down{background:var(--bad-soft);color:var(--bad);border-color:transparent}
tr.unrel td{opacity:.6}
td.num,.adj,.ae{white-space:nowrap}
/* Pace-Szenario & Bahn-Bias */
.insight{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.insight>section{background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.insight h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.verdict{font:700 22px/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.verdict.schnell{color:var(--bad)} .verdict.langsam{color:var(--accent)} .verdict.normal{color:var(--ink)}
.verdict small{font:500 13px var(--f-mono);color:var(--ink-2);text-transform:none;letter-spacing:0;margin-left:6px}
.note{font-size:12px;color:var(--ink-2)}
.styles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.styles div{border:1px solid var(--line);border-radius:3px;padding:5px 6px;min-width:0}
.styles b{display:flex;justify-content:space-between;gap:4px;font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.styles b span{font-family:var(--f-mono);color:var(--ink)}
.styles i{display:block;font:500 12px var(--f-mono);font-style:normal;color:var(--ink);word-break:break-word;min-height:1.2em}
.styles .F{border-color:var(--bad)} .styles .H{border-color:var(--accent)}
.stil{font:700 10.5px/1 var(--f-mono);padding:3px 5px;border-radius:2px;border:1px solid var(--line);color:var(--ink-2)}
.stil.F{border-color:var(--bad);color:var(--bad)} .stil.V{border-color:var(--hi);color:var(--ink)}
.stil.H{border-color:var(--accent);color:var(--accent)}
.bias-num{font:700 30px/1 var(--f-display)}
.bias-num.up{color:var(--bad)} .bias-num.down{color:var(--accent)}
.early{display:block;font:10px var(--f-mono);color:var(--ink-3)}
@media (max-width:760px){ .insight{grid-template-columns:minmax(0,1fr)} .styles{grid-template-columns:repeat(2,minmax(0,1fr))} }

@media (max-width:760px){
  .row{grid-template-columns:40px 34px minmax(0,1fr)}
  .facts{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));text-align:left}
  .metric{justify-items:start}
  .oddsbox{grid-column:1/-1;grid-auto-flow:column;justify-content:space-between}
  .panels.two{grid-template-columns:minmax(0,1fr)}
  .detail{padding-left:14px}
  .panels,.pref{grid-template-columns:minmax(0,1fr)}
  .race-time{font-size:34px}.race-title{font-size:21px}
}
@media (prefers-reduced-motion:no-preference){ .row{transition:background .12s} }
</style>

<div class="wrap">
  <header class="top">
    <h1>Race Card <span id="hd-date"></span></h1>
    <div class="meta" id="hd-meta"></div>
  </header>
  <nav class="nav" aria-label="Rennen">
    <div class="tabs" id="meetings" role="tablist"></div>
    <div class="chips" id="races" role="tablist"></div>
  </nav>
  <main id="race"></main>
  <section class="legend" id="legend"></section>
</div>

<script>
const DATA = /*__DATA__*/null;

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fx = (v, d=1) => v == null ? "–" : Number(v).toFixed(d);
const sgn = (v, d=2) => v == null ? "" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
const title = s => s ? String(s).toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m,a,b) => a + b.toUpperCase()) : "";
const dt = s => { if (!s) return "–"; const [y,m,d] = s.split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const prize = v => v == null ? "–" : v >= 1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,"") + "m" : Math.round(v/1000) + "k";
const pct = (w, r) => r ? Math.round(100*w/r) + "%" : "–";
function lengths(v){
  if (v == null) return "";
  if (v >= 30) return "dist";
  if (v <= 0) return "dh";
  if (v < 0.08) return "nse";
  if (v < 0.15) return "shd";
  if (v < 0.23) return "hd";
  if (v < 0.4) return "nk";
  const w = Math.floor(v + 1e-9), f = v - w;
  const fr = f < 0.125 ? "" : f < 0.375 ? "¼" : f < 0.625 ? "½" : f < 0.875 ? "¾" : "";
  const whole = f >= 0.875 ? w + 1 : w;
  return (whole ? whole : "") + fr + "l";
}
const INC = {DISQUALIFIE:"DSQ", ARRETE:"PU", TOMBE:"F", NON_PLACE:"", RESTE_AU_POTEAU:"RR", DEROBE:"RO", ARRETE_AVANT:"PU"};

// Starterzeile bleibt zwischen Neuladen erhalten
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let state = {meeting:null, race:null, sort:"no", open:new Set(), rivals:new Set()};

function init(){
  if (!DATA || !DATA.meetings || !DATA.meetings.length){
    $("#race").innerHTML = `<p class="empty">Keine Rennen in den Daten.</p>`; return;
  }
  $("#hd-date").textContent = dt(DATA.date);
  const h = DATA.history || {};
  $("#hd-meta").textContent = `Stand ${DATA.generated} · Historie ab ${dt(h.from)} · ${(h.runs||0).toLocaleString("de-DE")} Läufe, davon ${(h.tracked||0).toLocaleString("de-DE")} mit Tracking`;
  const saved = store.get("rc-race");
  const first = DATA.races[saved] ? DATA.races[saved] : DATA.races[DATA.meetings[0].races[0]];
  state.meeting = first.reunion; state.race = first.race_id;
  state.sort = store.get("rc-sort") || "no";
  renderNav(); renderRace(); renderLegend();
}

function renderNav(){
  $("#meetings").innerHTML = DATA.meetings.map(m =>
    `<button class="tab" role="tab" aria-selected="${m.reunion===state.meeting}" data-m="${m.reunion}">R${m.reunion} · ${esc(title(m.course))}</button>`).join("");
  const m = DATA.meetings.find(x => x.reunion === state.meeting);
  $("#races").innerHTML = m.races.map(id => { const r = DATA.races[id];
    return `<button class="chip" role="tab" aria-selected="${id===state.race}" data-r="${id}"><b>C${r.race_no}</b>${esc(r.time||"")}</button>`; }).join("");
  document.querySelectorAll("#meetings .tab").forEach(b => b.onclick = () => {
    state.meeting = +b.dataset.m; state.race = DATA.meetings.find(x => x.reunion === state.meeting).races[0];
    state.open.clear(); renderNav(); renderRace(); });
  document.querySelectorAll("#races .chip").forEach(b => b.onclick = () => {
    state.race = b.dataset.r; state.open.clear(); renderNav(); renderRace(); });
  store.set("rc-race", state.race);
}

const SORTS = {
  no:    ["Startnummer", r => r.no ?? 99, 1],
  odds:  ["Kurs", r => r.odds ?? r.odds_morning ?? 999, 1],
  v600:  ["L600 bereinigt (Ø)", r => r.summary.v600 ?? -99, -1],
  v400:  ["L400 bereinigt (Ø)", r => r.summary.v400 ?? -99, -1],
  accel: ["Δ400 bereinigt (Ø)", r => r.summary.accel ?? -99, -1],
  best:  ["Best Seg bereinigt (Ø)", r => r.summary.best ?? -99, -1],
  peak:  ["Peak bereinigt (Ø)", r => r.summary.peak ?? -99, -1],
  tae:   ["Trainer A/E 365 T", r => r.ae.trainer.d365.ae ?? -1, -1],
  jae:   ["Jockey A/E 365 T", r => r.ae.jockey.d365.ae ?? -1, -1],
  rating:["Rating", r => r.rating ?? -1, -1],
  rtr:   ["RTR bereinigt (heutiges Gewicht)", r => r.rtr.adj ?? -99, -1],
  arr:   ["ARR bereinigt (bestes, heutiges Gewicht)", r => r.arr.best_adj ?? -99, -1],
  style: ["Laufstil (vorne zuerst)", r => r.early ?? 9, 1],
};

function renderRace(){
  const r = DATA.races[state.race];
  const [, key, dir] = SORTS[state.sort] || SORTS.no;
  const runners = [...r.runners].sort((a,b) => (a.nr - b.nr) || dir*(key(a) - key(b)) || (a.no - b.no));
  const tags = [
    ["Distanz", r.distance ? r.distance + " m" : "–"],
    ["Boden", (r.going || "–") + (r.going_value ? " · " + r.going_value : "")],
    ["Preisgeld", "€" + prize(r.prize)],
    ["Typ", r.type || "–"],
    ["Alter", r.age ? title(r.age.replace(/_/g," ")) : "–"],
    ["Starter", r.runners.filter(x => !x.nr).length + (r.declared ? "/" + r.declared : "")],
    ["Bahn", r.corde ? title(r.corde.replace(/_/g," ")) : "–"],
  ];
  $("#race").innerHTML = `
    <div class="race-head">
      <div class="race-time">${esc(r.time || "")}</div>
      <h2 class="race-title">R${r.reunion} C${r.race_no} · ${esc(title(r.name))}</h2>
      <div class="race-sub">${tags.map(([k,v]) => `<span class="tag"><i>${k}</i>${esc(v)}</span>`).join("")}</div>
      ${r.result ? `<div class="result">Einlauf: <span class="num">${esc(r.result)}</span></div>` : ""}
    </div>
    ${insightHTML(r)}
    <div class="tools">
      <label for="sort">Sortieren <select id="sort">${Object.entries(SORTS).map(([k,[l]]) => `<option value="${k}" ${k===state.sort?"selected":""}>${l}</option>`).join("")}</select></label>
      <button class="btn" id="toggle-all" type="button">${state.open.size ? "Alle zuklappen" : "Alle aufklappen"}</button>
    </div>
    <div class="card">${runners.map(x => runnerHTML(x, r)).join("") || `<p class="empty">Keine Starter.</p>`}</div>`;
  $("#sort").onchange = e => { state.sort = e.target.value; store.set("rc-sort", state.sort); renderRace(); };
  $("#toggle-all").onclick = () => {
    if (state.open.size) state.open.clear(); else r.runners.forEach(x => state.open.add(x.no));
    renderRace(); };
  document.querySelectorAll(".row").forEach(el => {
    const go = () => { const n = +el.dataset.no; state.open.has(n) ? state.open.delete(n) : state.open.add(n); renderRace(); };
    el.onclick = go; el.onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); go(); } };
  });
  document.querySelectorAll(".riv-btn").forEach(b => b.onclick = e => {
    e.stopPropagation(); const k = b.dataset.k;
    state.rivals.has(k) ? state.rivals.delete(k) : state.rivals.add(k); renderRace(); });
}

function insightHTML(r){
  const P = r.pace, B = r.bias, A = DATA.bias_all;
  const styles = DATA.params.styles;
  const grid = styles.map(st => { const nos = (P && P.groups[st.key]) || [];
    return `<div class="${st.key}"><b>${st.label}<span>${nos.length}</span></b><i>${nos.join(" · ") || "–"}</i></div>`; }).join("");
  let verdict = `<div class="verdict normal">Keine Einschätzung</div><div class="note">Zu wenige Starter mit Laufstil-Daten (mindestens 3 nötig).</div>`;
  if (P && P.expected != null){
    const txt = {schnell:"Schnelles Tempo erwartet", langsam:"Langsames Tempo – Sprintfinish", normal:"Normales Tempo erwartet"}[P.label];
    verdict = `<div class="verdict ${P.label}">${txt}<small>Pace ≈ ${fx(P.expected,1)}</small></div>
      ${paceSVG(P.expected)}
      <div class="note">Norm dieser Distanzgruppe ${fx(P.norm,1)} · ${P.n_front} Tempomacher (früh im vorderen ${Math.round(DATA.params.pacemaker*100)} %): ${sgn(P.part_front,1)} · ${P.runners} Starter: ${sgn(P.part_field,1)} (gegenüber ${DATA.params.field_ref} Startern) · Modell aus ${P.basis.toLocaleString("de-DE")} Rennen: ${sgn(P.coef.front,2)} je Tempomacher, ${sgn(P.coef.field,2)} je Starter.</div>`;
  }
  const unk = P && P.unknown.length ? `<div class="note">Ohne Laufstil-Daten: ${P.unknown.join(" · ")}</div>` : "";
  let bias = `<div class="note">Zu wenige Rennen mit Tracking auf dieser Bahn/Distanz (mindestens 15).</div>`;
  if (B){
    const d = A ? B.bias - A.bias : null;
    const rel = d == null ? "" : Math.abs(d) < 0.25 ? "etwa wie im Schnitt aller Bahnen" :
      d > 0 ? "vorne stärker im Vorteil als im Schnitt" : "abwartend gerittene Pferde hier besser als im Schnitt";
    bias = `<div><span class="bias-num ${B.bias > 0 ? "up" : B.bias < 0 ? "down" : ""}">${sgn(B.bias,2)}</span>
      <span class="note">${B.bias > 0 ? "Frontrenner erfolgreicher" : B.bias < 0 ? "Abwartend Gerittene erfolgreicher" : "ausgeglichen"} · ${rel}</span></div>
      <div class="note">IV vorne ${fx(B.iv_front,2)} · IV hinten ${fx(B.iv_back,2)} · ${B.races} Rennen (${B.basis === "exakt" ? `${esc(title(r.course))} ${r.distance} m` : `${esc(title(r.course))}, ${esc(r.dist_label || "")}`})${A ? ` · alle Bahnen ${sgn(A.bias,2)}` : ""}</div>`;
  }
  return `<div class="insight">
    <section><h3>Pace-Szenario</h3>${verdict}<div class="styles">${grid}</div>${unk}</section>
    <section><h3>Bahn-Bias · vorne vs. hinten</h3>${bias}</section>
  </div>`;
}

function aeChip(s, minRuns=10){
  if (!s || !s.runs) return `<span class="muted">–</span>`;
  const cls = s.ae == null ? "" : s.ae >= 0.95 ? "up" : s.ae <= 0.75 ? "down" : "";
  return `<span class="ae ${cls} ${s.runs < minRuns ? "thin" : ""}" title="${s.wins} Siege aus ${s.runs} Starts, erwartet ${fx(s.exp,1)}">${s.ae == null ? "–" : s.ae.toFixed(2)}</span>`;
}
function trendIcon(a){
  if (!a.trend) return "";
  const k = a.d30, l = a.d365;
  const t = `Letzte 30 Tage: ${k.wins}-${k.runs}, A/E ${fx(k.ae,2)} gegenüber ${fx(l.ae,2)} (365 Tage)`;
  return a.trend === "hot" ? `<span class="trend" title="${t}" aria-label="${t}">🔥</span>` : `<span class="trend" title="${t}" aria-label="${t}">🧊</span>`;
}
const rec = s => s && s.runs ? `${s.wins}-${s.runs} (${pct(s.wins, s.runs)})` : "0-0";
const lenTxt = v => v == null ? "–" : sgn(v, 1) + " L";

function metric(label, v, rank, n, tip, sd){
  const spread = sd != null ? `<em class="sd" title="Streuung (Standardabweichung) der einzelnen Läufe">±${fx(sd,1)}</em>` : "";
  return `<div class="metric" title="${esc(tip)}"><i>${label}</i><span class="${v == null ? "" : v > 0 ? "up" : v < 0 ? "down" : ""}">${v == null ? "–" : sgn(v, 1)}${spread}</span><small>${rank ? `#${rank}/${n}` : "&nbsp;"}</small></div>`;
}

function runnerHTML(x, race){
  const open = state.open.has(x.no);
  const age = [x.age ? x.age + "j" : "", x.sex ? x.sex[0] : ""].filter(Boolean).join(" ");
  const badges = x.badges.map(b => `<span class="badge ${b==="BF"?"bf":""}" title="${{C:"Sieger auf dieser Bahn",D:"Sieger über diese Distanz (±100 m)",CD:"Sieger auf Bahn und Distanz",BF:"Beim letzten Start Favorit und nicht gewonnen"}[b]}">${b}</span>`).join("");
  const changes = (x.changes || []).map(c => `<span class="badge chg" title="${esc(c.text)}">${esc(c.text)}</span>`).join("");
  const blink = x.blinkers && !/^SANS/i.test(x.blinkers) ? `<span class="badge" title="${esc(x.blinkers)}">${/AUSTRAL/i.test(x.blinkers) ? "p" : "b"}</span>` : "";
  const S = x.summary, tip = (einheit, was) => `${was} – bereinigt, Ø der letzten ${S.runs} Läufe mit Tracking (gewichtet nach Distanzähnlichkeit, zum Nullpunkt geschrumpft) in ${einheit}, + = besser als erwartet; darunter Rang im heutigen Feld`;
  const career = x.starts != null ? `${x.starts}-${x.wins ?? 0}-${x.places ?? 0}${x.earn_per_start ? ` · €${fmtEur(x.earn_per_start)}/Start` : ""}` : "";
  const odds = x.odds ?? x.odds_morning;
  return `<article class="runner ${x.nr ? "nr" : ""}">
    <div class="row" data-no="${x.no}" tabindex="0" role="button" aria-expanded="${open}">
      <div class="cloth"><b>${x.no ?? ""}</b>${x.draw ? `<small>(${x.draw})</small>` : ""}</div>
      <div class="silk">${x.silks ? `<img src="${x.silks}" alt="Trikot" width="34" height="34">` : `<span class="nosilk" aria-hidden="true"></span>`}</div>
      <div class="who">
        <div class="name"><strong>${esc(x.horse)}</strong><span class="muted">${age}</span>${x.style ? `<span class="stil ${x.style}" title="Laufstil: ${esc(x.style_label)} – Ø frühe Position ${fx(x.early*100,0)} % des Feldes aus ${x.early_runs} Läufen">${x.style}</span>` : ""}${badges}${blink}${x.nr ? `<span class="badge bf">NP</span>` : ""}</div>
        ${changes ? `<div class="changes">${changes}</div>` : ""}
        <div class="form"><span title="Musique (PMU)">${esc(x.form || "")}</span>${career ? `<span class="career" title="Starts-Siege-Plätze · Gewinnsumme je Start">${career}</span>` : ""}</div>
        <div class="line2">
          <span><em>J</em> ${esc(title(x.jockey) || "–")} ${aeChip(x.ae.jockey.d365)}${trendIcon(x.ae.jockey)}</span>
          <span><em>T</em> ${esc(title(x.trainer) || "–")} ${aeChip(x.ae.trainer.d365)}${trendIcon(x.ae.trainer)}</span>
          <span><em>v.</em> ${esc(title(x.sire) || "–")} – ${esc(title(x.dam) || "–")}</span>
        </div>
      </div>
      <div class="facts">
        <div class="fact"><i>Gew.</i><span>${x.weight != null ? fx(x.weight, 1) : "–"}</span></div>
        <div class="fact"><i>Rating</i><span>${x.rating != null ? fx(x.rating, 1).replace(/\.0$/, "") : "–"}</span></div>
        <div class="fact"><i>Tage</i><span>${x.days ?? "–"}</span></div>
        ${rtFact("RTR", x.rtr.adj, x.rtr.raw, x.rtr, rtrTip(x))}${rtFact("ARR", x.arr.best_adj, x.arr.best, x.arr, arrTip(x))}
        ${metric("L600", S.v600, S.v600_rank, S.v600_n, tip("Längen", "Tempo letzte 600 m"), S.v600_sd)}${metric("Δ400", S.accel, S.accel_rank, S.accel_n, tip("km/h", "Tempo letzte 400 m minus Tempo 600–400 m: beschleunigt (+) oder bricht ein (−)"), S.accel_sd)}${metric("Best", S.best, S.best_rank, S.best_n, tip("km/h", "schnellster 200-m-Abschnitt der letzten " + DATA.params.best_seg_m + " m"), S.best_sd)}
        <div class="oddsbox" title="${x.odds != null ? "Aktueller Kurs" : "Morgenkurs"}"><i>Kurs</i><b>${odds != null ? fx(odds, 1) : "–"}</b></div>
      </div>
    </div>
    ${open ? detailHTML(x, race) : ""}
  </article>`;
}
function rtFact(label, adj, raw, R, tip){
  const v = adj ?? raw;
  return `<div class="metric rt" title="${esc(tip)}"><i>${label}</i><span>${v != null ? fx(v, 1) : "–"}${adj != null && raw != null ? `<em class="sd">${fx(raw, 1)}</em>` : ""}</span><small>${R.rank ? `#${R.rank}/${R.n}` : "&nbsp;"}</small></div>`;
}
const gewTxt = x => x.weight != null ? `heutiges Gewicht ${fx(x.weight,1)} kg` : "heutiges Gewicht unbekannt";
function rtrTip(x){
  const R = x.rtr, ref = DATA.params.weight_ref;
  if (R.raw == null) return "RTR: noch kein bewerteter Lauf";
  return `RTR (Rating nach dem letzten Rennen, Elo-artig, kg): ${fx(R.raw,1)}${R.prev != null ? ` (davor ${fx(R.prev,1)})` : ""} · bereinigt = RTR − Gewicht + ${ref} mit ${gewTxt(x)}; klein daneben der Rohwert, darunter Rang im heutigen Feld`;
}
function arrTip(x){
  const A = x.arr, ref = DATA.params.weight_ref;
  if (A.best == null) return "ARR: kein bewerteter Lauf";
  return `ARR (Leistung im Rennen, kg): bestes der letzten ${DATA.params.form_runs} Läufe ${fx(A.best,1)}, zuletzt ${A.last != null ? fx(A.last,1) : "–"}${A.last_adj != null ? ` (bereinigt ${fx(A.last_adj,1)})` : ""}, Ø letzte 3: ${fx(A.avg3,1)} · bereinigt = ARR − Gewicht + ${ref} mit ${gewTxt(x)}; klein daneben der Rohwert, darunter Rang im heutigen Feld`;
}
const fmtEur = v => v >= 1000 ? (v/1000).toFixed(1).replace(/\.0$/,"") + "k" : String(Math.round(v));

function prefTable(rows, head){
  if (!rows || !rows.length) return `<p class="muted">Keine Läufe in der Historie.</p>`;
  return `<table class="preftab"><thead><tr><th>${head}</th><th class="r">S-L</th><th class="r">Plätze</th><th class="r">A/E</th></tr></thead><tbody>${
    rows.map(z => `<tr class="${z.today ? "today" : ""}"><td>${esc(z.label)}${z.today ? ` <span class="heute">heute</span>` : ""}</td><td class="r num">${z.wins}-${z.runs} (${pct(z.wins,z.runs)})</td><td class="r num">${z.places}</td><td class="r">${aeChip(z, 5)}</td></tr>`).join("")}</tbody></table>`;
}

function detailHTML(x, race){
  const w = DATA.params.ae_windows;
  const aeRows = [["Trainer", x.ae.trainer], ["Jockey", x.ae.jockey], ["Vater", x.ae.sire]].map(([l, s]) =>
    `<tr><td>${l}</td>${w.map(t => { const v = s["d"+t]; return `<td class="r num">${rec(v)}</td><td class="r">${aeChip(v)}</td>`; }).join("")}</tr>`).join("");
  const P = x.pref;
  const it = (label, s) => `<div class="it"><span title="${esc(label)}">${esc(label)}</span><span>${rec(s)} ${aeChip(s, 5)}</span></div>`;
  const jahre = DATA.params.pref_jt_years;
  const career = x.starts != null ? `${x.starts}-${x.wins ?? 0}-${x.places ?? 0} · €${prize(x.earnings)}${x.earn_per_start ? ` (€${fmtEur(x.earn_per_start)}/Start)` : ""}` : "–";
  return `<div class="detail">
    <div class="line2"><span><em>Karriere</em> ${career}</span><span><em>Besitzer</em> ${esc(title(x.owner) || "–")}</span>${x.odds_morning != null ? `<span><em>Morgenkurs</em> ${fx(x.odds_morning,1)}</span>` : ""}${x.style ? `<span><em>Laufstil</em> ${esc(x.style_label)} · früh Ø ${fx(x.early*100,0)} % des Feldes (${x.early_runs} Läufe)</span>` : ""}</div>
    <div class="panels">
      <div class="panel"><h4>A/E · Siege/Starts</h4>
        <div class="scroll"><table><thead><tr><th></th>${w.map(t => `<th class="r">${t} Tage</th><th class="r">A/E</th>`).join("")}</tr></thead><tbody>${aeRows}</tbody></table></div>
      </div>
      <div class="panel"><h4>Vorlieben · Trainer, Jockey (${jahre} Jahre) · Vater (gesamt)</h4><div class="pref">
        <div class="grp"><b>Trainer</b>${it("mit " + (title(x.jockey) || "–"), P.trainer.jockey)}${it("in " + title(race.course), P.trainer.course)}${it("Typ: " + (race.type || "–"), P.trainer.racetype)}</div>
        <div class="grp"><b>Jockey</b>${it("in " + title(race.course), P.jockey.course)}${it("für " + (title(x.trainer) || "–"), P.jockey.trainer)}</div>
        <div class="grp"><b>Vater</b>${it("Distanz: " + (race.dist_label || "–"), P.sire.distance)}${it("Boden: " + (race.going_label || "unbekannt"), P.sire.going)}</div>
      </div></div>

    <div class="panel"><h4>Letzte Läufe</h4>${formTable(x.form_lines, x.no)}</div>
  </div>`;
}

function fifthSVG(f, pos, ran, m){
  const W = 104, H = 26, cw = 18;
  const cells = [1,2,3,4,5].map(i => `<rect x="${2+(i-1)*(cw+2)}" y="2" width="${cw}" height="14" rx="2" fill="${i===f ? "var(--hi)" : "var(--surface-2)"}" stroke="var(--line)"/>`).join("");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fünftel ${f} (Platz ${pos} von ${ran} bei ${m} m)"><title>Platz ${pos} von ${ran}, ${m} m vor dem Ziel → Fünftel ${f}</title>${cells}<text x="2" y="25">vorn</text><text x="${W-2}" y="25" text-anchor="end">hinten</text></svg>`;
}
function paceSVG(v){
  const W = 112, H = 26, lo = 85, hi = 115, x = t => 4 + (Math.max(lo, Math.min(hi, t)) - lo) / (hi - lo) * (W - 8);
  const col = v > 102 ? "var(--bad)" : v < 98 ? "var(--accent)" : "var(--ink-2)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace-Ratio ${v}"><title>Pace-Ratio ${v}: ${v > 100 ? "schnell angegangen (früh schneller als am Schluss)" : "Schlusssprint (am Schluss schneller)"}</title>
    <rect x="4" y="7" width="${W-8}" height="4" rx="2" fill="var(--surface-2)" stroke="var(--line)"/>
    <line x1="${x(100)}" x2="${x(100)}" y1="3" y2="15" stroke="var(--ink-3)"/>
    <circle cx="${x(v)}" cy="9" r="5" fill="${col}"/>
    <text x="4" y="25">Sprint</text><text x="${x(100)}" y="25" text-anchor="middle">100</text><text x="${W-4}" y="25" text-anchor="end">Tempo</text></svg>`;
}
const adjSpan = (v, d=1, unit=" L") => v == null ? "" : `<span class="adj ${v > 0 ? "up" : v < 0 ? "down" : ""}">${sgn(v, d)}${unit}</span>`;

function rivalsHTML(list){
  if (!list || !list.length) return `<div class="rivals muted">Kein Gegner aus diesem Rennen ist seitdem wieder gelaufen.</div>`;
  const V = {besser:["up","besser als erwartet"], schlechter:["down","schlechter als erwartet"], "wie erwartet":["","wie erwartet"]};
  return `<div class="rivals"><table><thead><tr><th>Gegner</th><th>damals</th><th>nächster Start</th><th>Ergebnis</th><th>vs. Quote</th></tr></thead><tbody>${
    list.map(g => { const n = g.next, v = V[n.verdict] || ["", "–"];
      const damals = `${g.pos ?? "–"}. · ${g.diff_l == null ? "" : g.diff_l < 0 ? `${fx(-g.diff_l,1)} L vor ihm` : g.diff_l > 0 ? `${fx(g.diff_l,1)} L hinter ihm` : "gleichauf"}`;
      return `<tr><td>${esc(title(g.horse))}</td><td class="num">${damals}</td>
        <td>${dt(n.date)} · ${esc(title(n.course))} ${n.dist ?? ""} m${g.more ? ` <span class="muted">(+${g.more} weitere)</span>` : ""}</td>
        <td class="num"><b>${n.pos ?? "–"}</b>/${n.ran ?? "–"}</td>
        <td><span class="verdict-chip ${v[0]}" title="Platz ${n.pos ?? "–"} bei Quotenrang ${n.odds_rank ?? "–"} (Kurs ${fx(n.odds,1)})">${v[1]}</span> <span class="muted num">Q-Rang ${n.odds_rank ?? "–"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
}

function rtCell(raw, adj, tip){
  if (raw == null) return `<td class="r rt-cell"><span class="muted">–</span></td>`;
  return `<td class="r rt-cell" title="${esc(tip)}"><b>${fx(adj ?? raw, 1)}</b>${adj != null ? `<small>${fx(raw, 1)}</small>` : ""}</td>`;
}
function replayLink(f){
  if (f.replay) return `<a class="replay" href="${esc(f.replay)}" target="_blank" rel="noopener" title="Replay des Rennens (PMU)">▶ Replay</a>`;
  if (f.page) return `<a class="replay page" href="${esc(f.page)}" target="_blank" rel="noopener" title="Kein Replay-Link gefunden – Rennseite bei PMU öffnen">PMU ↗</a>`;
  return "";
}
function formTable(rows, no){
  if (!rows.length) return `<p class="muted">Keine früheren Läufe in der Datenbank (nur französische Flachrennen seit Beginn der Sammlung).</p>`;
  const body = rows.map(f => {
    const inc = f.incident && INC[f.incident] !== undefined ? INC[f.incident] : "";
    const pos = f.pos ? `<b>${f.pos}</b>/${f.ran}` : `<b>${inc || "–"}</b>/${f.ran}`;
    const mg = f.pos ? lengths(f.margin) : "";
    const k = `${no}|${f.race_id}`, offen = state.rivals.has(k);
    const btn = f.rivals ? `<button class="riv-btn" type="button" data-k="${k}" aria-expanded="${offen}" title="Gegner aus diesem Rennen und ihr nächster Start">${offen ? "▾" : "▸"} Gegner${f.rivals.length ? ` (${f.rivals.length})` : ""}</button>` : "";
    return `<tr class="${f.unreliable ? "unrel" : ""}">
      <td class="fl-date">${dt(f.date)}<br><span class="muted">${esc(title(f.course))}</span><br>${replayLink(f)}${btn}</td>
      <td class="fl-cond num">${f.dist ?? "–"}m ${esc(f.going || "–")} ${prize(f.prize)}<br><span class="muted">${esc(f.type || "")}</span></td>
      <td class="fl-pos">${pos} ${mg ? `(${mg})` : ""} <span class="num">${f.weight != null ? fx(f.weight,1).replace(/\.0$/,"") + "kg" : ""}</span><br><span class="muted">${esc(title(f.jockey) || "")} · <span class="num">${f.odds != null ? fx(f.odds,1) : "–"}${f.fav ? " F" : ""}</span></span>${f.unreliable ? `<br><span class="muted" title="Mehr als ${DATA.params.beaten_l} Längen geschlagen – vermutlich ausgeritten, zählt nicht in den Schnitt">ausgeritten?</span>` : ""}</td>
      ${rtCell(f.rtr, f.rtr_adj, `RTR nach diesem Rennen ${fx(f.rtr,1)} kg; bereinigt = RTR − ${fx(f.weight,1)} kg + ${DATA.params.weight_ref}`)}
      ${rtCell(f.arr, f.arr_adj, `ARR in diesem Rennen ${fx(f.arr,1)} kg; bereinigt = ARR − ${fx(f.weight,1)} kg + ${DATA.params.weight_ref}${f.rating_filled ? " · Rating für die Referenz ergänzt" : ""}`)}
      <td>${f.fifth ? fifthSVG(f.fifth, f.pos_before, f.ran, f.pos_before_m) : `<span class="muted">${f.tracking ? "–" : "kein Tracking"}</span>`}${f.early_pos ? `<span class="early">früh ${f.early_pos}. → ${f.pos_before_m ?? ""} m ${f.pos_before ?? "–"}.</span>` : ""}</td>
      <td>${f.pace_ratio != null ? paceSVG(f.pace_ratio) + `<span class="num"> ${fx(f.pace_ratio,1)}</span>` : `<span class="muted">–</span>`}</td>
      <td class="r num">${fx(f.finish_index,1)}${adjSpan(f.fi_adj, 1, "")}</td>
      <td class="r num">${f.pos_gain != null ? sgn(f.pos_gain, 0) : "–"}</td>
      <td class="r num" title="${f.weg_med != null ? `${fx(Math.abs(f.weg_med),1)} m ${f.weg_med >= 0 ? "mehr" : "weniger"} gelaufen als der Median des Feldes (≈ ${fx(Math.abs(f.weg_med)/2.4,1)} Längen)` : ""}">${f.weg_med != null ? sgn(f.weg_med, 1) : "–"}</td>
      <td class="r num" title="${f.best_seg_to_go != null ? `Schnellster Abschnitt ab ${f.best_seg_to_go} m vor dem Ziel, als Zeit je 200 m` : ""}">${fx(f.best_seg_s,2)}${adjSpan(f.best_adj, 1, "")}</td>
      <td class="r num" title="${f.sec_mismatch ? "Abschnittszeiten passen nicht zur offiziellen Zeit der letzten 600 m – Tempi der Schlussphase verworfen" : f.path_factor != null ? `Wegfaktor ${fx(f.path_factor,3)} (gelaufene ÷ nominale Distanz) eingerechnet` : ""}">${f.sec_mismatch ? "✗" : fx(f.v600,1)}${adjSpan(f.v600_adj)}</td>
      <td class="r num">${fx(f.v400,1)}${adjSpan(f.v400_adj)}</td>
      <td class="r num" title="Tempo letzte 400 m minus Tempo 600–400 m (km/h); klein: bereinigt">${f.accel != null ? sgn(f.accel,1) : "–"}${adjSpan(f.accel_adj, 1, "")}</td>
      <td class="r num" title="Best Seg minus L600 (km/h): Spitze über Ausdauer; klein: bereinigt">${f.peak != null ? sgn(f.peak,1) : "–"}${adjSpan(f.peak_adj, 1, "")}</td>
    </tr>${offen ? `<tr class="rivrow"><td colspan="15">${rivalsHTML(f.rivals)}</td></tr>` : ""}`; }).join("");
  return `<div class="scroll"><table class="formtab"><thead><tr>
    <th>Datum · Bahn</th><th>Dist · Boden · Preis · Typ</th><th>Pos · Gew. · Jockey · Kurs</th>
    <th class="r" title="RTR: Rating nach dem Rennen (Elo-artig, kg), groß bereinigt = RTR − Gewicht in diesem Lauf + ${DATA.params.weight_ref}, klein roh">RTR</th>
    <th class="r" title="ARR: Leistung im Rennen gemessen an den Pferden im vorderen Drittel des Einlaufs (kg), groß bereinigt = ARR − Gewicht in diesem Lauf + ${DATA.params.weight_ref}, klein roh">ARR</th>
    <th title="Position ${DATA.params.pos_before_m} m vor dem Ziel als Fünftel des Feldes">Pos. vor Finish</th>
    <th title="Tempo frühe Phase / Tempo Schlussphase × 100">Pace-Ratio</th>
    <th class="r" title="Endspeed (letzte 400 m) ÷ Tempo davor × 100; klein: bereinigt in Indexpunkten">Finish-Idx</th><th class="r" title="Plätze gut gemacht von 800 m bis Ziel">±800</th><th class="r" title="Gelaufene Meter mehr (+) oder weniger (−) als der Median aller Starter im Rennen">Weg m</th>
    <th class="r" title="Schnellster 200-m-Abschnitt in den letzten ${DATA.params.best_seg_m} m (s); klein: bereinigt in km/h">Best Seg</th>
    <th class="r" title="km/h letzte 600 m; klein: bereinigt in Längen">L600</th><th class="r" title="km/h letzte 400 m; klein: bereinigt in Längen">L400</th>
    <th class="r" title="L400 minus Tempo 600–400 m (km/h): beschleunigt (+) oder bricht ein (−); klein: bereinigt in km/h">Δ400</th>
    <th class="r" title="Best Seg minus L600 (km/h): Spitze über Ausdauer; klein: bereinigt in km/h">Peak</th>
  </tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderLegend(){
  const p = DATA.params;
  $("#legend").innerHTML = `
    <div><b>A/E</b> = Siege ÷ Σ(1/Endquote). Über 1 gewinnt die Person öfter, als der Markt erwartet. Grün ≥ 0,95, rot ≤ 0,75; blass bei weniger als 10 Starts (Vorlieben: 5). In der Übersicht: 365 Tage; 🔥 / 🧊 wenn die letzten 30 Tage um mindestens ${String(p.trend_diff).replace(".", ",")} darüber bzw. darunter lagen (ab ${p.trend_min} Starts).</div>
    <div><b>Bereinigt</b> (L600, L400 in Längen; Best Seg, Δ400, Peak in km/h; Finish-Index in Punkten): Das Tempo des Pferdes wird zerlegt in einen Rennanteil – wie schnell die vordere Hälfte des Feldes im Finish war, verglichen mit einem Par für Distanz, Boden, Bahn und das frühe Tempo des Rennens (Leave-one-out, das Rennen bestimmt sein Par nicht selbst) – und einen Pferdeanteil gegenüber diesem Feld. 0 = wie die vordere Hälfte eines normalen Rennens, + = schneller. Tempi der Schlussphase und Finish-Index werden aus den Abschnittszeiten je Pferd gebildet, mit dem Wegfaktor (gelaufene ÷ nominale Distanz) skaliert und gegen die offizielle Zeit der letzten 600 m geprüft (✗ = Abschnitte unbrauchbar). <b>Finish-Index</b> = Tempo letzte 400 m ÷ Tempo davor × 100. <b>Δ400</b> = Tempo letzte 400 m minus Tempo 600–400 m (beschleunigt oder bricht ein), <b>Peak</b> = Best Seg minus L600 (Spitze über Ausdauer); Best Seg nur aus den letzten ${p.best_seg_m} m. Mehr als ${p.beaten_l} Längen Geschlagene gelten als ausgeritten und zählen nicht in den Schnitt. Übersicht: Ø der letzten ${p.avg_runs} Läufe mit Tracking, gewichtet nach Distanzähnlichkeit (halbes Gewicht bei ${p.avg_dist_m} m Unterschied) und zum Nullpunkt geschrumpft (wie ein zusätzlicher Lauf mit 0 – ein Lauf allein zählt weniger als drei); ± = Streuung der Einzelläufe; darunter der Rang im heutigen Feld.</div>
    <div><b>Pos. vor Finish</b>: Platz ${p.pos_before_m} m vor dem Ziel, eingeteilt in Fünftel des Feldes (hervorgehoben). <b>Pace-Ratio</b>: Tempo der frühen Phase ÷ Tempo der letzten ≥ 600 m × 100; unter 100 Schlusssprint, über 100 schnell angegangen. <b>Weg m</b>: gelaufene Meter gegenüber dem Median aller Starter im Rennen (≈ 2,4 m je Länge); + = weiter gelaufen, meist außen.</div>
    <div><b>RTR</b> (Rating nach dem Rennen, in kg): Elo-artig, Rennen für Rennen in zeitlicher Reihenfolge. Start mit dem offiziellen Rating (sonst 30); in jedem Rennen tritt jedes Pferd gegen jedes andere an – erwartet wird ein Abstand aus Rating − 0,625 × Gewicht, verglichen mit dem tatsächlichen Abstand in Längen × kg je Länge (nach Boden und Distanz), beides auf einer log. Stufe von 1 bis 5. Das Rating wandert um 0,5 × Ø Überraschung (+ kleiner Preisgeldbonus). <b>ARR</b> (Leistung im Rennen, in kg): gemessen an den Pferden im vorderen Drittel des Einlaufs – deren Rating plus Längenabstand × kg je Länge (große Abstände logarithmisch gedämpft) plus Gewichtsunterschied, Ø über diese Referenzen; fehlende Ratings der Referenzen werden aus vergleichbaren Pferden ergänzt. <b>Bereinigt</b> = Wert − Gewicht + ${p.weight_ref} (Übersicht: heutiges Gewicht; Formzeile: Gewicht in jenem Lauf), klein daneben der Rohwert. Übersicht: RTR = aktuelles Rating, ARR = bestes der letzten ${p.form_runs} Läufe; darunter der Rang im heutigen Feld.</div>
    <div><b>▶ Replay</b>: Video des früheren Rennens (PMU, für die letzten ${p.form_runs} Läufe); <b>PMU ↗</b>, wenn PMU kein Replay liefert – dann die Rennseite bei PMU.</div>
    <div><b>Gegner</b>: für die letzten ${p.rivals_runs} Läufe die bis zu ${p.rivals_max} Gegner, die am nächsten am Pferd ins Ziel kamen und seitdem wieder gelaufen sind – mit Platz im nächsten Start und ob der besser oder schlechter war als der Rang ihrer Quote.</div>
    <div><b>Laufstil</b> F führend · V vorne dabei · M Mittelfeld · H hinten – aus der Ø frühen Position der letzten ${p.style_runs} Läufe mit Tracking. <b>Pace-Szenario</b>: Norm der Distanzgruppe plus Effekt der Tempomacher und der Feldgröße, geschätzt aus früheren Rennen. <b>Bahn-Bias</b> = IV vorne − IV hinten; positiv: Frontrenner erfolgreicher.</div>
    <div><b>C</b> Sieger auf der Bahn · <b>D</b> Sieger über die Distanz (±100 m) · <b>CD</b> beides im selben Rennen · <b>BF</b> letzter Start als Favorit geschlagen. Karriere: Starts-Siege-Plätze · Gewinnsumme je Start. Wechsel (Trainer, Scheuklappen, erstmals Wallach) gegenüber dem letzten Lauf in der Datenbank. <b>Tage</b> seit dem letzten Lauf in der Datenbank.</div>`;
}

init();
</script>
