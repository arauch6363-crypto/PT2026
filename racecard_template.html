<title>PMU Race Card</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F5F1; --surface:#FFFFFF; --surface-2:#E9EEE7; --ink:#15201A; --ink-2:#4B5A51; --ink-3:#7D8A82;
  --line:#D5DDD3; --accent:#1D5C3A; --accent-ink:#FFFFFF; --hi:#E3A21A; --hi-soft:#F8E6B8;
  --good:#23794A; --bad:#B3392F; --good-soft:#DCEFE2; --bad-soft:#F6DEDB; --cloth:#15201A; --cloth-ink:#F3F5F1;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
    --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
    --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1411; --surface:#161E19; --surface-2:#1E2822; --ink:#E4EBE5; --ink-2:#A9B6AD; --ink-3:#77857C;
  --line:#2A362F; --accent:#5DBE86; --accent-ink:#0E1411; --hi:#F0B93A; --hi-soft:#4A3A12;
  --good:#6BD394; --bad:#F08A7E; --good-soft:#1B3526; --bad-soft:#3D1F1C; --cloth:#E4EBE5; --cloth-ink:#0E1411;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--f-body);padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1180px;margin:0 auto}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}

/* Kopf */
.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 16px;padding-block:20px 12px;border-bottom:3px solid var(--ink)}
.top h1{margin:0;font:700 34px/1 var(--f-display);letter-spacing:.01em;text-transform:uppercase}
.top h1 span{color:var(--accent)}
.top .meta{font-size:12px;color:var(--ink-2)}
.pmu-link{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap}
.pmu-link:hover{text-decoration:underline}
.race-kurz{font-size:12px;line-height:1.35;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.race-kurz[hidden]{display:none}
.race-kurz b{color:var(--ink);font-weight:600}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:3px;cursor:pointer;white-space:nowrap;font:600 15px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;font-size:13px}
.chip b{font-family:var(--f-mono);font-weight:500;margin-right:6px}
.chip[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* Rennkopf */
.race-head{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:end;padding-block:18px 12px}
.race-time{font:700 44px/0.9 var(--f-display);color:var(--accent)}
.race-title{font:700 26px/1.05 var(--f-display);text-transform:uppercase;text-wrap:balance;margin:0}
.race-sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;gap:6px;align-items:baseline;border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:3px 8px;font-size:12.5px}
.tag i{font-style:normal;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.result{grid-column:1/-1;font-size:13px;color:var(--ink-2)}
.tools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding-block:6px 10px}
.tools label{font-size:12px;color:var(--ink-2);display:flex;gap:6px;align-items:center}
.tools select{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:4px 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:3px;padding:5px 10px;cursor:pointer;font-size:12.5px}

/* Starter */
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.runner{border-top:1px solid var(--line)}
/* aufgeklapptes Pferd: Nummer, Trikot und Name bleiben oben stehen, bis das nächste Pferd kommt */
.runner-kopf{position:sticky;top:var(--nav-h,0px);z-index:4;display:flex;align-items:center;gap:10px;min-height:50px;box-sizing:border-box;
  margin-bottom:calc(-1 * var(--kopf-m,50px));padding:6px 14px;background:var(--surface,var(--ground));border-bottom:1px solid var(--line);
  box-shadow:0 2px 6px rgba(0,0,0,.08);visibility:hidden;cursor:pointer}
.runner.kopf-an .runner-kopf{visibility:visible}
.runner-kopf b.nr-k{background:var(--cloth);color:var(--cloth-ink);font:700 17px/28px var(--f-display);border-radius:3px;min-width:30px;text-align:center}
.runner-kopf img{width:26px;height:26px;object-fit:contain}
.runner-kopf strong{font:700 16px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runner-kopf .muted{margin-left:auto;font:500 12px var(--f-mono);white-space:nowrap}
.runner-kopf .kopf-name{display:flex;flex-direction:column;gap:3px;min-width:0}
.runner-kopf .kopf-tj{font-size:12px;line-height:1.2;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.runner-kopf .kopf-tj em,.runner-kopf .kopf-tj i{font-style:normal;color:var(--ink-3)}
.runner:first-child{border-top:0}
.row{display:grid;grid-template-columns:44px 36px minmax(0,1fr) auto;gap:12px;padding:12px 14px;cursor:pointer;align-items:start}
.row:hover{background:var(--surface-2)}
.row.kurz{grid-template-columns:44px 30px minmax(0,1fr) auto;align-items:center;padding:8px 14px;gap:10px}
.row.kurz .silk img{width:26px;height:26px}
.row.kurz .name strong{font-size:16px}
.row.kurz .line2{margin-top:2px;font-size:12.5px;gap:2px 12px}
.kurz-r{display:flex;gap:6px;align-items:stretch}
.kurz-pw{display:grid;justify-items:center;align-content:center;border:1px solid var(--line);border-radius:4px;padding:2px 7px;min-width:50px;line-height:1.15;background:var(--surface)}
.kurz-pw i{font:600 9px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-style:normal}
.kurz-pw b{font:700 16px var(--f-mono)}
.kurz-pw small{font:500 10px var(--f-mono);color:var(--ink-3)}
.kurz-pw.up{background:var(--good-soft);border-color:transparent} .kurz-pw.up b{color:var(--good)}
.kurz-pw.down{background:var(--bad-soft);border-color:transparent} .kurz-pw.down b{color:var(--bad)}
.kurz-pw{position:relative}
.kurz-pw.val{box-shadow:0 0 0 2px var(--hi);border-color:transparent}
.kurz-pw.val.aus{box-shadow:none;border:2px dashed var(--hi)}   /* Value, aber keine Prognose-Cote bekannt */
.kurz-pw.warn{box-shadow:0 0 0 2px var(--bad);border-color:transparent}   /* Value-Warnsignal: unterstes Fünftel */
.fair-hw{position:absolute;top:-6px;right:-6px;width:15px;height:15px;border-radius:50%;display:grid;place-items:center;font:700 8px/1 var(--f-body);box-shadow:0 0 0 2px var(--surface)}
.fair-hw.plus{background:var(--hi);color:#fff}
.fair-hw.minus{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line)}
.kurz-fk{display:grid;justify-items:center;align-content:center;border:1px solid var(--line);border-radius:4px;padding:2px 7px;min-width:50px;line-height:1.15;background:var(--surface)}
.kurz-fk i{font:600 9px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-style:normal}
.kurz-fk b{font:700 15px var(--f-mono);padding:0 3px;border-radius:3px}
.kurz-fk small{font:500 10.5px var(--f-mono);color:var(--ink-3)}
.kurz-fk small span{padding:0 3px;border-radius:3px;color:var(--ink-2)}
.kurz-fk .fk-v{background:var(--good-soft);color:var(--good)}
.kurz-fk .fk-s{background:var(--good);color:var(--surface)}
.kurz-q{display:grid;justify-items:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:3px 8px;min-width:58px;line-height:1.15}
.kurz-q > b{font:700 17px var(--f-display)}
.kurz-q small{font:500 10.5px var(--f-mono)}
.cloth{width:40px;text-align:center}
.cloth b{display:block;background:var(--cloth);color:var(--cloth-ink);font:700 22px/34px var(--f-display);border-radius:3px}
.cloth small{display:block;font:500 11px/1.6 var(--f-mono);color:var(--ink-3)}
.who{min-width:0;display:grid;gap:2px}
.name{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.name strong{font:700 20px/1.05 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.form{font:500 12.5px var(--f-mono);color:var(--ink-2);letter-spacing:.02em}
.badge{font:600 10.5px/1 var(--f-body);padding:3px 5px;border-radius:2px;background:var(--hi-soft);color:var(--ink);letter-spacing:.04em}
.badge.bf{background:var(--bad-soft)}
.line2{font-size:12.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:2px 14px}
.line2 em{font-style:normal;color:var(--ink-3)}
/* feste Spalten, damit die Kacheln bei allen Pferden untereinander stehen: Gew., Rating, Tage, RTR, ARR, TR, Duell,
   ΔL600, ΔB200, Prognose (immer ganz rechts) */
.facts{display:grid;grid-template-columns:42px 84px 38px 70px 70px 56px 50px 62px 62px 86px;gap:2px 12px;text-align:right;align-items:start}
.facts > .oddsbox{grid-column:-2/-1;grid-row:1/span 2}
.fact i{display:block;font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.fact span{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.fact .odds{font-weight:500;color:var(--accent)}
.nr .row{opacity:.45}
.nr .name strong{text-decoration:line-through}

/* Detail */
.detail{padding:4px 14px 18px 106px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.detail>*,.panel{min-width:0}
.panels{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:16px}
.panel h4{margin:0 0 6px;font:600 13px/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
/* A/E-Tabelle: nur das gewählte Zeitfenster zeigen (Knöpfe 30/90/365 T) */
.ae-tab .aew{display:none}
.ae-tab[data-w="30"] .aew-30,.ae-tab[data-w="90"] .aew-90,.ae-tab[data-w="365"] .aew-365{display:table-cell}
.ae-w{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.ae-w-btn{padding:1px 7px;font:500 11px var(--f-mono);letter-spacing:0;text-transform:none}
.ae-w-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%}
th,td{padding:4px 6px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);font-size:12.5px}
th{font-weight:600;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
td.r,th.r{text-align:right}
.ae{font-family:var(--f-mono);font-variant-numeric:tabular-nums;padding:1px 5px;border-radius:2px}
.ae.best{box-shadow:0 0 0 2px #C9A227;opacity:1}   /* beste Kategorie der Person/Linie */
.ae.up{background:var(--good-soft);color:var(--good)}
.ae.down{background:var(--bad-soft);color:var(--bad)}
.ae.thin,.metric.thin span{opacity:.55}
.pref{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.pref .grp b{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.pref .it{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:2px 0;border-bottom:1px dotted var(--line)}
.pref .it span:first-child{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pref .it span:last-child{font-family:var(--f-mono);white-space:nowrap}
.scroll{overflow-x:auto}
.formtab{min-width:900px}
.formtab td{padding:6px}
.fl-date{font-weight:600;white-space:nowrap}
.formtab td.fl-date .riv-btn{display:table;margin-top:3px;white-space:normal;text-align:left;max-width:170px}   /* Gegner-Knöpfe untereinander, Spalte bleibt schmal */
.fl-cond > span,.fl-cond > mark{white-space:nowrap}
.fl-gbq > span{white-space:nowrap}
.fl-pos b{font:700 16px var(--f-display)}
.adj{font-size:11px;margin-left:4px}
.adj.up{color:var(--good)} .adj.down{color:var(--bad)}
.formtab td span.up{color:var(--good)} .formtab td span.down{color:var(--bad)}
svg text{fill:var(--ink-3);font:10px var(--f-mono)}
.legend{font-size:12px;color:var(--ink-2);display:grid;gap:4px;padding:14px;background:var(--surface-2);border-radius:4px;margin-top:18px}
.legend b{color:var(--ink)}
.legend-box{margin-top:18px;background:var(--surface-2);border-radius:4px}
.legend-box > summary{cursor:pointer;padding:10px 14px;font-size:13px;list-style:none;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.legend-box > summary::-webkit-details-marker{display:none}
.legend-box > summary::before{content:"▸";color:var(--ink-3);transition:transform .15s}
.legend-box[open] > summary::before{transform:rotate(90deg)}
.legend-box > summary small{color:var(--ink-3)}
.legend-box .legend{margin-top:0;padding-top:4px}
.leg-filter{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 6px;align-items:center}
.leg-filter button{font:500 12px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 10px;cursor:pointer}
.leg-filter button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.leg-filter input{font:13px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:4px 8px;min-width:0;flex:1 1 160px;max-width:260px}
.legend > div[hidden]{display:none}
.legend .leg-leer{color:var(--ink-3);font-style:italic}
.empty{padding:24px;text-align:center;color:var(--ink-2)}


.silk img{display:block;width:34px;height:34px;object-fit:contain}
.nosilk{display:block;width:34px;height:34px;border:1px dashed var(--line);border-radius:50% 50% 4px 4px}
.changes{display:flex;flex-wrap:wrap;gap:4px}
.badge.chg{background:var(--surface-2);border:1px solid var(--hi);font-weight:500}
.form{display:flex;flex-wrap:wrap;gap:2px 0}
.trend{margin-left:3px;font-size:13px;line-height:1}
.metric{display:grid;justify-items:end}
.metric i{font-style:normal;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.metric span{font:500 14px var(--f-mono)}
.metric span.up{color:var(--good)} .metric span.down{color:var(--bad)}
.metric small{font:10.5px var(--f-mono);color:var(--ink-3)}
.metric em.sd, .fact em.sd{font:9.5px var(--f-mono);color:var(--ink-3);margin-left:2px;font-style:normal}
.metric.rt span{font-weight:600;color:var(--accent)}
.rt-cell b{font:600 14px var(--f-mono)}
.rt-cell small{display:block;font:10.5px var(--f-mono);color:var(--ink-3)}
.rt-cell small.up{color:var(--good)} .rt-cell small.down{color:var(--bad)}
.rt-cell.cap b{color:var(--ink-3);font-style:italic}
.oddsbox{display:grid;justify-items:center;align-content:center;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:4px 10px;min-width:58px}
.oddsbox i{font-style:normal;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.oddsbox b{font:700 22px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.panels.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panels.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.panels.one{grid-template-columns:minmax(0,1fr)}
.panels.ae{grid-template-columns:minmax(0,1fr)}
.panels.ae table{width:auto;min-width:60%}
.panels.one .pref{grid-template-columns:repeat(4,minmax(0,1fr))}
.riv-btn.up{border-color:var(--good);color:var(--good)} .riv-btn.down{border-color:var(--bad);color:var(--bad)}
.duels td .up{color:var(--good)} .duels td .down{color:var(--bad)}
.cls{font-size:11px}
.fact small{display:block;font:10.5px var(--f-mono);color:var(--ink-3);white-space:nowrap}
.fact span.lvl,.metric.rt span.lvl{padding:0 4px}
.metric.rt span.lvl.up{color:var(--good)} .metric.rt span.lvl.down{color:var(--bad)}
.rt-cell b.lvl{padding:0 3px}
td .hl-up{color:var(--good);font-weight:600} td .hl-down{color:var(--bad);font-weight:600}
.panels.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.formtab tr.hascmt td{border-bottom:0}
.formtab tr.cmt td{padding:0 6px 8px;font-size:12px;color:var(--ink-2)}
.cmt-t{display:flex;gap:6px;align-items:baseline}
.cmt-t b{font:600 10px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.cmt-t .fr{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:0 3px}
.cmt-t .race{color:var(--ink-3)}
.prono{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--hi);border-radius:4px;padding:10px 14px;margin-bottom:12px;display:grid;gap:6px}
details.fold{margin-bottom:12px}
details.fold>summary{display:flex;align-items:baseline;gap:10px;cursor:pointer;list-style:none;padding:2px 0}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";font-size:12px;color:var(--ink-3);width:10px}
details.fold[open]>summary::before{content:"▾"}
details.fold>summary h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.fold-kurz{font-size:12.5px;color:var(--ink-2)}
details.insight-fold{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 14px}
details.insight-fold[open]{padding-bottom:12px}
details.insight-fold .insight{margin:8px 0 0}
details.prono:not([open]){gap:0}
.prono h3{margin:0;font:600 12px/1.2 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.prono p{margin:0;font-size:13.5px;line-height:1.5}
.prono .fr,.crible .fr{font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:2px;padding:0 3px;margin-left:4px}
.prono .sel b{font-family:var(--f-mono)}
.badge.pr{background:var(--surface-2);border:1px solid var(--hi);font-family:var(--f-mono)}
/* PMU-Kurzkommentar: ganz unten in der Starterzeile, über die volle Breite */
.crible{grid-column:1/-1;display:flex;gap:8px;align-items:baseline;font-size:13px;font-style:italic;line-height:1.45;
  color:var(--ink);background:var(--hi-soft);border-left:3px solid var(--hi);border-radius:3px;padding:6px 10px;margin-top:2px}
.crible b{font:600 10px var(--f-body);font-style:normal;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);flex:none}
.oddsbox small.pr{opacity:.9}
.boxdev{display:block;font:500 10px/1.3 var(--f-mono);color:var(--ink-3)}

<script>
const DATA = /*__DATA__*/null;

const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fx = (v, d=1) => v == null ? "–" : Number(v).toFixed(d);
const sgn = (v, d=2) => v == null ? "" : (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(d);
// Großbuchstabe am Wortanfang – auch nach Punkt (M.GRANDIN -> M.Grandin), Apostroph, Klammer, Schrägstrich
const title = s => s ? String(s).toLowerCase().replace(/(^|[\s\-'’.(/])(\p{L})/gu, (m,a,b) => a + b.toUpperCase()) : "";
// Link zur Rennseite bei PMU: race_id JJJJMMTTRxCy -> pmu.fr/turf/TTMMJJJJ/rx/cy/
const pmuUrl = rid => { const m = /^(\d{4})(\d{2})(\d{2})R(\d+)C(\d+)$/.exec(rid || ""); return m ? `https://www.pmu.fr/turf/${m[3]}${m[2]}${m[1]}/r${m[4]}/c${m[5]}/` : null; };
const pmuLink = (rid, text = "▶ PMU") => { const u = pmuUrl(rid); return u ? `<a class="pmu-link" href="${u}" target="_blank" rel="noopener" title="Rennseite bei PMU (neuer Tab)" onclick="event.stopPropagation()">${text}</a>` : ""; };
const dt = s => { if (!s) return "–"; const [y,m,d] = s.split("-"); return `${+d} ${MON[+m-1]} ${y}`; };
const prize = v => v == null ? "–" : v >= 1e6 ? (v/1e6).toFixed(1).replace(/\.0$/,"") + "m" : Math.round(v/1000) + "k";
const pct = (w, r) => r ? Math.round(100*w/r) + "%" : "–";
function lengths(v){
  if (v == null) return "";
  if (v >= 30) return "dist";
  if (v <= 0) return "dh";
  if (v < 0.08) return "nse";
  if (v < 0.15) return "shd";
  if (v < 0.23) return "hd";
  if (v < 0.4) return "nk";
  const w = Math.floor(v + 1e-9), f = v - w;
  const fr = f < 0.125 ? "" : f < 0.375 ? "¼" : f < 0.625 ? "½" : f < 0.875 ? "¾" : "";
  const whole = f >= 0.875 ? w + 1 : w;
  return (whole ? whole : "") + fr + "l";
}
const INC = {DISQUALIFIE:"DSQ", ARRETE:"PU", TOMBE:"F", NON_PLACE:"", RESTE_AU_POTEAU:"RR", DEROBE:"RO", ARRETE_AVANT:"PU"};

// Starterzeile bleibt zwischen Neuladen erhalten
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let state = {meeting:null, race:null, sort:"no", mid:new Set(), open:new Set(),   // Stufe je Starter: kurz → mid (Zeile) → open (Details)
             rivals:new Set(), duels:new Set(),
             fold:{prono:false, pace:false}, aeW:"30"};   // ausklappbare Kästen oberhalb der Starter, Vorgabe: eingeklappt

function init(){
  if (!DATA || !DATA.meetings || !DATA.meetings.length){
    $("#race").innerHTML = `<p class="empty">Keine Rennen in den Daten.</p>`; return;
  }
  $("#hd-date").textContent = dt(DATA.date);
  const h = DATA.history || {};

// Power: sechs Leistungs-Kennzahlen zu einem Wert – je Kennzahl z-Wert im heutigen Feld, gedämpft nach der Zahl der
// Läufe dahinter (× n / (n + 2)), Median der vorhandenen (ab 3), Power = 100 + 10 × Median (100 = Feldschnitt)
const POWER_KPI = [
  ["Rating", x => x.rating_adj ?? x.rating, () => null],
  ["RTR", x => x.rtr && x.rtr.adj, x => x.rtr && x.rtr.runs],
  ["ARR", x => x.arr && x.arr.adj, x => x.arr && x.arr.runs],
  ["TR", x => x.tr && (x.tr.heute ?? x.tr.avg), x => x.tr && x.tr.runs],
  ["Duell", x => x.duel_rank && x.duel_rank.groups === 1 ? x.duel_rank.score_l : null, x => x.duel_rank && (x.duel_rank.n_direct + x.duel_rank.n_indirect)],
  ["Tempo", x => { const v = [x.summary.dl600_a, x.summary.db200_a].filter(w => w != null); return v.length ? v.reduce((s, w) => s + w, 0) / v.length : null; }, x => x.summary.runs]];
function powerFeld(race){
  const feld = race.runners.filter(x => !x.nr);
  if (feld.some(x => x.power)) {                       // Power-Modell (racecard.run mit power_modell): ersetzt die Kennzahlen-Rechnung
    for (const x of race.runners) x._power = x.power && !x.nr ? {p: x.power.p, ml: true, treiber: x.power.treiber || [], pred: x.power.pred, sieg: x.power.sieg, wert: x.power.wert, gold: x.power.gold, warn: x.power.warn} : null;
    const mitP = feld.filter(x => x._power).sort((a, b) => b._power.p - a._power.p);
    mitP.forEach(x => { x._power.rank = 1 + mitP.filter(y => y._power.p > x._power.p).length; x._power.n = mitP.length; });
    // Cote der PMU-Prognose ohne Marge (je Rennen auf 100 % normiert) – vergleichbar mit der fairen Quote des Modells
    const cotes = feld.map(x => [x, x.prono && x.prono.sel && x.prono.sel.cote_dec]).filter(([, c]) => c > 1);
    const marge = cotes.reduce((s, [, c]) => s + 1 / c, 0);
    if (cotes.length >= 2) for (const [x, c] of cotes) if (x._power) { x._power.cote_fair = c * marge; x._power.marge = marge; }
    return;
  }
  const teile = new Map(feld.map(x => [x.no, []]));
  for (const [name, wert, anzahl] of POWER_KPI) {
    const mit = feld.map(x => [x, wert(x)]).filter(([, v]) => v != null && Number.isFinite(v));
    if (mit.length < 3) continue;
    const m = mit.reduce((s, [, v]) => s + v, 0) / mit.length, sd = Math.sqrt(mit.reduce((s, [, v]) => s + (v - m) ** 2, 0) / mit.length);
    if (!sd) continue;
    for (const [x, v] of mit) { const n = anzahl(x), f = n == null ? 1 : n / (n + 2); teile.get(x.no).push([name, (v - m) / sd * f]); }
  }
  for (const x of race.runners) {
    const tz = teile.get(x.no) || [];
    if (tz.length < 3) { x._power = null; continue; }
    const z = tz.map(([, v]) => v).sort((a, b) => a - b), k = z.length;
    x._power = {p: Math.round(100 + 10 * (k % 2 ? z[(k - 1) / 2] : (z[k / 2 - 1] + z[k / 2]) / 2)), teile: tz};
  }
  const mitP = feld.filter(x => x._power).sort((a, b) => b._power.p - a._power.p);
  mitP.forEach(x => { x._power.rank = 1 + mitP.filter(y => y._power.p > x._power.p).length; x._power.n = mitP.length; });
}
function powerHTML(x){
  const P = x._power;
  if (!P) return `<div class="kurz-pw" title="Power: zu wenige Kennzahlen (mindestens 3 von 6)"><i>Power</i><b>–</b></div>`;
  const tip = P.ml
    ? `Power ${P.p}${P.sieg != null ? ` · Siegchance ${fx(100 * P.sieg, 0)} % (faire Quote ${fx(1 / Math.max(P.sieg, 0.001), 1)})` : ''} aus dem Power-Modell (LightGBM, ${P.pred != null ? `vorhergesagtes (Starter − Platz) / (Starter − 1) ${fx(100 * P.pred, 0)} %` : 'gelernte Reihenfolge im Rennen'}; 100 = Feldschnitt, ±10 je Standardabweichung im Feld; grün ab 105, rot bis 95) – stärkste Treiber: `
      + P.treiber.map(([n, v]) => `${n} ${v >= 0 ? "+" : "−"}${fx(Math.abs(v), 1)}`).join(" · ") + " (Prozentpunkte von (Starter − Platz) / (Starter − 1), gegenüber dem Ø des heutigen Feldes)"
    : `Power ${P.p} (100 = Feldschnitt, ±10 je Standardabweichung; grün ab 105, rot bis 95) – Median aus ${P.teile.length} Kennzahlen, je z-Wert im heutigen Feld, gedämpft nach der Zahl der Läufe: `
      + P.teile.map(([n, v]) => `${n} ${v >= 0 ? "+" : "−"}${fx(Math.abs(v), 1)}`).join(" · ");
  return `<div class="kurz-pw ${P.p >= 105 ? "up" : P.p <= 95 ? "down" : ""}" title="${esc(tip)}"><i>Power</i><b>${P.p}</b><small>#${P.rank}/${P.n}</small></div>`;
}
const SORTS = {
  no:    ["Startnummer", r => r.no ?? 99, 1],
  power: ["Power / faire Quote", r => (r._power && r._power.p) ?? -999, -1],
  odds:  ["Prognose (cote probable)", r => (r.prono && r.prono.sel && r.prono.sel.cote_dec) ?? 999, 1],
  tr:    ["TR (Ø, heutiges Gewicht)", r => r.tr.heute ?? -999, -1],
  dl600a:["ΔL600 A (Ø)", r => r.summary.dl600_a ?? -99, -1],
  db200a:["ΔB200 A (Ø)", r => r.summary.db200_a ?? -99, -1],
  tae:   ["Trainer A/E Platz 365 T", r => r.ae.trainer.d365.ae ?? -1, -1],
  jae:   ["Jockey A/E Platz 365 T", r => r.ae.jockey.d365.ae ?? -1, -1],
  rating:["Rating", r => r.rating ?? -1, -1],
  rtr:   ["RTR bereinigt (heutiges Gewicht)", r => r.rtr.adj ?? -99, -1],
  arr:   ["ARR bereinigt (Ø, heutiges Gewicht)", r => r.arr.adj ?? -99, -1],
  style: ["Laufstil (vorne zuerst)", r => r.early ?? 9, 1],
};

// Einordnung im heutigen Feld bzw. unter allen früheren Läufen der heutigen Starter:
// oberes Drittel -> up, unteres Drittel -> down (bei "niedrig ist gut" umgekehrt)
let FELD = {}, POOL = {};
function drittel(werte, v, hochGut = true){
  if (v == null) return "";
  const w = werte.filter(x => x != null);
  if (w.length < 3) return "";
  const unter = w.filter(x => x < v).length, gleich = w.filter(x => x === v).length - 1;
  const p = (unter + gleich / 2) / (w.length - 1);
  const c = p >= 2/3 ? "up" : p <= 1/3 ? "down" : "";
  return hochGut ? c : (c === "up" ? "down" : c === "down" ? "up" : "");
}
const feldCls = (k, v, hochGut = true) => drittel(FELD[k] || [], v, hochGut);
const poolCls = (k, v) => drittel(POOL[k] || [], v);
function pools(r){
  const P = r.runners.filter(x => !x.nr);
  FELD = {rating: P.map(x => x.rating_adj ?? x.rating),days: P.map(x => x.days), rtr: P.map(x => x.rtr.adj ?? x.rtr.raw),
          arr: P.map(x => x.arr.adj ?? x.arr.avg), tr: P.map(x => x.tr.heute ?? x.tr.avg)};
  const L = P.flatMap(x => x.form_lines);
  POOL = {arr: L.map(f => f.arr_adj ?? f.arr), tr: L.map(f => f.tr_heute ?? f.tr), val: L.map(f => f.cls_val_idx),
          epr: L.map(f => f.cls_epr_idx), prize: L.map(f => f.prize)};
}

function insightHTML(r){
  const P = r.pace, B = r.bias, A = DATA.bias_all;
  const styles = DATA.params.styles;
  const grid = styles.map(st => { const nos = (P && P.groups[st.key]) || [];

  if (P && P.expected != null){
    const txt = {schnell:"Schnelles Tempo erwartet", langsam:"Langsames Tempo – Sprintfinish", normal:"Normales Tempo erwartet"}[P.label];
    verdict = `<div class="verdict ${P.label}">${txt}<small>Pace ≈ ${fx(P.expected,1)}</small></div>

      <div class="note">Norm dieser Distanzgruppe ${fx(P.norm,1)} · ${P.n_front} Tempomacher (früh im vorderen ${Math.round(DATA.params.pacemaker*100)} %): ${sgn(P.part_front,1)} · ${P.runners} Starter: ${sgn(P.part_field,1)} (gegenüber ${DATA.params.field_ref} Startern) · Modell aus ${P.basis.toLocaleString("de-DE")} Rennen: ${sgn(P.coef.front,2)} je Tempomacher, ${sgn(P.coef.field,2)} je Starter.</div>`;

function aeChip(s, minRuns=10){
  if (!s || !s.runs) return `<span class="muted">–</span>`;
  const cls = s.ae == null ? "" : s.ae >= 1.1 ? "up" : s.ae <= 0.9 ? "down" : "";

  return `<span class="ae ${cls} ${s.runs < minRuns ? "thin" : ""}" title="${esc(tip)}">${s.ae == null ? "–" : s.ae.toFixed(2)}</span>`;
}
// Vorliebe weicht deutlich und signifikant vom Rest derselben Person/Linie ab (wie das Box-Urteil): ▲ / ▼
function aeDev(s, wer){
  const D = s && s.dev;
  if (!D || !D.sig) return "";
  const t = `A/E ${fx(s.ae,2)} gegenüber ${fx(D.base,2)} sonst ${wer || ""} (×${fx(D.ratio,2)}, ${fx(Math.abs(D.z),1)} Standardfehler, Vergleich mit ${D.rest} übrigen Läufen) – deutlich und signifikant ${D.dir > 0 ? "besser" : "schlechter"}`;
  return ` <span class="lvl ${D.dir > 0 ? "up" : "down"} aedev" title="${esc(t)}" aria-label="${esc(t)}">${D.dir > 0 ? "▲" : "▼"}</span>`;
}
function trendIcon(a){
  if (!a.trend) return "";
  const k = a.d30, l = a.d365;
  const t = `Letzte 30 Tage: ${k.places} Plätze aus ${k.runs} Starts, A/E Platz ${fx(k.ae,2)} gegenüber ${fx(l.ae,2)} (365 Tage)`;
  return a.trend === "hot" ? `<span class="trend" title="${t}" aria-label="${t}">🔥</span>` : `<span class="trend" title="${t}" aria-label="${t}">🧊</span>`;
}
// Einordnung: Perzentil gegenüber allen früheren Rennen (Klasse), Verhältnis zum Vergleichswert (€/Lauf)
const relCls = r => r == null ? "" : r >= 1.25 ? "up" : r <= 0.8 ? "down" : "";
// Farbverlauf rot -> neutral -> grün nach der Lage eines Werts unter allen früheren Läufen der heutigen Starter
function poolLage(k, v){
  const w = (POOL[k] || []).filter(x => x != null);
  if (v == null || w.length < 3) return null;
  const unter = w.filter(x => x < v).length, gleich = w.filter(x => x === v).length - 1;
  return (unter + gleich / 2) / (w.length - 1);               // 0 = niedrigster, 1 = höchster Wert im Rennen
}
function verlauf(p){
  if (p == null) return "";
  const t = Math.round(Math.abs(p - 0.5) * 200);            // 0 … 100 % Stärke der Farbe
  const farbe = p >= 0.5 ? "var(--good)" : "var(--bad)", grund = p >= 0.5 ? "var(--good-soft)" : "var(--bad-soft)";
  return `background:color-mix(in srgb, ${grund} ${t}%, transparent);color:color-mix(in srgb, ${farbe} ${Math.max(t, 35)}%, var(--ink))`;
}

function stufeStil(p){
  if (p == null) return "";

  if (p >= 0.75) return "background:var(--good-soft);color:var(--good);font-weight:700";

}

// Power-Modell als Quote: faire Quote aus der Siegchance (Softmax über das Feld, auf der Validierung geeicht).
// Ersetzt die Power-Zahl in der Kurzzeile; Farbe wie Power: grün = klar über dem Feldschnitt, rot = klar darunter.
const FAIR_WERT = 1.3;
const COTE_MAX = 31;        // ▲/▼ nur bis Prognose-Cote 30/1 – darüber sagt die Prognose zu wenig
const VALUE_AB = 1.2;       // Value-Modell ohne gespeicherte Grenze: ab diesem Faktor goldener Rahmen
const GOLD_COTE_MAX = 10;   // goldener Rahmen nur bis Prognose-Cote 10/1 – darüber verlor die Auswahl im Test klar
function powerQuote(x){
  const P = x._power;
  const q = 1 / Math.max(P.sieg, 0.001);
  const cote = x.prono && x.prono.sel && x.prono.sel.cote_dec;
  const cf = P.cote_fair;                    // Prognose-Cote ohne Marge
  const v = cf && cote <= COTE_MAX ? cf / q : null;   // > 1: Prognose sieht das Pferd schwächer als das Modell
  const hinweis = v == null ? "" : v >= FAIR_WERT
    ? `<span class="fair-hw plus" title="${esc(`Cote der PMU-Prognose ${fx(cote, 1)} (ohne Marge ${fx(cf, 1)}) liegt ${fx(100 * (v - 1), 0)} % über der fairen Quote ${fx(q, 1)} – das Modell sieht das Pferd stärker als die Prognose`)}">▲</span>`
    : v <= 1 / FAIR_WERT
    ? `<span class="fair-hw minus" title="${esc(`Cote der PMU-Prognose ${fx(cote, 1)} (ohne Marge ${fx(cf, 1)}) liegt ${fx(100 * (1 - v), 0)} % unter der fairen Quote ${fx(q, 1)} – das Modell sieht das Pferd schwächer als die Prognose`)}">▼</span>`
    : "";
  const oben = P.gold != null ? P.gold : P.wert != null && P.wert >= VALUE_AB;   // oberste 10 % des Value-Faktors
  const val = oben && (cote == null || cote <= GOLD_COTE_MAX);   // über Cote 10: kein Rahmen
  const warn = !!P.warn;                                          // unterstes Fünftel: Markt überschätzt das Pferd
  const tip = `Faire Quote ${fx(q, 2)} = Siegchance ${fx(100 * P.sieg, 1)} % laut Power-Modell (ohne Buchmacher-Marge), `
    + `#${P.rank} von ${P.n} im Feld. Grün: Modell sieht das Pferd klar über dem Feldschnitt (Power ${P.p} ≥ 105), rot: klar darunter (≤ 95). `
    + `Liegt die angebotene Quote deutlich über der fairen (Marge des Anbieters bedenken), schätzt das Modell das Pferd stärker ein als der Markt. – stärkste Treiber: `
    + P.treiber.map(([n, v]) => `${n} ${v >= 0 ? "+" : "−"}${fx(Math.abs(v), 1)}`).join(" · ")
    + (P.wert != null ? ` – Value-Faktor ×${fx(P.wert, 2)}: laut Value-Modell kommt das Pferd ${P.wert >= 1 ? "öfter" : "seltener"} ins Geld (Platz bzw. Sieg + Platz), als seine Quote erwarten lässt (geeicht auf die Validierung ≈ tatsächliche A/E)` : "")
    + (warn ? ` – roter Rahmen: unterstes Fünftel des Value-Faktors – der Markt überschätzt solche Pferde klar (im Test A/E ≈ 0,7, das verlässlichste Value-Signal)` : "")
    + (val ? ` – goldener Rahmen: oberste 10 % des Value-Faktors bei Prognose-Cote bis ${GOLD_COTE_MAX}${cote == null ? " (Cote unbekannt: gestrichelt)" : ""}; im Test zur PMU-Endquote etwa ausgeglichen, am ehesten zum Festkurs` : "")
    + (oben && !val ? ` – oberste 10 % des Value-Faktors, aber Prognose-Cote ${fx(cote, 1)} über ${GOLD_COTE_MAX}: dort verlor die Auswahl im Test klar (Außenseiter überwettet) – kein Rahmen` : "");
  return `<div class="kurz-pw ${P.p >= 105 ? "up" : P.p <= 95 ? "down" : ""}${val ? (cote == null ? " val aus" : " val") : warn ? " warn" : ""}" title="${esc(tip)}">${hinweis}<i>Fair</i><b>${q >= 100 ? "100+" : fx(q, q < 10 ? 1 : 0)}</b><small>${fx(100 * P.sieg, 0)} % · #${P.rank}</small></div>`;
}
// Wettstar: Festkurs Sieg mit Value gegen das Modell (Erwartungswert je 1 € = Kurs × Modell-Siegchance), darunter der
// aktuelle Toto-Kurs; ohne Festkurs nur der Toto-Kurs (Value dann am Toto)
const FK_VALUE = 1.2, FK_STARK = 1.5;      // ab +20 % grün, ab +50 % kräftig
function kurzFK(x){
  const F = x.fk;
  if (!F || (F.sieg == null && F.toto == null)) return "";
  const P = x._power, haupt = F.sieg != null ? F.sieg : F.toto, art = F.sieg != null ? "Festkurs" : "Toto";
  const ev = P && P.sieg && haupt ? haupt * P.sieg : null;
  const cls = ev == null ? "" : ev >= FK_STARK ? "fk-s" : ev >= FK_VALUE ? "fk-v" : "";
  const tip = `Wettstar${F.name ? ` (${F.name})` : ""} – ${F.sieg != null ? `Festkurs Sieg ${fx(F.sieg, 1)}` : "noch kein Festkurs"}`
    + (F.toto != null ? ` · Toto ${fx(F.toto, 1)} (Stand beim Erstellen der Karte)` : "")
    + (ev != null ? `\n${art} × Modell-Siegchance ${fx(100 * P.sieg, 0)} % → Erwartungswert ${ev >= 1 ? "+" : "−"}${fx(Math.abs(100 * (ev - 1)), 0)} % je 1 €${ev >= FK_VALUE ? " (Value gegen das Modell)" : ""}` : "")
    + `\nGrün: Kurs × Modell-Siegchance ≥ ${FK_VALUE} (kräftig ab ${FK_STARK}) – das Modell sieht das Pferd stärker, als der Kurs bezahlt`;
  const zahl = v => fx(v, v < 10 ? 1 : 0);
  return `<div class="kurz-fk" title="${esc(tip)}"><i>${F.sieg != null ? "FK" : "Toto"}</i><b class="${cls}">${zahl(haupt)}</b>${F.sieg != null && F.toto != null ? `<small>Toto ${zahl(F.toto)}</small>` : ""}</div>`;
}
// PMU-Prognose kompakt: cote probable und Tipp-Konsens
function kurzQuote(x){
  const S = x.prono && x.prono.sel, K = x.prono && x.prono.konsens;

  return `<div class="kurz-q" title="${esc(tip)}"><b>${S && S.cote ? esc(S.cote) : "–"}</b><small>Tipp ${K ? `<b>${K.pos}.</b>/${K.of}` : "–"}</small></div>`;

// Scheuklappen: klassisch = geschlossene Klappe, australisch = Fellklappe (gestrichelt)

    `<tr><td title="${esc(l + (n ? " " + title(n) : ""))}">${kz ? `<span class="muted">${kz}</span> ${esc(title(n) || l)}` : `${l}${n ? ` <span class="muted ped-n">${esc(title(n))}</span>` : ""}`}</td><td class="r num" title="${esc(`${s.horses3 ?? 0} davon mit Läufen als 3-Jährige · ${rec(s)} Siege-Starts, ${s.places} Plätze`)}">${s.horses || "–"}</td><td class="r">${aeChip(s)}</td><td class="r">${idxHTML(s.pos_idx, "Ø aller Läufe", `Pos+ ${l}: Ø (Starter − Platz) / (Starter − 1) der Nachkommen, nicht im Ziel = 0, als Index`, s.runs || null)}</td><td class="r">${idxHTML(s.epr_idx, pop[rolle + "_all"] != null ? "€" + fmtEur(pop[rolle + "_all"]) + " je Lauf" : null, `€/L+ ${l} (€${s.epr != null ? fmtEur(s.epr) : "–"} je Lauf)`, s.runs || null)}</td><td class="r">${idxHTML(s.max_val3_idx, pop[rolle + "_val3"] != null ? "Ø max Val 3j " + fx(pop[rolle + "_val3"],1) : null, `max Val+ ${l} (Ø max Val 3j ${s.max_val3 != null ? fx(s.max_val3,1) : "–"})`, s.horses3 || null, 3, "3-jährigen Nachkommen")}</td></tr>`).join("");
  const P = x.pref;
  const PR = x.pref_ref || {};
  const gold = (ref, chip) => ref && bestKat(((DATA.pref_alle || {})[ref[0]] || {})[ref[1]]) === ref[2] ? chip.replace('class="ae ', 'class="ae best ') : chip;
  const it = (label, s, wer, ref) => `<div class="it${ref && DATA.pref_alle ? " pv-c" : ""}"${ref && DATA.pref_alle ? ` data-pv="${esc(ref.join("|") + "|" + x.no)}" role="button" tabindex="0" title="Klick: alle Vergleiche"` : ""}><span title="${esc(label)}">${esc(label)}</span><span>${rec(s)} ${gold(ref, aeChip(s, 5))}${aeDev(s, wer)}</span></div>`;
  const jahre = DATA.params.pref_jt_years;
  const K = x.career.all, K1 = x.career.d365;
  const kTxt = k => k.runs ? `${k.runs}-${k.wins}-${k.places} · €${prize(k.earn)} · <span class="lvl ${relCls(k.rel)}" title="${k.rel != null ? `${fx(k.rel,2)} × Median des heutigen Feldes (grün ab 1,25, rot bis 0,8)` : ""}">€${fmtEur(k.epr ?? 0)}/Lauf</span>${k.rank ? ` <span class="muted">#${k.rank}/${k.n}</span>` : ""}` : "keine Läufe";
  const dk = `${x.no}|duels`, dOffen = state.duels.has(dk);
  return `<div class="detail">
    <div class="line2"><span title="Läufe-Siege-Plätze (1.–2. bis 7 Starter, sonst 1.–3.) · Preisgeld · Gewinn je Lauf aus der PMU-Historie, Rang im heutigen Feld"><em>Karriere</em> ${kTxt(K)}</span><span><em>${DATA.params.class_days} Tage</em> ${kTxt(K1)}</span><span><em>Besitzer</em> ${esc(title(x.owner) || "–")}</span>${x.breeder ? `<span><em>Züchter</em> ${esc(title(x.breeder))}</span>` : ""}${x.style ? `<span><em>Laufstil</em> ${esc(x.style_label)} · früh Ø ${fx(x.early*100,0)} % des Feldes (${x.early_runs} Läufe)</span>` : ""}</div>
    <div class="panels ae">
      <div class="panel"><h4>A/E · Siege/Starts <span class="ae-w" role="group" aria-label="Zeitraum">${w.map(t => `<button type="button" class="btn ae-w-btn" data-aew="${t}" aria-pressed="${String(state.aeW) === String(t)}">${t} T</button>`).join("")}</span></h4>
        <div class="scroll"><table class="ae-tab" data-w="${state.aeW}"><thead><tr><th></th>${w.map(t => `<th class="r aew aew-${t}">${t} Tage</th><th class="r aew aew-${t}">A/E</th><th class="r aew aew-${t}" title="Pos+: Ø (Starter − Platz) / (Starter − 1) als Index – 100 = Ø aller Läufe im selben Zeitraum; grün ab 110, rot bis 90">Pos+</th><th class="r aew aew-${t}" title="€/L+: Gewinn je Lauf als Index – 100 = Ø aller Personen dieser Gruppe im selben Zeitraum (ab ${DATA.params.pop_min_runs} Läufen); grün ab 110, rot bis 90">€/L+</th>`).join("")}</tr></thead><tbody>${aeRows}</tbody></table></div>
      </div>
      <div class="panel"><h4>Abstammung · gesamte Historie</h4>
        <div class="scroll"><table><thead><tr><th></th><th class="r" title="Verschiedene Pferde mit dieser Abstammung in der Historie">Pferde</th><th class="r" title="A/E Platz der Nachkommen (Siege, Starts und Plätze im Tooltip)">A/E</th><th class="r" title="Pos+: Ø (Starter − Platz) / (Starter − 1) der Nachkommen als Index – 100 = Ø aller Läufe; grün ab 110, rot bis 90">Pos+</th><th class="r" title="€/L+: Gewinn je Lauf der Nachkommen als Index – 100 = Ø aller Linien (ab ${DATA.params.pop_min_runs} Läufen); grün ab 110, rot bis 90">€/L+</th><th class="r" title="max Val+: Ø der höchsten Valeur der Nachkommen als 3-Jährige als Index – 100 = Ø aller Linien (ab ${DATA.params.pop_min_horses} 3-jährigen Nachkommen); grün ab 110, rot bis 90">max Val+</th></tr></thead><tbody>${pedRows}</tbody></table></div>
      </div>
    </div>
    <div class="panels one">
      <div class="panel"><h4>Vorlieben · Trainer, Jockey (${jahre} Jahre) · Jockey auf dem Pferd · Abstammung (gesamt)</h4><div class="pref">
        <div class="grp"><b>Trainer${x.trainer ? ` · ${esc(title(x.trainer))}` : ""}</b>${it("mit " + (title(x.jockey) || "–"), P.trainer.jockey, "beim Trainer", (PR.trainer || {}).jockey)}${it("in " + title(race.course), P.trainer.course, "beim Trainer", (PR.trainer || {}).course)}${it("Typ: " + (race.type || "–"), P.trainer.racetype, "beim Trainer", (PR.trainer || {}).racetype)}${it("Alter: " + (P.trainer.age_label || "unbekannt"), P.trainer.age, "beim Trainer", (PR.trainer || {}).age)}</div>
        <div class="grp"><b>Jockey${x.jockey ? ` · ${esc(title(x.jockey))}` : ""}</b>${it("in " + title(race.course), P.jockey.course, "beim Jockey", (PR.jockey || {}).course)}${it("für " + (title(x.trainer) || "–"), P.jockey.trainer, "beim Jockey", (PR.jockey || {}).trainer)}${it("auf " + (title(x.horse) || "–"), P.jockey.horse, "beim Jockey (Läufe auf dem Pferd aus der ganzen Historie, Jockey sonst: 2 Jahre)", (PR.jockey || {}).horse)}</div>
        ${abstHTML(x)}
      </div></div>
    </div>
    <div class="panels four">
      <div class="panel"><h4>Pferd nach Boden (gesamt)</h4>${prefTable(P.horse.going, "Boden")}</div>
      <div class="panel"><h4>Pferd nach Distanz (gesamt)</h4>${prefTable(P.horse.distance, "Distanz")}</div>
      <div class="panel"><h4>Pferd auf dieser Bahn (gesamt)</h4>${P.horse.course.length ? prefTable(P.horse.course, "Kurs") : `<p class="muted">Noch nicht auf ${esc(title(race.course))} gelaufen.</p>`}</div>
      <div class="panel"><h4>Pferd nach Scheuklappen (gesamt)</h4>${prefTable(P.horse.blinkers, "Scheuklappen")}</div>
      <div class="panel"><h4>Pferd nach Trainer (gesamt)</h4>${trainerTable(P.horse.trainer)}</div>
    </div>
    <div class="panel"><h4>Heutige Gegner · frühere Duelle (letzte ${DATA.params.duel_days} Tage, ±${DATA.params.duel_dist} m, ähnlicher Boden)</h4>${x.duels.length
      ? `<button class="riv-btn ${vorneCls(x.duels_sum)}" type="button" data-duel="1" data-k="${dk}" aria-expanded="${dOffen}" title="Grün: gegen mindestens die Hälfte der heutigen Gegner vorne erwartet, rot: gegen weniger">${dOffen ? "▾" : "▸"} ${duelKnopf(x.duels_sum, x.duels.length)}</button>${dOffen ? duelsHTML(x.duels, race) : ""}`
      : `<p class="muted">Kein passendes Duell mit einem heutigen Gegner (letzte ${DATA.params.duel_days} Tage, ±${DATA.params.duel_dist} m zu heute, Boden innerhalb einer Stufe).</p>`}</div>
    <div class="panel"><h4>Heutige Gegner · indirekte Duelle (letzte ${DATA.params.ind_days} Tage)</h4>${indirektHTML(x, race)}</div>
    <div class="panel"><h4>Letzte Läufe</h4>${formTable(x.form_lines, x.no, x.weight, x.rating, x.days, x, race)}</div>

}

// Duelle: je heutigem Gegner das letzte Duell, Abstand damals ± Gewichtsverschiebung (1 kg = 1 Länge)
// Farbe der Duell-Knöpfe wie beim Gegner-Knopf der letzten Läufe: grün ab der Hälfte vorne erwartet
const vorneCls = S => !S || !(S.ahead + S.behind) ? "" : S.ahead / (S.ahead + S.behind) >= 0.5 ? "up" : "down";
function duelKnopf(S, n){
  const t = `${n} ${n === 1 ? "Duell" : "Duelle"} mit ${S.n} heutigen ${S.n === 1 ? "Gegner" : "Gegnern"}`;
  return S.ahead + S.behind ? `${t} · vorne erwartet gegen ${S.ahead}/${S.ahead + S.behind}` : t;
}
// Indirekte Duelle: Vergleich über gemeinsame frühere Gegner, je heutigem Gegner zusammengefasst
// Heutiger Gegner: Nummer, Name und Rang in der PMU-Prognose von allen Startern, z. B. "9 Hey Man 1/10"
function gegnerHeute(no, name, race){
  const feld = race.runners.filter(r => !r.nr), g = race.runners.find(r => r.no === no);
  const S = g && g.prono && g.prono.sel;
  const rang = `${S ? S.rank : "–"}/${feld.length}`;
  const tip = S ? `PMU-Prognose: Rang ${S.rank} von ${feld.length} Startern, cote probable ${S.cote}` : `nicht in der PMU-Auswahl (${feld.length} Starter)`;
  return `${no ? `<b class="num">${no}</b> ` : ""}${esc(title(name))} <span class="muted num" title="${esc(tip)}">${rang}</span>`;
}
function indirektHTML(x, race){
  const I = x.indirect;
  if (!I) return `<p class="muted">Kein gemeinsamer früherer Gegner mit einem heutigen Gegner (Vergleichsrennen der letzten ${DATA.params.ind_days} Tage, ±${DATA.params.ind_dist} m, Boden innerhalb einer Stufe, alle drei in der vorderen Feldhälfte).</p>`;
  const k = `${x.no}|ind`, offen = state.duels.has(k);
  const knopf = `Vergleich mit ${I.n} heutigen ${I.n === 1 ? "Gegner" : "Gegnern"} über gemeinsame Gegner` + (I.ahead + I.behind ? ` · vorne erwartet gegen ${I.ahead}/${I.ahead + I.behind}` : "");
  const kg = v => v == null ? "–" : sgn(v, 1) + " kg";
  const tab = `<div class="rivals duels scroll"><table><thead><tr><th>Gegner heute</th><th>gemeinsame Gegner</th><th class="r" title="Ø Leistungsunterschied in den Vergleichsrennen: Längen × kg je Länge (Boden × Distanz) + Mehrgewicht, jeweils gegen den gemeinsamen Gegner; + = dieses Pferd besser">damals</th><th class="r" title="eigenes Gewicht heute − Gewicht des Gegners heute">Mehrgewicht heute</th><th class="r" title="damals − Mehrgewicht heute; in Längen mit kg je Länge von heute (${fx(I.kpl,2)} kg)">heute erwartet</th></tr></thead><tbody>${
    I.rivals.map(e => {
      const c = e.exp_kg == null ? "" : e.exp_kg > 0 ? "up" : e.exp_kg < 0 ? "down" : "";
      const erw = e.exp_kg == null ? "–" : e.exp_kg === 0 ? "gleichauf" : `${fx(Math.abs(e.exp_kg),1)} kg / ${fx(Math.abs(e.exp_l ?? 0),1)} L ${e.exp_kg > 0 ? "vor ihm" : "hinter ihm"}`;
      return `<tr><td>${gegnerHeute(e.rival_no, e.rival, race)}</td>
        <td title="${esc(e.common.map(title).join(", "))}">${e.common.length} ${e.common.length === 1 ? "Pferd" : "Pferde"} <span class="muted">(${e.n} ${e.n === 1 ? "Vergleich" : "Vergleiche"})</span></td>
        <td class="r num"><span class="${(e.then_kg ?? 0) > 0 ? "up" : (e.then_kg ?? 0) < 0 ? "down" : ""}">${kg(e.then_kg)}</span></td>
        <td class="r num">${kg(e.w_today)}</td>
        <td class="r num"><span class="verdict-chip ${c}">${erw}</span></td></tr>`; }).join("")}</tbody></table>
    <p class="muted" style="margin:4px 0 0;font-size:11.5px">Vergleichsrennen: letzte ${DATA.params.ind_days} Tage, ±${DATA.params.ind_dist} m, Boden innerhalb einer Stufe (PSF nur mit PSF), dieses Pferd, der gemeinsame Gegner und der heutige Gegner jeweils in der vorderen Hälfte des Feldes. Mehrere gemeinsame Gegner bzw. Vergleiche: Durchschnitt.</p></div>`;
  return `<button class="riv-btn ${vorneCls(I)}" type="button" data-duel="1" data-k="${k}" aria-expanded="${offen}" title="Grün: gegen mindestens die Hälfte der heutigen Gegner vorne erwartet, rot: gegen weniger">${offen ? "▾" : "▸"} ${knopf}</button>${offen ? tab : ""}`;
}
function duelsHTML(list, race){
  const kg = v => v == null ? "–" : sgn(v, 1) + " kg";
  return `<div class="rivals duels scroll"><table><thead><tr><th>Gegner heute</th><th>Rennen</th><th class="r">Platz</th><th class="r">Abstand</th><th class="r">Gewicht damals</th><th class="r">Diff. damals</th><th class="r">Diff. heute</th><th class="r">Verschiebung</th><th class="r" title="Abstand damals − Verschiebung des Gewichtsunterschieds, 1 kg = 1 Länge">heute erwartet</th></tr></thead><tbody>${
    list.map(d => {
      const ab = d.diff_l == null ? "–" : d.diff_l > 0 ? `${fx(d.diff_l,1)} L vor ihm` : d.diff_l < 0 ? `${fx(-d.diff_l,1)} L hinter ihm` : "gleichauf";
      const cls = d.diff_l == null ? "" : d.diff_l > 0 ? "up" : d.diff_l < 0 ? "down" : "";
      const sh = d.shift == null ? "–" : d.shift === 0 ? "unverändert" : `<span class="${d.shift > 0 ? "down" : "up"}">${kg(d.shift)} ${d.shift > 0 ? "ungünstiger" : "günstiger"}</span>`;
      return `<tr><td>${gegnerHeute(d.rival_no, d.rival, race)}</td>
        <td>${dt(d.date)} · ${esc(title(d.course))} ${d.dist ?? ""} m <span class="muted">${esc(d.going || "")}${d.type ? " · " + esc(d.type) : ""}</span></td>
        <td class="r num"><b>${d.pos ?? "–"}</b> / ${d.rival_pos ?? "–"} <span class="muted">(${d.ran ?? "–"})</span></td>
        <td class="r num"><span class="${cls}">${ab}</span></td>
        <td class="r num">${d.weight != null ? fx(d.weight,1) : "–"} / ${d.rival_weight != null ? fx(d.rival_weight,1) : "–"}</td>
        <td class="r num">${kg(d.w_then)}</td><td class="r num">${kg(d.w_today)}</td><td class="r num">${sh}</td>
        <td class="r num">${d.exp_l == null ? "–" : `<span class="verdict-chip ${d.exp_l > 0 ? "up" : d.exp_l < 0 ? "down" : ""}">${d.exp_l > 0 ? `${fx(d.exp_l,1)} L vor ihm` : d.exp_l < 0 ? `${fx(-d.exp_l,1)} L hinter ihm` : "gleichauf"}</span>`}</td></tr>`; }).join("")}</tbody></table>
    <p class="muted" style="margin:4px 0 0;font-size:11.5px">Platz: dieses Pferd / Gegner (Starter). Diff. = eigenes Gewicht − Gewicht des Gegners; Verschiebung = Diff. heute − Diff. damals (+ = trägt heute im Vergleich mehr, also ungünstiger). Heute erwartet = Abstand damals − Verschiebung (1 kg = 1 Länge); am Knopf zählt je Gegner das letzte Duell.</p></div>`;
}

// Fünftel 400 m vor dem Ziel: eigenes Pferd hervorgehoben, dazu Punkte für den 1. (gold), 2. (silber), 3. (bronze)
const PODEST = ["#d4a017", "#a8b0b8", "#b87333"];
function fifthSVG(f, pos, ran, m, top3){
  const mit = (top3 || []).some(q => q != null);
  const W = 104, H = mit ? 36 : 26, cw = 18, ty = mit ? 35 : 25;
  const cells = [1,2,3,4,5].map(i => `<rect x="${2+(i-1)*(cw+2)}" y="2" width="${cw}" height="14" rx="2" fill="${i===f ? "var(--hi)" : "var(--surface-2)"}" stroke="var(--line)"/>`).join("");
  const proZelle = {};
  const dots = (top3 || []).map((q, k) => {
    if (q == null) return "";
    const j = proZelle[q] = (proZelle[q] ?? -1) + 1;
    return `<circle cx="${2+(q-1)*(cw+2) + 4.5 + j*4.5}" cy="21.5" r="3.2" fill="${PODEST[k]}" stroke="rgba(0,0,0,.45)" stroke-width=".6"/>`;
  }).join("");
  const wo = (top3 || []).map((q, k) => q != null ? `${k+1}. im Fünftel ${q}` : null).filter(Boolean).join(", ");
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fünftel ${f} (Platz ${pos} von ${ran} bei ${m} m)"><title>Platz ${pos} von ${ran}, ${m} m vor dem Ziel → Fünftel ${f}${wo ? ` · ${wo} (gold/silber/bronze)` : ""}</title>${cells}${dots}<text x="2" y="${ty}">vorn</text><text x="${W-2}" y="${ty}" text-anchor="end">hinten</text></svg>`;
}
function paceSVG(v){
  const W = 112, H = 26, lo = 85, hi = 115, x = t => 4 + (Math.max(lo, Math.min(hi, t)) - lo) / (hi - lo) * (W - 8);
  const col = v > 102 ? "var(--bad)" : v < 98 ? "var(--accent)" : "var(--ink-2)";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Pace-Ratio ${v}"><title>Pace-Ratio ${v}: ${v > 100 ? "schnell angegangen (früh schneller als am Schluss)" : "Schlusssprint (am Schluss schneller)"}</title>
    <rect x="4" y="7" width="${W-8}" height="4" rx="2" fill="var(--surface-2)" stroke="var(--line)"/>
    <line x1="${x(100)}" x2="${x(100)}" y1="3" y2="15" stroke="var(--ink-3)"/>
    <circle cx="${x(v)}" cy="9" r="5" fill="${col}"/>
    <text x="4" y="25">Sprint</text><text x="${x(100)}" y="25" text-anchor="middle">100</text><text x="${W-4}" y="25" text-anchor="end">Tempo</text></svg>`;
}
const adjSpan = (v, d=1, unit=" L") => v == null ? "" : `<span class="adj ${v > 0 ? "up" : v < 0 ? "down" : ""}">${sgn(v, d)}${unit}</span>`;

function rivalsHTML(list){
  if (!list || !list.length) return `<div class="rivals muted">Kein Gegner direkt davor oder dahinter ist seitdem wieder gelaufen.</div>`;
  const V = {besser:["up","besser als erwartet"], schlechter:["down","schlechter als erwartet"], "wie erwartet":["","wie erwartet"]};
  return `<div class="rivals"><table><thead><tr><th>Gegner</th><th>damals</th><th>nächster Start</th><th title="Klasse des nächsten Rennens: €/L+ (Ø Gewinn je Lauf der Teilnehmer) und Val+ (Ø Valeur), 100 = Ø aller früheren Rennen">Klasse</th><th>Ergebnis</th><th>vs. Quote</th></tr></thead><tbody>${
    list.map(g => { const n = g.next;
      const damals = `${g.pos ?? "–"}. · ${g.diff_l == null ? "" : g.diff_l < 0 ? `${fx(-g.diff_l,1)} L vor ihm` : g.diff_l > 0 ? `${fx(g.diff_l,1)} L hinter ihm` : "gleichauf"}${g.odds != null ? ` <span class="muted">· ${fx(g.odds,1)}</span>` : ""}`;
      if (!n) return `<tr><td>${esc(title(g.horse))}</td><td class="num">${damals}</td><td colspan="4" class="muted">seitdem nicht wieder gelaufen</td></tr>`;
      const kl = [n.epr_idx != null ? `<span class="ae ${idxCls(n.epr_idx)}" title="€/L+ des nächsten Rennens">€/L+ ${n.epr_idx}</span>` : "",
                  n.val_idx != null ? `<span class="ae ${idxCls(n.val_idx)}" title="Val+ des nächsten Rennens">Val+ ${n.val_idx}</span>` : ""].filter(Boolean).join(" ") || `<span class="muted">–</span>`;
      const v = V[n.verdict] || ["", "–"];
      return `<tr><td>${esc(title(g.horse))}</td><td class="num">${damals}</td>
        <td>${dt(n.date)} · ${esc(title(n.course))} ${n.dist ?? ""} m${g.more ? ` <span class="muted">(+${g.more} weitere)</span>` : ""}</td>
        <td class="num">${kl}</td>
        <td class="num"><b>${n.pos ?? "–"}</b>/${n.ran ?? "–"}</td>
        <td><span class="verdict-chip ${v[0]}" title="Platz ${n.pos ?? "–"} bei Quotenrang ${n.odds_rank ?? "–"} (Kurs ${fx(n.odds,1)})">${v[1]}</span> <span class="muted num">Q-Rang ${n.odds_rank ?? "–"}</span></td></tr>`; }).join("")}</tbody></table></div>`;
}
function rivBtn(f, k, offen){
  const S = f.rivals_stat;
  if (!S) return "";
  const bw = S.better + S.worse, q = bw ? S.better / bw : null;
  const cls = q == null ? "" : q >= 0.5 ? "up" : "down";
  const tip = `${S.n} Gegner, ${S.ran} davon seitdem wieder gelaufen: im nächsten Start ${S.better} besser, ${S.worse} schlechter, ${S.same} wie ihr Quotenrang – angezeigt besser / (besser + schlechter)`;
  return `<button class="riv-btn ${cls}" type="button" data-k="${k}" aria-expanded="${offen}" title="${esc(tip)}">${offen ? "▾" : "▸"} Gegner (${S.n})${bw ? ` · ${S.better}/${bw} besser` : ""}</button>`;
}

const adjTip = (was, w, damals) => (w != null
  ? `groß: bereinigt auf das heutige Gewicht = ${was} − ${fx(w,1)} kg + ${DATA.params.weight_ref}; klein: roh`
  : `heutiges Gewicht unbekannt – nur der Rohwert`) + (damals != null ? ` (damals ${fx(damals,1)} kg getragen)` : "");
function dCell(v, roh, ziel, k, f){
  if (v == null) return `<td class="r num"><span class="muted">–</span></td>`;
  const was = ziel === "L600" ? "Tempo letzte 600 m" : "schnellstes 200-m-Segment der letzten 800 m" + (f.b200_seg ? ` (${f.b200_seg})` : "");
  const t = `Δ${ziel} A: ${sgn(v,2)} km/h gegenüber der Erwartung (Tag × Kurs × Going)` + (k != null ? ` · darin Klassenkorrektur der Gruppe ${sgn(k,2)} km/h` : "") + ` · ${was}: ${fx(roh,1)} km/h`;
  return `<td class="r num" title="${esc(t)}"><span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${sgn(v,1)}</span></td>`;
}
function trCell(f, wHeute, attr = ""){
  if (f.tr == null) return `<td class="r rt-cell"><span class="muted">–</span></td>`;
  const big = f.tr_heute ?? f.tr;
  const umg = wHeute != null ? `groß: auf das heutige Gewicht ${fx(wHeute,1)} kg umgerechnet = TR − (${fx(wHeute,1)} − 55) × 2,2 = ${big}` : "heutiges Gewicht unbekannt – TR bezogen auf 55 kg";
  const t = `TR ${f.tr} lb (bezogen auf 55 kg) = Zeit-Rating ${f.tr_zeit} + Upgrade ${sgn(f.tr_upg ?? 0,1)} (Finishing Speed ${fx(f.fs,1)} % gegen optimal ${fx(f.fs_opt,1)} %)` + (f.tr_ga != null ? ` · Going Allowance ${sgn(f.tr_ga,2)} s/km` : "") + (f.weight != null ? ` · damals ${fx(f.weight,1)} kg getragen` : "") + ` · ${umg}; klein: TR bei 55 kg, darunter Zeit-Rating und Upgrade`;
  const cap = f.tr_cap ? ` · Upgrade auf ${DATA.params.tr_upg_max} lb gedeckelt: Rennen falsch gelaufen, TR unsicher – zählt nicht für das beste TR der Übersicht` : "";
  const p = f.tr_cap ? null : poolLage("tr", big);
  return `<td class="r rt-cell ${f.tr_cap ? "cap" : ""}${attr ? " kpi-c" : ""}" ${attr} title="${esc(t + cap + lageText(p) + " · Farbe in 7 Stufen: oberste/unterste 10 % kräftig, 25 %, 40 %" + (attr ? " · Klick: Vergleich mit dem Feld" : ""))}"><b class="lvl" style="${stufeStil(p)}">${big}${f.tr_cap ? "*" : ""}</b><small>${f.tr}</small><small>${f.tr_zeit}${f.tr_upg ? " " + sgn(f.tr_upg,0) : ""}</small></td>`;
}
function rtCell(raw, adj, tip, cls = "", stil = "", attr = ""){
  if (raw == null) return `<td class="r rt-cell"><span class="muted">–</span></td>`;
  return `<td class="r rt-cell${attr ? " kpi-c" : ""}" ${attr} title="${esc(tip)}"><b class="lvl ${cls}" style="${stil}">${fx(adj ?? raw, 1)}</b>${adj != null ? `<small>${fx(raw, 1)}</small>` : ""}</td>`;
}
// Kommentar zum Lauf (PMU, französisch); falls übersetzt, Deutsch mit dem Original im Tooltip
function kommentarHTML(f){
  const teil = (de, fr, label, cls) => {
    if (!fr) return "";
    const txt = de || fr;
    return `<span class="${cls}" title="${esc(de ? "Original: " + fr : "Keine Übersetzung verfügbar")}"><b>${label}</b> ${esc(txt)}${de ? "" : ` <span class="fr">FR</span>`}</span>`;
  };
  const a = teil(f.comment_de, f.comment, "Kommentar", "");
  return a ? `<div class="cmt-t">${a}</div>` : "";
}
// Valeur damals und heute im Vergleich: heute − damals; negativ = heute niedriger eingestuft (günstiger)
function valCell(v, rHeute){
  if (v == null) return `<td class="r num"><span class="muted">–</span></td>`;
  const d = rHeute != null ? Math.round((rHeute - v) * 10) / 10 : null;
  const tip = `Valeur in diesem Rennen ${fx(v,1)}` + (d == null ? " – heutige Valeur unbekannt"
    : d === 0 ? " – heute gleich eingestuft" : ` – heute ${fx(Math.abs(d),1)} ${d > 0 ? "höher (ungünstiger)" : "niedriger (günstiger)"} eingestuft (heute ${fx(rHeute,1)})`);
  return `<td class="r rt-cell" title="${esc(tip)}"><b>${fx(v,1).replace(/\.0$/,"")}</b>${d != null ? `<small class="${d < 0 ? "up" : d > 0 ? "down" : ""}">${d === 0 ? "±0" : sgn(d,1).replace(/\.0$/,"")}</small>` : ""}</td>`;
}
const SAME_NAME = {K: "Kurs (gleicher Belag)", D: "Distanz ±100 m", B: "Bodengruppe"};
const sameHas = (f, k) => (f.same || []).includes(k);
const markIf = (ok, html, k) => ok ? `<mark class="same" title="${SAME_NAME[k]} wie heute">${html}</mark>` : html;
function sameTags(f){
  const s = f.same || [];
  return s.length ? `<span class="same-tags" title="Wie heute: ${s.map(k => SAME_NAME[k]).join(", ")}">${s.map(k => `<b>${k}</b>`).join("")}</span>` : "";
}
// Vergleichs-Overlay ARR/TR: Klick auf ARR oder TR einer Formzeile zeigt die Läufe aller heutigen Starter
// der letzten 365 Tage (ohne ausgerittene, auf das heutige Gewicht bereinigt) – je Pferd eine Zeile, x = Wert.
// Vom gewählten Pferd alle Läufe, von den anderen alle besseren und schlechtere nur bis 5 kg (ARR) / 10 lb (TR) darunter.
const KPI_NAME = {arr: "ARR", tr: "TR"}, KPI_EINH = {arr: "kg", tr: "lb"};
const BODEN_GR = ["VERY FAST", "FAST", "SLOW", "VERY SLOW", "PSF"];
const grpLabel = g => g === "PSF" ? "PSF" : g ? g.charAt(0) + g.slice(1).toLowerCase() : "–";
let KPI = null;
const kpiAttr = (k, no, f) => !f.unreliable && (k === "arr" ? f.arr != null : f.tr != null)
  ? `data-kpi="${k}" data-no="${no}" data-rid="${esc(f.race_id)}" role="button" tabindex="0"` : "";
function kpiLaeufe(x){
  if (x.kpi) return x.kpi.map(([date, course, dist, going, arr, tr, cap, rid, val, epr]) => ({date, course, dist, going, arr, tr, cap: !!cap, rid, val, epr}));
  const heute = new Date(DATA.date);                       // ältere Daten ohne x.kpi: nur die gezeigten Formzeilen
  return x.form_lines.filter(f => !f.unreliable && (heute - new Date(f.date)) / 864e5 <= (DATA.params.kpi_days || 365))
    .map(f => ({date: f.date, course: f.course, dist: f.dist, going: null, arr: f.arr_adj ?? f.arr, tr: f.tr_heute ?? f.tr, cap: !!f.tr_cap, rid: f.race_id, val: f.cls_val_idx, epr: f.cls_epr_idx}));
}
function kpiOeffnen(k, no, rid){
  const r = DATA.races[state.race];
  // Filter mit Mehrfachauswahl: je Gruppe eine Menge gewählter Bereiche, leer = alle
  KPI = {k, no: +no, rid, f: {dist: new Set(["100"]), going: new Set(r.going_pmu ? [r.going_pmu] : []), bahn: new Set(), tage: new Set()}};
  document.body.classList.add("ov-auf");
  kpiZeichnen();
}
// Klick auf einen Punkt: Overlay zu, Starter aufklappen und zur Formzeile dieses Laufs springen
// (Lauf nicht unter den gezeigten Formzeilen: zum Abschnitt „Letzte Läufe“)
function kpiSprung(no, rid){
  kpiSchliessen();
  state.mid.add(no); state.open.add(no); renderRace();
  const art = document.querySelector(`[data-runner="${no}"]`);
  if (!art) return;
  const ziel = art.querySelector(`tr.lauf[data-rid="${CSS.escape(rid)}"]`)
    || [...art.querySelectorAll(".panel")].find(p => /letzte läufe/i.test((p.querySelector("h4") || {}).textContent || "")) || art;
  const navH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--nav-h")) || 0;
  const kopf = art.querySelector(".runner-kopf"), kh = kopf ? kopf.offsetHeight : 0;
  window.scrollTo({top: window.scrollY + ziel.getBoundingClientRect().top - navH - kh - 10});
  ziel.classList.add("sprung"); setTimeout(() => ziel.classList.remove("sprung"), 1800);
}
function kpiSchliessen(){
  KPI = null; document.body.classList.remove("ov-auf");
  const o = document.getElementById("kpi-ov"); if (o) o.remove();
}
function kpiZeichnen(){
  const r = DATA.races[state.race], K = KPI, k = K.k, W = (DATA.params.kpi_window || {arr: 5, tr: 10})[k];
  const heute = new Date(DATA.date), alter = d => Math.max(0, (heute - new Date(d)) / 864e5);
  const tage = DATA.params.kpi_days || 365;
  const feld = r.runners.filter(x => !x.nr || x.no === K.no).sort((a, b) => a.no - b.no)
    .map(x => ({x, laeufe: kpiLaeufe(x).filter(l => l[k] != null)}));
  const sel = feld.find(a => a.x.no === K.no);
  if (!sel) return;
  // gewählter Lauf mit beiden Kennzahlen (für die Umschaltung ARR/TR; fehlt eine, ist ihr Knopf aus)
  const fz = sel.x.form_lines.find(f => f.race_id === K.rid);
  const roh = kpiLaeufe(sel.x).find(l => l.rid === K.rid) || (fz && {arr: fz.arr_adj ?? fz.arr, tr: fz.tr_heute ?? fz.tr}) || {};
  let gew = sel.laeufe.find(l => l.rid === K.rid);
  if (!gew) {                                               // gewählter Lauf älter als 365 Tage: aus der Formzeile
    const f = sel.x.form_lines.find(f => f.race_id === K.rid);
    if (!f) return;
    gew = {date: f.date, course: f.course, dist: f.dist, going: null, arr: f.arr_adj ?? f.arr, tr: f.tr_heute ?? f.tr, cap: !!f.tr_cap, rid: f.race_id, val: f.cls_val_idx, epr: f.cls_epr_idx, alt: true};
    sel.laeufe.push(gew);
  }
  const v0 = gew[k];
  const bahnKey = s => String(s || "").trim().toUpperCase();
  // getrennte Bereiche, damit Mehrfachauswahl Sinn ergibt
  const distBer = l => { if (r.distance == null || l.dist == null) return null; const d = Math.abs(l.dist - r.distance);
    return d <= 100 ? "100" : d <= 200 ? "200" : d <= 400 ? "400" : "mehr"; };
  const tageBer = l => { const a = alter(l.date); return a <= 30 ? "30" : a <= 60 ? "60" : a <= 90 ? "90" : "365"; };
  const bahnBer = l => bahnKey(l.course) === bahnKey(r.course) ? "heute" : "andere";
  const in_ = (menge, wert) => !menge.size || wert == null || menge.has(wert);
  const passt = l => in_(K.f.dist, distBer(l)) && in_(K.f.going, l.going) && in_(K.f.bahn, bahnBer(l)) && in_(K.f.tage, tageBer(l));
  const spanne = K.f.tage.size ? Math.max(...[...K.f.tage].map(v => +v === 365 ? tage : +v)) : tage;
  for (const a of feld) {
    const imFenster = l => a === sel || l[k] >= v0 - W;
    a.zeigen = a.laeufe.filter(l => l === gew || (passt(l) && imFenster(l)));
    a.weg = a.laeufe.filter(l => l !== gew && !passt(l) && imFenster(l));   // durch Filter abgewählt: nur blass grau
  }
  // Filter-Auswahl
  const boeden = BODEN_GR.filter(g => g === r.going_pmu || feld.some(a => a.laeufe.some(l => l.going === g)));
  const chip = (typ, wert, an, text) => `<button type="button" class="kchip" data-f="${typ}" data-v="${esc(String(wert))}" aria-pressed="${an}">${esc(text)}</button>`;
  const kz = `<div class="grp"><b>Kennzahl</b>${["arr", "tr"].map(q => `<button type="button" class="kchip" data-kz="${q}" aria-pressed="${q === k}"${roh[q] == null ? ` disabled title="Für diesen Lauf kein ${KPI_NAME[q]}"` : ""}>${KPI_NAME[q]}</button>`).join("")}</div>`;
  const filter = `<div class="ov-filter">${kz}
    ${[["dist", "Distanz", [["100", "±100 m"], ["200", "±101–200 m"], ["400", "±201–400 m"], ["mehr", "> ±400 m"]]],
       ["going", "Boden", boeden.map(g => [g, grpLabel(g) + (g === r.going_pmu ? " (heute)" : "")])],
       ["bahn", "Bahn", [["heute", title(r.course || "heute") + " (heute)"], ["andere", "andere Bahnen"]]],
       ["tage", "Zeitraum (ab heute)", [["30", "letzte 30 Tage"], ["60", "vor 31–60 T."], ["90", "vor 61–90 T."], ["365", `vor 91–${tage} T.`]]]]
      .map(([f, name, opt]) => `<div class="grp"><b>${name}</b>${chip(f, "", !K.f[f].size, "alle")}${opt.map(([v, t]) => chip(f, v, K.f[f].has(v), t)).join("")}</div>`).join("")}
  </div>`;
  // Diagramm
  const box = document.querySelector("#kpi-ov .ov-box");
  const breite = Math.max(300, Math.min(940, (box ? box.clientWidth : Math.min(window.innerWidth, 960)) - 32));
  const schmal = breite < 520, lw = schmal ? 112 : 180, rh = 26, oben = 22, unten = 8, rand = schmal ? 74 : 80;
  // Skala nur gewählter Wert ± 5 kg / 10 lb; bessere Werte rechts davon in einer eigenen Spalte („über der Skala“),
  // schlechtere außerhalb entfallen
  const lo = v0 - W, hi = v0 + W, step = k === "arr" ? 1 : 2;
  const x0 = lw + 8, x1 = breite - rand - 6, xo = breite - rand + 8, sx = v => x0 + (v - lo) / (hi - lo) * (x1 - x0);
  const H = oben + feld.length * rh + unten;
  const ticks = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(v);
  const maxZ = Math.floor((lw - 30) / 6.6);
  const kurz = s => s.length > maxZ ? s.slice(0, maxZ - 1) + "…" : s;
  const nk = k === "arr" ? 1 : 0;
  // Kreisgröße = Klasse des Rennens: Val+ und €/L+ je standardisiert über alle Läufe des heutigen Feldes
  // (z = (Index − Ø) / Streuung), 50/50 gemittelt (fehlt einer, zählt der andere); Radius 5 ± 1,8 je Streuung, 2,5 bis 9
  const mw = key => { const v = feld.flatMap(a => a.laeufe.map(l => l[key])).filter(x => x != null);
    const m = v.length ? v.reduce((s, x) => s + x, 0) / v.length : 100;
    const s = v.length > 1 ? Math.sqrt(v.reduce((q, x) => q + (x - m) ** 2, 0) / v.length) : 0;
    return [m, s || 20]; };
  const [mV, sdV] = mw("val"), [mE, sdE] = mw("epr");
  const klZ = l => { const z = [l.val != null ? (l.val - mV) / sdV : null, l.epr != null ? (l.epr - mE) / sdE : null].filter(v => v != null);
    return z.length ? z.reduce((s, v) => s + v, 0) / z.length : null; };
  const rad = l => { const z = klZ(l); return z == null ? 4 : Math.max(2.5, Math.min(9, 5 + 1.8 * z)); };
  let besser = 0;
  const zeilen = feld.map((a, i) => {
    const y = oben + i * rh + rh / 2, ist = a === sel;
    const nB = ist ? 0 : a.zeigen.filter(l => l[k] >= v0).length; if (nB) besser++;
    const hohl = l => k === "tr" && l.cap;
    const tipp = l => `${a.x.no} ${title(a.x.horse)} · ${dt(l.date)} · ${title(l.course || "")} ${l.dist ?? ""} m · ${grpLabel(l.going)} · ${KPI_NAME[k]} ${fx(l[k], nk)}${hohl(l) ? " (TR gedeckelt, unsicher)" : ""} · Klasse Val+ ${l.val ?? "–"} / €/L+ ${l.epr ?? "–"}${l.alt ? " (älter als " + tage + " Tage)" : ""}`;
    const op = l => Math.max(0.18, 1 - 0.82 * Math.min(alter(l.date), spanne) / spanne);   // blass relativ zum gewählten Zeitraum
    const farbe = l => ist ? "var(--accent)" : l[k] >= v0 ? "var(--bad)" : "var(--ink-3)";
    const sprung = l => `data-sp-no="${a.x.no}" data-sp-rid="${esc(l.rid)}"`;   // Klick: zum Starter und dieser Formzeile
    const innen = a.zeigen.filter(l => l === gew || (l[k] >= lo && l[k] <= hi));
    const geist = a.weg.filter(l => l[k] >= lo && l[k] <= hi).map(l => `<g class="ov-pt ov-weg" ${sprung(l)}><title>${esc("ausgefiltert: " + tipp(l))}</title><circle cx="${sx(l[k])}" cy="${y}" r="${rad(l)}" fill="var(--ink-3)" fill-opacity=".14"/><circle cx="${sx(l[k])}" cy="${y}" r="9" fill="transparent"/></g>`).join("");
    const drueber = a.zeigen.filter(l => l !== gew && l[k] > hi).sort((p, q) => q[k] - p[k]);
    const pkt = [...innen].sort((p, q) => (p === gew) - (q === gew) || alter(q.date) - alter(p.date)).map((l, j) => {
      const dy = (j % 2 ? 4 : -4) * (innen.length > 1 ? 1 : 0);
      if (l === gew) return `<g class="ov-pt" ${sprung(l)}><title>${esc("gewählt: " + tipp(l))}</title><circle cx="${sx(l[k])}" cy="${y}" r="${rad(l) + 3}" fill="none" stroke="var(--hi)" stroke-width="3"/><circle cx="${sx(l[k])}" cy="${y}" r="${rad(l)}" fill="${farbe(l)}"/><circle cx="${sx(l[k])}" cy="${y}" r="11" fill="transparent"/></g>`;
      return `<g class="ov-pt" ${sprung(l)}><title>${esc(tipp(l) + " – Klick: zur Formzeile")}</title><circle cx="${sx(l[k])}" cy="${y + dy}" r="${rad(l)}" fill="${hohl(l) ? "var(--surface)" : farbe(l)}" stroke="${farbe(l)}" stroke-width="${hohl(l) ? 1.6 : 0}" fill-opacity="${op(l)}" stroke-opacity="${op(l)}"/><circle cx="${sx(l[k])}" cy="${y + dy}" r="10" fill="transparent"/></g>`;
    }).join("");
    // über der Skala: Dreieck mit dem besten Wert (Anzahl in Klammern), Klick springt zum besten Lauf
    const ueber = drueber.length ? (l => `<g class="ov-pt" ${sprung(l)}><title>${esc(`über der Skala (> ${fx(hi, nk)}): ` + drueber.map(tipp).join(" | ") + " – Klick: zur Formzeile")}</title>
      <path d="M${xo} ${y - 5} L${xo + 8} ${y} L${xo} ${y + 5} Z" fill="${farbe(l)}" fill-opacity="${op(l)}"/>
      <text x="${xo + 11}" y="${y + 4}" class="ov-ueber">${fx(l[k], nk)}${drueber.length > 1 ? ` (${drueber.length})` : ""}</text>
      <rect x="${xo - 4}" y="${y - 11}" width="${rand - 6}" height="22" fill="transparent"/></g>`)(drueber[0]) : "";
    return `<g class="${ist ? "ov-sel" : ""}">${ist ? `<rect x="0" y="${oben + i * rh}" width="${breite}" height="${rh}" fill="var(--hi-soft)"/>` : i % 2 ? `<rect x="0" y="${oben + i * rh}" width="${breite}" height="${rh}" fill="var(--surface-2)" opacity=".5"/>` : ""}
      <text x="4" y="${y + 4}" class="ov-nr">${a.x.no}</text><text x="28" y="${y + 4}" class="ov-name${ist ? " ist" : ""}">${esc(kurz(title(a.x.horse)))}<title>${esc(title(a.x.horse) + (nB ? ` – ${nB} Lauf/Läufe mindestens so gut` : ""))}</title></text>
      ${geist}${innen.length || drueber.length ? pkt + ueber : geist ? "" : `<text x="${x0}" y="${y + 4}" class="ov-leer">keine passenden Läufe</text>`}</g>`;
  }).join("");
  const svg = `<svg class="ov-svg" width="${breite}" height="${H}" viewBox="0 0 ${breite} ${H}" role="img" aria-label="${KPI_NAME[k]} der heutigen Starter, letzte ${tage} Tage">
    ${ticks.map(v => `<line x1="${sx(v)}" x2="${sx(v)}" y1="${oben - 4}" y2="${H - unten}" stroke="var(--line)"/>${schmal && (Math.round(v / step) % 2 || hi - v < step) ? "" : `<text x="${sx(v)}" y="12" text-anchor="middle" class="ov-tick">${v}</text>`}`).join("")}
    <line x1="${xo - 6}" x2="${xo - 6}" y1="${oben - 4}" y2="${H - unten}" stroke="var(--ink-3)" stroke-dasharray="2 3"/>
    <text x="${xo - 2}" y="12" class="ov-tick">› ${fx(hi, nk)}</text>
    ${zeilen}
    <line x1="${sx(v0)}" x2="${sx(v0)}" y1="${oben - 6}" y2="${H - unten}" stroke="var(--hi)" stroke-width="1.5" stroke-dasharray="4 3"/>
  </svg>`;
  const kopf = `<div class="ov-kopf"><div><h3>${KPI_NAME[k]} · Vergleich mit dem Feld</h3>
    <div class="muted">Gewählt: <b>${sel.x.no} ${esc(title(sel.x.horse))}</b> · ${dt(gew.date)} ${esc(title(gew.course || ""))} ${gew.dist ?? ""} m · ${KPI_NAME[k]} <b>${fx(v0, k === "arr" ? 1 : 0)}</b> ${KPI_EINH[k]} · ${besser} Gegner mit mindestens einem so guten Lauf</div></div>
    <button type="button" class="ov-zu" aria-label="Schließen">×</button></div>`;
  const legende = `<p class="ov-leg"><span class="pk" style="background:var(--accent)"></span> gewähltes Pferd (alle Läufe) · <span class="pk" style="background:var(--bad)"></span> andere: mindestens so gut · <span class="pk" style="background:var(--ink-3)"></span> bis ${W} ${KPI_EINH[k]} schlechter · Skala: gewählter Wert ± ${W} ${KPI_EINH[k]}, rechts davon ▶ bessere Werte über der Skala (bester Wert, Anzahl) · Klick auf einen Punkt: zum Starter und seiner Formzeile · Ring: gewählter Lauf · ganz blass grau: durch die Filter abgewählt · Größe: Klasse des Rennens (Val+ und €/L+ je standardisiert über die Läufe des Feldes, 50/50; groß = stark) · je blasser, desto älter (im gewählten Zeitraum) ${k === "tr" ? "· hohl: TR gedeckelt (unsicher) " : ""}· ${KPI_NAME[k]} auf das heutige Gewicht bereinigt, ohne ausgerittene Läufe.</p>`;
  let o = document.getElementById("kpi-ov");
  if (!o) {
    o = document.createElement("div"); o.id = "kpi-ov";
    o.innerHTML = `<div class="ov-box" role="dialog" aria-modal="true"></div>`;
    document.body.appendChild(o);
    o.addEventListener("click", e => {
      if (e.target === o || e.target.closest(".ov-zu")) return kpiSchliessen();
      const pt = e.target.closest(".ov-pt"); if (pt) return kpiSprung(+pt.dataset.spNo, pt.dataset.spRid);
      const c = e.target.closest(".kchip"); if (!c || c.disabled) return;
      if (c.dataset.kz) { KPI.k = c.dataset.kz; return kpiZeichnen(); }   // ARR ↔ TR, Filter bleiben
      const v = c.dataset.v;
      const m = KPI.f[c.dataset.f];                         // Mehrfachauswahl; „alle“ leert die Gruppe
      if (v === "") m.clear(); else m.has(v) ? m.delete(v) : m.add(v);
      kpiZeichnen();

      <td class="r num" title="${f.weg_med != null ? `${fx(Math.abs(f.weg_med),1)} m ${f.weg_med >= 0 ? "mehr" : "weniger"} gelaufen als der Median des Feldes (≈ ${fx(Math.abs(f.weg_med)/2.4,1)} Längen)${Math.abs(f.weg_med) >= 7.5 ? (f.weg_med > 0 ? " – auffällig viel Weg (Nachteil, meist weit außen)" : " – auffällig wenig Weg (Vorteil, innen)") : ""}` : ""}"><span class="${f.weg_med >= 7.5 ? "hl-down" : f.weg_med <= -7.5 ? "hl-up" : ""}">${f.weg_med != null ? sgn(f.weg_med, 1) : "–"}</span></td>
      <td class="fl-cmt">${cmt}</td>

    </tr>${cmt ? `<tr class="cmt ${f.unreliable ? "unrel" : ""}"><td colspan="11">${cmt}</td></tr>` : ""}${offen ? `<tr class="rivrow"><td colspan="11">${rivalsHTML(f.rivals)}</td></tr>` : ""}${hk.zeilen}`; }).join("");
  return `<div class="scroll"><table class="formtab"><thead><tr>
    <th>Datum · Bahn</th><th>Typ · Preis · Dist · Boden · Klasse</th><th>Pos · Jockey · Gew. · Box · Quote</th><th class="r" title="Valeur (handicapValeur) in diesem Rennen; klein: heutige Valeur − damalige (grün: heute niedriger eingestuft, rot: höher)">Val</th>
    <th class="r" title="ARR: Leistung im Rennen gemessen an den Pferden im vorderen Drittel des Einlaufs (kg), groß bereinigt auf das heutige Gewicht = ARR − Gewicht heute + ${DATA.params.weight_ref}, klein roh">ARR</th><th class="r" title="TR: Zeit-Rating nach Timeform-Art plus Upgrade aus dem Finishing Speed (lb); groß auf das heutige Gewicht umgerechnet, damit die Pferde des Rennens vergleichbar sind; klein: TR bei 55 kg, Zeit-Rating und Upgrade">TR</th>
    <th title="Position ${DATA.params.pos_before_m} m vor dem Ziel als Fünftel des Feldes">Pos. vor Finish</th>
    <th title="Tempo frühe Phase / Tempo Schlussphase × 100">Pace-Ratio</th>
