// Hinweise unter der Karte: Thema je Absatz (nach dem ersten fett gedruckten Begriff), Filter-Knöpfe und Suche
const LEG_THEMEN = [
  ["Kennzahlen", ["A/E", "TR", "ΔL600", "Pos. vor Finish", "RTR", "€/Lauf", "Laufstil"]],
  ["Modelle", ["Power"]],
  ["Formzeilen & Gegner", ["Gegner", "Heutige Gegner", "Letzte Läufe", "Kommentar", "Vergleich ARR/TR", "CGD", "Externe Läufe"]],
  ["Vorlieben & Verbindungen", ["Vorlieben", "Vorlieben-Vergleich", "Abstammungsprofil", "A/E-Matrix", "C"]],
  ["Prognose & Markt", ["PMU-Prognose", "Festkurse"]],
  ["Boden & Bahn", ["Boden"]],
  ["Darstellung & Bedienung", ["Farben", "Aufgeklapptes Pferd", "Starter in drei Stufen"]]];
function legThema(div){
  const b = div.querySelector("b"), t = b ? b.textContent.trim() : "";
  for (const [thema, begriffe] of LEG_THEMEN) if (begriffe.some(w => t === w || t.startsWith(w + " "))) return thema;
  return "Sonstiges";
}
function legendeFilter(){
  const leg = $("#legend"), box = $("#leg-filter");
  const absaetze = [...leg.children].filter(d => d.tagName === "DIV");
  absaetze.forEach(d => d.dataset.thema = legThema(d));
  const themen = [...LEG_THEMEN.map(([t]) => t), "Sonstiges"].filter(t => absaetze.some(d => d.dataset.thema === t));
  let wahl = "Alle";
  box.innerHTML = ["Alle", ...themen].map(t => `<button type="button" data-thema="${esc(t)}" aria-pressed="${t === wahl}">${esc(t)}</button>`).join("")
    + `<input type="search" placeholder="Begriff suchen, z. B. RTR, Value, Boden" aria-label="Hinweise durchsuchen">`;
  const leer = document.createElement("div");
  leer.className = "leg-leer"; leer.textContent = "Kein Hinweis passt zu Filter und Suche."; leg.appendChild(leer);
  const anwenden = () => {
    const q = box.querySelector("input").value.trim().toLowerCase();
    let n = 0;
    for (const d of absaetze) {
      const zeigen = (wahl === "Alle" || d.dataset.thema === wahl) && (!q || d.textContent.toLowerCase().includes(q));
      d.hidden = !zeigen; n += zeigen;
    }
    leer.hidden = n > 0;
    box.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.thema === wahl)));
  };
  box.addEventListener("click", e => { const b = e.target.closest("button"); if (b) { wahl = b.dataset.thema; anwenden(); } });
  box.querySelector("input").addEventListener("input", anwenden);
  anwenden();
}
function renderLegend(){
  const p = DATA.params;
  $("#legend").innerHTML = `
    <div><b>A/E</b> = <b>A/E Platz</b>: Plätze ÷ Σ erwartete Platzwahrscheinlichkeit. Platz = 1.–2. bei bis zu 7 Startern, 1.–3. ab 8. Erwartet aus den Endquoten des Rennens: Marge herausgerechnet (p = (1/Q) ÷ Σ 1/Q), dann Harville mit Korrektur (für Platz 2 und 3 p^0,8 bzw. p^0,65, neu normiert). Über 1 platziert sich die Person öfter, als der Markt erwartet; ohne Marge liegt der Schnitt bei 1. Zweite und dritte Plätze zählen mit – empfindlicher für Form als A/E auf Sieg (im Tooltip zum Vergleich). Grün ≥ 1,10, rot ≤ 0,90; blass bei weniger als 10 Starts (Vorlieben: 5). In der Übersicht: 365 Tage; 🔥 / 🧊 wenn die letzten 30 Tage um mindestens ${String(p.trend_diff).replace(".", ",")} darüber bzw. darunter lagen (ab ${p.trend_min} Starts).</div>
    <div><b>TR</b> (Zeit-Rating nach Timeform-Art, in lb, bezogen auf 55 kg): eigene Zeit (Siegerzeit + Rückstand) minus Going Allowance des Renntags (Tag × Kurs × Going, nach Timeform aus den Zeiten der Pferde gegen ihre Ratings geschätzt) gegen die Standardzeit für Kurs × Distanz (Siegerzeiten guter Klasse, auf eine Referenzklasse umgerechnet); Sekunden → Längen (auf den eigenen Daten kalibriert) → lb (mehr lb je Länge im Sprint), dazu Gewicht und Wegverlust. Plus <b>Upgrade</b> aus dem <b>Finishing Speed</b> (FS% = Tempo der letzten 400 m bis 1600 m, darüber 600 m, ÷ Durchschnittstempo × 100; FS% und Optimum stehen im Tooltip von TR): c × (d/D) × (Optimum − FS%)², ab ${p.tr_upg_knie} FS-Punkten Abweichung nur noch linear und höchstens ${p.tr_upg_max} lb (<b>*</b> = gedeckelt: Rennen falsch gelaufen, TR unsicher, zählt nicht für das beste TR der Übersicht), Optimum = Median der effizienten Läufe auf Kurs × Distanz, c auf den eigenen Daten kalibriert. Übersicht: gewichteter Ø der letzten ${p.avg_runs} Läufe mit TR – Gewicht = Distanzähnlichkeit (halbes Gewicht bei ${p.avg_dist_m} m Unterschied) × Going-Ähnlichkeit (halbes Gewicht bei ${p.going_stufen} Bodengruppe Abstand auf der Leiter Very fast – Fast – Slow – Very slow; PSF gegen Gras ${p.going_psf}); gedeckelte Läufe zählen nicht. Auf das <b>heutige Gewicht</b> umgerechnet (TR − (heutiges Gewicht − 55) × 2,2) – in der Übersicht und in den Formzeilen, damit die Pferde des Rennens vergleichbar sind; klein der Wert bei 55 kg. Ausgerittene haben kein TR.</div>
    <div><b>ΔL600 A / ΔB200 A</b> (km/h): Tempo der letzten 600 m bzw. schnellstes 200-m-Segment der letzten 800 m gegenüber der Erwartung. Verglichen wird nur mit den Startern desselben <b>Tages auf demselben Kurs bei gleicher Bodengruppe</b> (Very fast, Fast, Slow, Very slow, PSF), korrigiert um Kurs × Distanz und das Tempo des Rennens (Pace-Ratio, linear und quadratisch je Distanzgruppe). Weil der Mittelwert einer solchen Gruppe auch ihre Klasse enthält, kommt eine <b>Klassenkorrektur</b> dazu: β × (Ø Klasse der Gruppe − Ø Klasse aller Läufe), β aus Altersklasse und log. Preisgeld über die ganze Historie – ein Tag mit nur schwachen Rennen wird abgewertet, ein starker aufgewertet (Wert im Tooltip). + = schneller als erwartet. Rennen nur mit Pace-Ratio im 1.–99. Perzentil und mindestens 5 Rennen je Kurs × Distanz. Mehr als ${p.beaten_l} Längen Geschlagene gelten als ausgeritten und zählen nicht in den Schnitt. Übersicht: Ø der letzten ${p.avg_runs} Läufe mit Tracking, gewichtet nach Distanzähnlichkeit (halbes Gewicht bei ${p.avg_dist_m} m Unterschied) × Going-Ähnlichkeit (halbes Gewicht bei ${p.going_stufen} Bodengruppe Abstand; PSF gegen Gras ${p.going_psf}), zum Nullpunkt geschrumpft; ± = Streuung der Einzelläufe; darunter der Rang im heutigen Feld. <b>Finish-Index</b> = Tempo letzte 400 m ÷ Tempo davor × 100 (klein: bereinigt).</div>
    <div><b>Pos. vor Finish</b>: Platz ${p.pos_before_m} m vor dem Ziel, eingeteilt in Fünftel des Feldes (hervorgehoben). <b>Pace-Ratio</b>: Tempo der frühen Phase ÷ Tempo der letzten ≥ 600 m × 100; unter 100 Schlusssprint, über 100 schnell angegangen. <b>Weg m</b>: gelaufene Meter gegenüber dem Median aller Starter im Rennen (≈ 2,4 m je Länge); + = weiter gelaufen, meist außen.</div>
    <div><b>RTR</b> (Rating nach dem Rennen, in kg): Elo-artig, Rennen für Rennen in zeitlicher Reihenfolge. Start mit dem offiziellen Rating (sonst 30); in jedem Rennen tritt jedes Pferd gegen jedes andere an – erwartet wird ein Abstand aus Rating − 0,625 × Gewicht, verglichen mit dem tatsächlichen Abstand in Längen × kg je Länge (nach Boden und Distanz), beides auf einer log. Stufe von 1 bis 5. Das Rating wandert um 0,5 × Ø Überraschung (+ kleiner Preisgeldbonus). <b>ARR</b> (Leistung im Rennen, in kg): gemessen an den Pferden im vorderen Drittel des Einlaufs – deren Rating plus Längenabstand × kg je Länge (große Abstände logarithmisch gedämpft) plus Gewichtsunterschied, Ø über diese Referenzen; fehlende Ratings der Referenzen werden aus vergleichbaren Pferden ergänzt. <b>Bereinigt</b> = Wert − Gewicht + ${p.weight_ref} – immer mit dem <b>heutigen</b> Gewicht, auch beim ARR in den Formzeilen (ein früherer ARR von 36 wird bei heute 52 kg zu 39), klein daneben der Rohwert. RTR, ΔL600 A und ΔB200 A stehen nur in der Übersicht. Übersicht: RTR = aktuelles Rating, ARR = nach Distanz- und Going-Ähnlichkeit gewichteter Ø der letzten ${p.avg_runs} Läufe (wie ΔL600 A und TR, ohne Schrumpfung); darunter der Rang im heutigen Feld.</div>
    <div><b>Gegner</b>: für die letzten ${p.rivals_runs} Läufe die zwei Gegner direkt vor und die zwei direkt hinter dem Pferd, die seitdem wieder gelaufen sind – mit Platz im nächsten Start, Klasse dieses Rennens (€/L+, Val+) und ob der Platz besser oder schlechter war als der Rang ihrer Quote. Am Knopf (über das ganze Feld): besser / (besser + schlechter); grün, wenn mindestens die Hälfte der Gegner danach besser lief als ihre Quote (starkes Rennen). <b>⏸ Pause</b>: Zeile zwischen zwei früheren Läufen (bzw. über dem letzten Lauf bis heute), wenn dazwischen mindestens 8 Wochen (56 Tage) lagen. <b>Pos. vor Finish</b>: Fünftel des Pferdes 400 m vor dem Ziel, dazu als Punkte, wo der 1. (gold), 2. (silber) und 3. (bronze) lagen. <b>Heutige Gegner · frühere Duelle</b>: Rennen in der Datenbank, in denen das Pferd schon auf einen heutigen Gegner traf – Platz beider, Abstand, Gewichte damals und wie sich der Gewichtsunterschied bis heute verschoben hat (+ = trägt heute im Vergleich mehr). Je Duell „heute erwartet“ = Abstand damals − Verschiebung (1 kg = 1 Länge); am Knopf: vorne erwartet gegen x von y Gegnern (je Gegner das letzte Duell). <b>Duell</b> (Kachel) und <b>Duell-Rang</b> (Rennkopf): Rangfolge aus allen direkten und indirekten Duellen des heutigen Feldes – je Pferd ein Wert in Längen, sodass die Unterschiede möglichst gut alle heute erwarteten Abstände treffen (kleinste Quadrate; A schlägt B, B schlägt C -> A, B, C). Direkte Duelle zählen doppelt, ältere weniger (Halbwertszeit ${p.duel_halflife ?? 60} Tage), Abstände auf ±${p.duel_max_l ?? 5} L begrenzt; Kachel: Längen gegenüber dem Ø der Pferde mit Duellen und #Rang; Pferde ohne Verbindung untereinander bilden getrennte Gruppen (A, B …); blass bei wenig Gewicht. <b>Indirekte Duelle</b>: Vergleich mit heutigen Gegnern über gemeinsame frühere Gegner – Vergleichsrennen der letzten ${p.ind_days} Tage, ±${p.ind_dist} m, Boden innerhalb einer Stufe (PSF nur mit PSF), alle drei Pferde in der vorderen Feldhälfte. Leistung gegen den gemeinsamen Gegner = Längen × kg je Länge (Boden × Distanz) + Mehrgewicht; daraus der Unterschied zum heutigen Gegner, abzüglich des heutigen Mehrgewichts = heute erwartet (kg, in Längen mit kg je Länge von heute); mehrere Vergleiche gemittelt.</div>
    <div><b>Farben</b>: Rating, Tage, RTR, ARR und TR in der Übersicht nach dem Rang im heutigen Feld – grün oberes Drittel, rot unteres Drittel (bei Tagen umgekehrt: grün = frisch, rot = lange Pause). In den früheren Läufen Klasse (Val, €/L) im Vergleich zu allen früheren Läufen der heutigen Starter – grün = hoher Wert für dieses Rennen, rot = niedriger. <b>TR und ARR</b> der früheren Läufe in 7 Stufen nach ihrer Lage unter allen früheren Läufen der heutigen Starter: oberste 10 % kräftig grün hinterlegt, bis 25 % hellgrün fett, bis 40 % hellgrün, Mitte neutral, entsprechend rot nach unten. <b>±800</b> grün ab 3 gewonnenen, rot ab 3 verlorenen Plätzen; <b>Weg m</b> rot ab 7,5 m mehr (≈ 3 Längen, meist weit außen), grün ab 7,5 m weniger. <b>Rating</b>: Valeur bereinigt nach dem heutigen Gewicht wie RTR/ARR (Valeur − Gewicht + ${p.weight_ref}), klein die Valeur selbst; Farbe nach dem bereinigten Wert. Darunter die letzte Siegmarke (S) im Handicap, ohne Handicap-Sieg die letzte Platzmarke (P, 1.–3.), in Klammern heute im Vergleich.</div>
    <div><b>Festkurse</b> (Kasten „FK“ in der Kurzzeile, von Wettstar beim Erstellen der Karte): oben Festkurs Sieg, darunter der aktuelle Toto-Kurs; gibt es noch keinen Festkurs, steht nur der Toto-Kurs (Kasten „Toto“). Grün = Value gegen das Modell: Kurs × Modell-Siegchance mindestens 1,2 (Erwartungswert +20 % je 1 €), kräftig ab 1,5. Tooltip: Erwartungswert und der Name bei Wettstar. Zuordnung über Bahn, Rennnummer und Startnummer mit Namensprüfung (abweichende Schreibweisen), sonst über den ähnlichsten Namen im Rennen. Das Modell ordnet das Feld nicht besser als der Markt – Value hier heißt: Kurs über der Modell-Meinung, kein belegter Gewinn.</div>
    <div><b>PMU-Prognose</b> (vor dem Rennen): Kommentar der PMU-Redaktion zum Rennen, Auswahl mit <b>cote probable</b> (geschätzte Quote, z. B. 4/1 = 4,0) und Konsens der Tippgeber (Punkte je Liste nach Position, Borda). Am Pferd: <b>P1</b> … Rang in der PMU-Auswahl, <b>T5</b> = in 5 Tipp-Listen, ohne PMU-Auswahl; im Prognose-Kasten rechts die cote probable und <b>Tipp</b> = Platz im Konsens der Tippgeber (z. B. 2./9 = Zweiter von 9 getippten Pferden), ganz unten in der Starterzeile der Kurzkommentar der PMU (kursiv, farbig hinterlegt). Texte auf Deutsch, wo möglich.</div>
    <div><b>Kommentar</b> unter dem Lauf: Kommentar von PMU zum Pferd – auf Deutsch übersetzt (Original im Tooltip), sonst französisch mit <b>FR</b>.</div>
    <div><b>Aufgeklapptes Pferd</b>: sobald sein Name beim Scrollen unter der Navigation verschwindet, bleiben Nummer, Trikot, Name und Prognose oben stehen, bis das Pferd zu Ende ist; ein Klick darauf springt zurück zur Zeile des Pferdes. <b>Startbox</b> (unter der Nummer): Box in Klammern, darunter die Abweichung der Ø relativen Platzierung (Starter − Platz) / (Starter − 1) aller früheren Läufe aus dieser Box auf derselben Konfiguration (Bahn | Distanz | Piste | Parcours | Corde) vom Durchschnitt 0,5; farbig nur, wenn auffällig: mindestens 0,05 entfernt und signifikant (≥ 2 Standardfehler, SE = 0,29 ÷ √Läufe). In den früheren Läufen „Box 3 ▲/▼“ für auffällig gute bzw. schlechte Boxen dieses Rennens. <b>gegen V.</b> beim Platz: Das Pferd lief gegen den Rennverlauf (von hinten in einem Rennen, das vorne gewonnen wurde, oder umgekehrt; Ø frühe Position der ersten drei gegen das Feld, verglichen mit der Norm der Bahn/Distanz, die extremsten 25 %) und landete trotzdem vorne (Platz 1–3 oder vordere 40 %); grau umrandet „gegen V.“ ohne vordere Platzierung und „mit V.“ (Position passte zum Verlauf) – beides im Backtest ohne Effekt, nur zur Einordnung. <b>Scheuklappen</b>: Auge mit geschlossener Klappe = klassisch, mit gestrichelter Fellklappe = australisch – in der Übersicht und je früherem Lauf. <b>Prognose</b> (Kasten rechts): cote probable der PMU-Prognose, darunter dezimal; Morgen- und Totokurs werden nicht angezeigt. <b>B</b> Besitzer mit A/E 365 Tage.</div>
    <div><b>Boden</b>: alle Berechnungen nutzen nur die Bodengruppe des offiziellen Begriffs – Lourd, Très lourd, Collant = Very slow · Souple, Très souple = Slow · Bon souple, Bon = Fast · Léger, Bon léger, Très léger = Very fast · PSF (Standard, Lente, Rapide) = PSF; der Penetrometer-Wert wird nur angezeigt. <b>Distanzgruppen</b> der Vorlieben (Pferd, Vater, Muttervater): 0-1000 m, dann je 200 m (1001-1200, 1201-1400 …), über 3600 m.</div>
    <div><b>€/Lauf</b> (Kachel) und <b>Karriere</b> (Detail, gesamt und ${p.class_days} Tage): Läufe-Siege-Plätze (1.–2. bis 7 Starter, sonst 1.–3.) und Gewinn je Lauf nur aus der PMU-Historie (französische Flachrennen seit Beginn der Sammlung), mit Rang im heutigen Feld; grün ab 1,25 × Median des Feldes, rot bis 0,8 ×. <b>€/L+</b> bei Trainer, Jockey, Besitzer, Züchter, Vater, Muttervater und Cross: Gewinn je Lauf als Index, 100 = Ø aller Personen bzw. Linien dieser Gruppe im selben Zeitraum (ab ${p.pop_min_runs} Läufen), über 100 überdurchschnittlich; grün ab 110, rot bis 90. <b>Ø max Val 3j</b>: Ø der höchsten Valeur der Nachkommen als 3-Jährige, <b>Val+</b> derselbe Index (Population ab ${p.pop_min_horses} 3-jährigen Nachkommen); Preisgeld je Platz laut PMU (montantOffert, sonst 50/19/14/9/4 % des Rennpreises). <b>Klasse</b>: <b>Val+</b> = Ø Valeur der Teilnehmer und <b>Rennstärke €/L+</b> = Ø Gewinn je Lauf der Teilnehmer in den ${p.class_days} Tagen vor dem Rennen, jeweils als Index, 100 = Ø aller früheren Rennen. Nur für den Index €/L+ wird jedes Preisgeld logarithmiert, log(1 + €), und je Pferd gemittelt (einzelne hohe Preisgelder ziehen den Schnitt nicht hoch, Läufe ohne Geld zählen 0); das eigene Ø zählt, wenn der erste Start des Pferdes mindestens ein Jahr zurückliegt (in der Datenbank; reicht sie nicht so weit zurück: ab 4 Jahren) – danach immer, ohne Lauf im letzten Jahr über alle früheren Läufe; davor zählt das Ø von Trainer 50 %, Besitzer 30 % und Züchter 20 % aus den Läufen ihrer Pferde im ersten Jahr (je ${p.class_days} Tage, ab 5 Läufen). Angezeigte Beträge (€/L) bleiben der einfache Ø. Im Rennkopf für heute (grün ab 110, rot bis 90); in den Formzeilen (letzte Zeile der Rennbeschreibung) für das damalige Rennen mit Farbverlauf nach der Lage unter allen früheren Läufen der heutigen Starter – rot = niedrigster, grün = höchster Wert für dieses Rennen; ebenso das Preisgeld. <b>Abstammung</b>: A/E über die ganze Historie für Vater, Muttervater und die Kombination Vater × Muttervater (Cross).</div>
    <div><b>Laufstil</b> F führend · V vorne dabei · M Mittelfeld · H hinten – aus der Ø frühen Position der letzten ${p.style_runs} Läufe mit Tracking. <b>Pace-Szenario</b>: Norm der Distanzgruppe plus Effekt der Tempomacher und der Feldgröße, geschätzt aus früheren Rennen. <b>Bahn-Bias</b> relativ zum Schnitt aller Bahnen (0 = wie überall): (IV vorne − IV hinten) dieser Bahn/Distanz minus derselbe Wert über alle Bahnen; positiv: Frontrenner hier stärker im Vorteil als sonst, negativ: abwartend Gerittene besser; farbig ab ±0,25. Den Rohwert nennt die Zeile darunter.</div>
    <div><b>C</b> Sieger auf der Bahn · <b>D</b> Sieger über die Distanz (±100 m) · <b>CD</b> beides im selben Rennen · <b>BF</b> letzter Start als Favorit geschlagen. Wechsel (Trainer, Besitzer, Scheuklappen, erstmals Wallach) gegenüber dem letzten Lauf in der Datenbank. <b>Tage</b> seit dem letzten Lauf in der Datenbank.</div>
    <div><b>Vorlieben ▲ / ▼</b> (Trainer, Jockey, Vater, Muttervater): A/E der Vorliebe weicht deutlich und signifikant vom Rest derselben Person bzw. Linie ab – mindestens ×1,2 bzw. ×0,8 des A/E aus ihren übrigen Läufen im selben Zeitraum (Trainer/Jockey 2 Jahre, Vater/Muttervater gesamte Historie) und mindestens 2 Standardfehler, bei mindestens 20 übrigen Läufen. Wie beim Box-Urteil; Werte im Tooltip.</div>
    <div><b>Vorlieben-Vergleich</b> (Klick auf eine Zeile der Vorlieben): alle Kategorien dieser Person bzw. Linie im selben Zeitraum – z. B. alle Bahnen des Trainers, alle Jockeys, alle Böden des Vaters –, nach Läufen sortiert (höchstens 30 + die heutige), die heutige hervorgehoben. Goldener Rand am A/E (auch in den Vorlieben selbst): beste Kategorie dieser Person/Linie – höchstes A/E Platz, zum Gesamt-A/E hin geschrumpft ((Plätze + 5 × A/E gesamt) / (erwartete Plätze + 5)), ab 5 Läufen. Vater/Muttervater nach Distanz ohne 2-Jährige.</div>
    <div><b>Abstammungsprofil</b> (Detailseite, unter Vorlieben): je Vater und Muttervater die <b>Passung</b> zum heutigen Rennen auf vier Skalen – Distanz Sprinter (bis 1400 m) – Mitteldistanz (1401–2400 m) – Steher (über 2400 m); Boden Slow – Fast (nur Gras); Belag Gras – PSF; Alter 2yo – 3yo – 4yo+. Grundlage: Neigung der Linie als <b>Perzentil gegen alle Väter</b> (bzw. Muttervater) mit mindestens 50 Läufen in der Skala (Wert je Kategorie = Ø aus A/E+, Pos+ und €/L+, Distanz/Boden/Belag um das Alters-Profil der Linie korrigiert) und die Lage des Rennens als Perzentil unter allen Läufen. Passung je Skala = (Perzentil − 50) × (Lage − 50) / 25, von −100 bis +100: positiv = die Linie neigt dorthin, wo das Rennen liegt; nahe 0 = Linie ausgeglichen oder Rennen in der Mitte. ▲ ab +15, ▲▲ ab +40, ▼ / ▼▼ entsprechend, · dazwischen; blass = zu wenig Läufe (zählt nicht). Wert je Linie = Ø der Skalen, gewichtet nach Läufen; <b>Passung heute</b> = Vater und Muttervater 2 : 1. In den Formzeilen „Abst“ = Passung dieses Laufs ohne Alter (ab ±15); beim Pferd in der Hinweis-Zeile die heutige (ab ±15). Tooltip: Perzentil, Lage und Werte je Kategorie; Klick: alle Gruppen im Überblick.</div>
    <div><b>Externe Läufe</b> (Formzeilen mit „extern“): Läufe, die nicht im PMU-Programm stehen – vor allem PMH-Provinzrennen (z. B. Aurillac, Jarnac, La Roche-Posay) und Läufe im Ausland –, aus den Detail-Leistungen der PMU (letzte fünf Läufe je Starter). Bekannt sind Platz, Starterzahl, Preisgeld, Distanz, Boden, Jockey und Gewicht; keine Quote, kein Tracking, keine Valeur. Sie zählen für Form, Tage seit Lauf, Läufe und CGD, nicht für A/E von Trainer, Jockey und Abstammung.</div>
    <div><b>CGD</b> (beim Pferd in der Hinweis-Zeile neben Wechseln wie „P16“: vor dem heutigen Rennen; Formzeilen: vor diesem Lauf): Bilanz des Pferdes aus den Läufen davor auf dem <b>C</b>ourse (Kurs mit Belag), in der <b>G</b>oing-Gruppe (Bodengruppe) und in der <b>D</b>istanzgruppe – Großbuchstabe = dort schon gewonnen, klein = platziert, · = gelaufen ohne Platz, ◦ = erstmals, – = unbekannt. Zusammen mit „Abst“: ein schwacher Lauf unter ungewohnten (◦) oder für die Abstammung ungünstigen (▼) Bedingungen wiegt weniger.</div>
    <div><b>A/E-Matrix</b> (Klick auf Trainer, Jockey, Besitzer oder Züchter in „A/E · Siege/Starts“): alle Personen dieser Rolle im heutigen Feld, x = A/E+ (100 × A/E Platz), y = Pos+ (Ø (Starter − Platz) / (Starter − 1), nicht im Ziel = 0; 100 = Ø aller Läufe im Zeitraum), Fläche = €/L+; Farbe: Veränderung gegenüber der Vorperiode (gleich langes Fenster davor), A/E+ und Pos+ zusammen – grün besser, rot schlechter, abgestuft nach Deutlichkeit; blass gestrichelt unter 5 Läufen; an den Bubbles die Startnummern, darunter Legende mit Trikots und Namen. Zeitraum 30/90/365 Tage, Rolle oben umschaltbar.</div>
    <div><b>Heutige Gegner in den letzten Läufen</b>: neben „Gegner“ zusätzlich „Heutige Gegner (n)“, wenn heutige Gegner in diesem Rennen mitliefen (direkte Duelle aus genau diesem Rennen), und „Indirekt (n)“, wenn dieses Rennen Vergleichsrennen eines indirekten Duells ist – aufgeklappt mit gemeinsamem Gegner, Differenz in diesem Rennen, Rennen des heutigen Gegners und dem insgesamt erwarteten Abstand; „vorne x/y“ wie bei den Duell-Knöpfen oben.</div>
    <div><b>Power</b> (Kurzzeile): Rating, RTR, ARR, TR, Duell und Tempo (Ø aus ΔL600 A und ΔB200 A) je als z-Wert im heutigen Feld, gedämpft nach der Zahl der Läufe dahinter (× n / (n + 2)); Median der vorhandenen Werte (ab 3 von 6), Power = 100 + 10 × Median – 100 = Feldschnitt, grün ab 105, rot bis 95 (der Median streut weniger als die einzelnen Kennzahlen); #Rang im Feld. Duell zählt nur, wenn alle Pferde mit Duellen vergleichbar sind (eine Gruppe). Auch als Sortierung. Ist ein Power-Modell trainiert (power_modell.trainieren), ersetzt es diese Rechnung: LightGBM sagt (Starter − Platz) / (Starter − 1) (bzw. als Rang-Modell die Reihenfolge im Rennen) aus Rennen, Pferd, Kacheln, Vorlieben, Verbindungen, Abstammung und den letzten drei Läufen voraus, viele Werte auch relativ zum heutigen Feld (ohne heutige Prognose und Quote); Power = 100 + 10 × z dieser Vorhersage im Feld; Tooltip mit Siegchance (Softmax über das Feld, auf der Validierung geeicht), fairer Quote und den stärksten Treibern. In der Kurzzeile steht dann statt der Power-Zahl „Fair“: die faire Quote (1 / Siegchance) mit Siegchance und Rang im Feld darunter, grün/rot wie Power (≥ 105 / ≤ 95). Kleiner Punkt oben rechts: ▲ (gold) = Cote der PMU-Prognose – ohne Marge, je Rennen auf 100 % normiert – mindestens 30 % über der fairen Quote (Modell sieht das Pferd stärker als die Prognose), ▼ (grau) = mindestens 30 % darunter; nur bis Cote 30/1. Faire Quoten ab 100 als „100+“. Goldener Rahmen: Value-Modell (power_modell.trainieren_wert) – das Pferd gehört zu den obersten 10 % des Value-Faktors (wird öfter platziert, als seine Quote erwarten lässt), nur bis Cote der PMU-Prognose 10/1 (darüber verlor die Auswahl im Test klar; gestrichelt: Cote unbekannt); im Test zur PMU-Endquote etwa ausgeglichen. Roter Rahmen: unterstes Fünftel des Value-Faktors – der Markt überschätzt solche Pferde klar (A/E ≈ 0,7), das verlässlichste Value-Signal. Der Faktor im Tooltip ist auf die Validierung geeicht. Jede Karte schreibt die Value-Faktoren nach auswertung/value_protokoll.csv; power_modell.value_auswertung(BASE) zeigt die laufende Rendite.</div>
    <div><b>Starter in drei Stufen</b>: zuerst die Kurzzeile (Nummer, Trikot, Name, Alter/Geschlecht, Jockey, Trainer, Gewicht, Box, PMU-Prognose und Tipp-Konsens); ein Klick zeigt die Zeile mit allen Kennzahlen, ein weiterer die Details, ein dritter klappt wieder auf die Kurzzeile zu. „Alle aufklappen“ öffnet alle Zeilen (ohne Details); Klick auf die fixierte Leiste schließt nur die Details.</div>
    <div><b>Vergleich ARR/TR</b> (Klick auf ARR oder TR einer Formzeile): je heutigem Starter eine Zeile mit seinen Läufen der letzten ${p.kpi_days ?? 365} Tage (ohne ausgerittene, auf das heutige Gewicht bereinigt), x = Wert. Vom gewählten Pferd alle Läufe, von den anderen alle mindestens so guten und schlechtere nur bis ${(p.kpi_window || {}).arr ?? 5} kg (ARR) bzw. ${(p.kpi_window || {}).tr ?? 10} lb (TR) darunter; je blasser, desto älter. Filter oben mit Mehrfachauswahl (keiner gewählt = alle): Distanz-Abstand zu heute (±100 / 101–200 / 201–400 / mehr als 400 m, Standard ±100 m), Boden (Standard: heutige Bodengruppe), Bahn (heutige / andere, Standard: alle) und Zeitraum ab heute (letzte 30 Tage / vor 31–60 / 61–90 / 91–365 Tagen, Standard: alle). Oben lässt sich zwischen ARR und TR umschalten (gleicher Lauf, Filter bleiben). Skala: gewählter Wert ± 5 kg (ARR) bzw. ± 10 lb (TR); bessere Werte darüber stehen rechts in einer eigenen Spalte (▶ bester Wert, Anzahl), schlechtere außerhalb entfallen. Klick auf einen Punkt springt zum Starter und seiner Formzeile.</div>
    <div><b>Letzte Läufe</b>: die letzten ${p.form_runs} Läufe; gelb markiert, was dem heutigen Rennen entspricht – <b>K</b> Kurs mit gleichem Belag (PSF gegen Gras), <b>D</b> Distanz ±100 m, <b>B</b> Bodengruppe. Fehlt darunter ein Lauf auf dem Kurs (gleicher Belag), über die Distanz (±100 m) oder in der Bodengruppe von heute, steht unten (gestrichelt abgetrennt) zusätzlich der letzte ältere Lauf mit diesem Merkmal – höchstens drei, also bis zu ${p.form_runs + 3} Zeilen.</div>`;
  legendeFilter();
}

init();
</script>
